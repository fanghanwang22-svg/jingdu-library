<!DOCTYPE html>
<html lang="zh-CN">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研英语精读库</title>
<style>
  :root{--bg:#faf9f6;--ink:#1f2328;--muted:#6b7280;--line:#e5e1d8;--accent:#b45309;
    --q:#ffe98a;--w1:#d8f0d8;--w2:#d9e8fb;--w3:#ffd9d9;--side:#f3f1ea}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .app{display:flex;height:100vh;overflow:hidden}
  .side{width:266px;min-width:266px;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;height:100%}
  .brand{padding:16px 16px 10px;font-weight:700;font-size:16px;letter-spacing:.02em}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:3px}
  .side-actions{display:flex;gap:6px;padding:6px 12px 10px}
  .side-actions button{flex:1;font-size:12.5px;padding:6px 4px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .side-actions button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .art-list{flex:1;overflow:auto;padding:0 8px 8px}
  .art-item{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:5px;border:1px solid transparent}
  .art-item:hover{background:#fff}
  .art-item.active{background:#fff;border-color:#d8d2c4;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .art-item .d{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
  .art-item .t{font-size:13px;line-height:1.45;margin-top:2px}
  .badge{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:99px;background:#e9e6dd;color:#6b6252}
  .badge.done{background:#d9f0dc;color:#2f7a43}
  .badge.doing{background:#fff1c9;color:#8a6a00}
  .side-foot{padding:10px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .foot-btns{display:flex;gap:6px;margin-top:7px}
  .foot-btns button{flex:1;font-size:11.5px;padding:5px 4px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  #saved{font-variant-numeric:tabular-nums}
  main{flex:1;overflow:auto;height:100%}
  .wrap{max-width:820px;margin:0 auto;padding:26px 26px 100px}
  h1{font-size:24px;line-height:1.4;margin:4px 0 6px;font-family:Georgia,"Times New Roman",serif}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .en-title{font-family:Georgia,"Times New Roman",serif;font-size:15px;color:#4a5560;margin:-4px 0 10px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar .sp{flex:1}
  button{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  button:hover{border-color:#c9c2b3}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
  .tabs button{border:none;background:transparent;border-bottom:2px solid transparent;border-radius:0;padding:8px 11px;color:var(--muted);font-size:13px}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .hint{font-size:13px;color:#3d4450;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.8;margin-bottom:18px}
  .hint b{color:var(--accent)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-8px 0 16px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #article{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:2.05}
  #article .para{margin:0 0 1.4em}
  .hl{cursor:pointer;border-radius:3px;padding:1px 0}
  .hl-q{background:var(--q);box-shadow:inset 0 -2px 0 #e3b23c}
  .hl-w1{background:var(--w1);box-shadow:inset 0 -1.5px 0 #7cc47c}
  .hl-w2{background:var(--w2);box-shadow:inset 0 -1.5px 0 #6aa7e0}
  .hl-w3{background:var(--w3);box-shadow:inset 0 -1.5px 0 #e07a7a}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .tr{margin-bottom:18px}
  .tr .no{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  .tr .zh{font-size:15.5px;line-height:1.95;margin-top:4px}
  .qbox{margin-bottom:18px}
  .stem{font-size:15px;line-height:1.6;margin-bottom:10px}
  .qid{display:inline-block;background:var(--ink);color:#fff;border-radius:5px;padding:1px 7px;font-size:12px;margin-right:4px}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{text-align:left;font-size:14.5px;line-height:1.55;padding:8px 12px;background:#fbfaf7}
  .opt b{font-family:-apple-system,sans-serif;font-size:12.5px;color:var(--muted);margin-right:4px}
  .opt.sel{background:#fff8dc;border-color:#e3b23c;box-shadow:0 0 0 1px #e3b23c inset}
  .opt.key{background:#e8f5e9;border-color:#7cb87f}
  .analysis{background:#f8f6f0;border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:13.5px;line-height:1.85;margin-top:8px}
  .analysis .w{color:#8a4b4b}
  .vs{font-size:14px;line-height:1.9}
  .vs .w{font-weight:600}
  .vs .lv{font-size:11px;color:var(--muted);margin-left:6px}
  .lsec{margin-bottom:20px}
  .lsec .ref{display:inline-block;font-size:11.5px;background:var(--ink);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px}
  .lsec .en{font-family:Georgia,serif;font-size:16px;line-height:1.9;margin:6px 0}
  .chunk{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13.5px;line-height:1.8}
  .chunk .a{font-family:Georgia,serif;color:#39404a}
  .chunk .b{color:#4a5560}
  .sub{font-size:12px;color:var(--muted);letter-spacing:.04em;margin:12px 0 6px;font-weight:700}
  .points{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.9}
  .qa-q{font-weight:600;font-size:14.5px;margin:4px 0 6px}
  .qa-a{font-size:14px;line-height:1.9;color:#333a44}
  .qa-item{padding:14px 0;border-bottom:1px dashed var(--line)}
  .qa-item:last-child{border-bottom:none}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .filters select,.filters input{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  .wtable{width:100%;border-collapse:collapse;font-size:13px}
  .wtable th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .wtable td{padding:7px 8px;border-bottom:1px solid #f0eee8;vertical-align:top;line-height:1.65}
  .wtable td.w{font-weight:600;white-space:nowrap}
  .st{cursor:pointer;font-size:11.5px;padding:1px 7px;border-radius:99px;background:#eee;color:#666;white-space:nowrap}
  .st.learning{background:#fff1c9;color:#8a6a00}
  .st.known{background:#d9f0dc;color:#2f7a43}
  .bubble{position:fixed;z-index:100;background:#1f2328;color:#fff;border-radius:10px;padding:8px 10px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px;min-width:190px;max-width:340px}
  .bubble.hidden{display:none}
  .bubble .bh{font-size:12.5px;color:#cfd6e0;padding:0 2px}
  .bubble .row{display:flex;gap:8px;justify-content:flex-end}
  .bubble .tbar{display:flex;gap:6px}
  .bubble button{padding:5px 11px;font-size:12.5px;border-radius:6px;border:1px solid #3a4048;background:#2c3239;color:#fff}
  .bubble button:hover{background:#3a4149}
  .bubble button.ghost{background:transparent;border-color:transparent;color:#aab3c0}
  .bubble input{width:100%;font:inherit;font-size:13.5px;padding:7px 9px;border-radius:7px;border:1px solid #3a4048;background:#12161a;color:#fff;outline:none}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;background:#1f2328;color:#fff;
    padding:11px 20px;border-radius:99px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s}
  .toast.hidden{opacity:0;pointer-events:none;bottom:14px}

  .tcard .tt{font-weight:700;font-size:16px}
  .tcard .tdesc{font-size:13.5px;line-height:1.75;color:#4a5560}
  .tbar{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .tres{font-size:13px;color:#6b6b6b}
  .tres b{color:#2f7a43}
  .tsec{margin-bottom:24px}
  .tq .stem{font-size:14.5px}
  .opt.ro{cursor:default}
  .opt.wrong{background:#fdecea;border-color:#e08e88}
  .qid.ok{background:#2f7a43}
  .qid.bad{background:#a33}
  .tresult .bigscore{font-size:38px;font-weight:800;color:#2f7a43;letter-spacing:.02em}
  @media (max-width:760px){
    .side{width:210px;min-width:210px}
    .wrap{padding:20px 16px 80px}
    #article{font-size:18px}
    .chunk{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">考研英语精读库<small>标记自动保存 · 每天一篇</small></div>
    <div class="side-actions">
      <button data-view="article" class="active" id="btn-v-article">文章</button>
      <button data-view="vocab" id="btn-v-vocab">词汇总览</button>
      <button data-view="qa" id="btn-v-qa">问答记录</button>
      <button data-view="test" id="btn-v-test">阶段测试</button>
    </div>
    <div class="art-list" id="artList"></div>
    <div class="side-foot">
      <div id="built" style="margin-bottom:4px;color:#8a6a00"></div>
      <div style="margin-bottom:8px"><a id="link-review" href="review.html" target="_blank" style="display:block;text-align:center;text-decoration:none;background:#1f2328;color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px">🧠 记忆训练</a></div>
      <div id="saved">—</div>
      <div class="foot-btns">
        <button id="btn-export">导出备份</button>
        <button id="btn-import">导入备份</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="bubble" class="bubble hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
window.__DATA__ = {"articles": [{"date": "2026-11-12", "title": "脑子为什么会累？——认知疲劳的分子线索", "source": "Scientific American（2026-11-04）", "words": 500, "difficulty": "L2 中档", "status": "done", "completed": true, "paragraphs": [["It's been a grueling year for Hongmei Xia.", "A Ph.D. student in cognitive neuroscience at Ludwig Maximilian University of Munich in Germany, she's spent long days wrestling with an enduring scientific mystery: What happens in the brain to cause mental fatigue?", "The problem was personal for Xia—she often felt drained after hours of research.", "But for decades, scientists didn't understand the neural underpinnings of cognitive exhaustion."], ["Now she and her colleagues have discovered a likely molecular culprit: glutamate, a common neurotransmitter.", "They found that glutamate builds up in parts of the brain when we perform challenging mental tasks.", "As the molecules accumulate, they seem to tank our motivation—even when we stand to gain big by persevering."], ["The work builds on past research that had hinted at glutamate's role in mental fatigue.", "In 2022, for example, a team of researchers in Paris reported that sustained mental effort led to the accumulation of glutamate in the lateral prefrontal cortex, a brain region responsible for cognitive control.", "But experts say Xia and her colleagues' work provides the strongest evidence yet of a link between glutamate and mental fatigue.", "\"This is a causal study,\" says Clay Holroyd, a cognitive neuroscientist at Ghent University in Belgium.", "\"It's a very nice piece to this overall puzzle.\""], ["To test their theory, the researchers used electrodes to stimulate the dorsolateral prefrontal cortex in participants' brains as they tried to remember letters they'd seen flashed on a screen.", "The zaps boosted their performance on the task, but afterward the participants were less willing to engage in other cognitively demanding tasks than those whose brains weren't stimulated, suggesting higher mental fatigue.", "A statistical analysis revealed that increasing levels of glutamate could account for the fatigue."], ["The findings could help explain why mental fatigue feels unpleasant.", "In large enough concentrations, glutamate can damage brain cells, Xia says, so perhaps the sense of fighting to stay focused is actually \"a safety signal to tell you, 'Okay, you should take a break.'\"", "If our minds are constantly running at full throttle, potentially harmful molecules might keep piling up faster than the brain can dispose of them."], ["Scientists have long debated whether mental fatigue is a neurobiological or psychological process.", "Some in the psychology camp argue that fatigue creeps up when we fixate on a relatively unimportant task at the expense of more rewarding activities.", "According to Mathias Pessiglione, a cognitive neuroscientist at the Paris Brain Institute and senior author of the 2022 glutamate paper, the new study rules out a purely psychological explanation by showing that neurobiological changes alone can induce fatigue.", "But Pessiglione suspects that psychological factors, such as motivations and beliefs, also play a key role.", "\"A comprehensive account should articulate the two levels,\" he says."], ["Xia hopes the findings will one day lead to treatments for people who are especially prone to mental fatigue, such as those with depression and schizophrenia.", "For now, however, her prescription for an overworked mind is simple: switch to easier tasks and let your gray matter recover."]], "translations": ["对洪梅·夏（Hongmei Xia）来说，这是令人筋疲力尽的一年。作为德国慕尼黑大学认知神经科学专业的博士生，她长期致力于破解一个历久弥新的科学谜题：大脑里究竟发生了什么，才导致了精神疲劳？这个问题对她而言切身相关——在数小时的研究之后，她常常感到精疲力竭。但几十年来，科学家一直不理解认知疲劳背后的神经机制。", "如今，她和同事们发现了一个可能的分子「元凶」：谷氨酸，一种常见的神经递质。他们发现，当我们进行有挑战性的脑力任务时，谷氨酸会在大脑的某些部位堆积。随着这些分子不断累积，它们似乎会大幅削弱我们的动机——即便坚持下来可能带来巨大收益。", "这项工作建立在以往研究的基础之上——那些研究曾暗示谷氨酸在精神疲劳中起作用。例如，2022 年巴黎的一个研究团队报告称，持续的脑力付出会导致前额叶皮层（一个负责认知控制的脑区）中谷氨酸的累积。但专家表示，夏和同事的工作提供了迄今最有力的证据，证明谷氨酸与精神疲劳之间存在联系。「这是一项因果研究，」比利时根特大学的认知神经科学家克莱·霍尔罗伊德说，「它是这个整体拼图中非常漂亮的一块。」", "为检验他们的理论，研究者用电极刺激被试大脑的背外侧前额叶皮层，同时让他们记住屏幕上闪现的字母。这些电刺激提升了他们在任务中的表现，但之后，相比大脑未受刺激的被试，他们更不愿意再去做其他需要认知努力的任务，这表明他们精神疲劳程度更高。一项统计分析显示，谷氨酸水平的升高可以解释这种疲劳。", "这些发现或有助于解释，为什么精神疲劳让人感觉难受。夏说，当浓度足够高时，谷氨酸会损伤脑细胞，因此，那种努力保持专注的感觉或许实际上是一个「安全信号」，在告诉你：「好了，你该歇一歇了。」如果我们的大脑一直全速运转，可能有害的分子也许就会以超过大脑清除速度的方式不断堆积。", "科学家长期以来一直在争论：精神疲劳究竟是一个神经生物学过程，还是一个心理过程。心理学阵营的一些人认为，疲劳是当我们死盯着一件相对不重要的事、而牺牲了更有回报的活动时悄悄出现的。巴黎脑研究所的认知神经科学家、2022 年那篇谷氨酸论文的资深作者马蒂亚斯·佩西利奥内认为，新研究证明了仅凭神经生物学变化就能诱发疲劳，从而排除了纯粹心理学的解释。但佩西利奥内怀疑，心理因素（比如动机与信念）也起着关键作用。「一个完整的解释，应当把这两个层面都讲清楚，」他说。", "夏希望这些发现有朝一日能为那些特别容易精神疲劳的人（比如抑郁症和精神分裂症患者）带来治疗手段。不过眼下，她给过度劳累的大脑开的「处方」很简单：换做更轻松的任务，让你的大脑恢复一下。"], "questions": [{"id": "Q1", "label": "主旨题", "stem": "Which of the following best summarizes the main idea of the text?", "options": ["Mental fatigue is linked to a buildup of glutamate in the brain, according to new causal evidence.", "Psychological factors are now considered the primary cause of cognitive exhaustion.", "Scientists have found a cure for people with depression and schizophrenia.", "Electrode stimulation can permanently improve cognitive performance."], "answer": "A", "analysis": "全文主线：Xia 团队发现谷氨酸堆积与精神疲劳的因果联系（S05/S10）。", "wrong": {"B": "反向表述：P6 说新研究排除了纯心理解释，作者没有把心理因素当主因。", "C": "过度推断：P7 只是 hopes one day lead to treatments，不是已经找到 cure。", "D": "偷换 + 绝对化：电极是实验手段，原文没说永久提升。"}}, {"id": "Q2", "label": "例证目的题", "stem": "The 2022 study by researchers in Paris is mentioned mainly to ______.", "options": ["prove that glutamate is the only cause of mental fatigue", "show that earlier research had already pointed to glutamate's role", "criticize the methodology used by Xia's team", "explain why mental effort can be rewarding"], "answer": "B", "analysis": "S08「builds on past research that had hinted…」：2022 研究是前人线索，用于铺垫新研究的因果证据。", "wrong": {"A": "only 绝对化：原文是 the strongest evidence yet，not the only cause。", "C": "无中生有：文中没有批评 Xia 团队的方法。", "D": "无中生有：没解释 effort 为何值得，反而说 effort 导致疲劳。"}}, {"id": "Q3", "label": "推理题", "stem": "It can be inferred from Pessiglione's remarks that ______.", "options": ["the new study has settled the debate once and for all", "psychological factors play no role in mental fatigue", "the study supports a neurobiological explanation but does not rule out psychological ones", "glutamate levels can never be measured accurately"], "answer": "C", "analysis": "S21 支持神经解释（rules out purely psychological）+ S22「但心理因素也关键」+ S23「两个层面都要讲」→ 折中综合。", "wrong": {"A": "once and for all 绝对化：文章还提到其他分子（lactate 等）仍在研究。", "B": "反向：Pessiglione 明确说心理因素也起关键作用。", "D": "无中生有：全文没有讨论测量精度问题。"}}, {"id": "Q4", "label": "词义题", "stem": "The word \"tank\" in Paragraph 2 most probably means ______.", "options": ["store up", "sharply reduce", "strengthen", "measure"], "answer": "B", "analysis": "S07 让步句 even when we stand to gain big 说明「即使坚持有大收益，动机仍被拉低」→ tank = 大幅削弱。", "wrong": {"A": "store up 是 accumulate 的意思，方向相反。", "C": "strengthen 反义。", "D": "measure 无中生有。"}}], "longSentences": [{"ref": "S09", "text": "In 2022, for example, a team of researchers in Paris reported that sustained mental effort led to the accumulation of glutamate in the lateral prefrontal cortex, a brain region responsible for cognitive control.", "main": "a team of researchers reported that sustained mental effort led to the accumulation of glutamate", "chunks": [["In 2022, for example", "例如在 2022 年"], ["a team of researchers in Paris reported that …", "巴黎的一个研究团队报告称……"], ["sustained mental effort led to the accumulation of glutamate", "持续的脑力付出导致谷氨酸累积"], ["in the lateral prefrontal cortex", "在前额叶皮层（外侧）"], ["a brain region responsible for cognitive control", "（同位语）一个负责认知控制的脑区"]], "translation": "例如在 2022 年，巴黎的一个研究团队报告称，持续的脑力付出会导致前额叶皮层中谷氨酸的累积，而前额叶皮层是一个负责认知控制的脑区。", "points": ["that 引导宾语从句（reported that…）", "同位语 a brain region responsible for… 用来解释专业名词——考研遇到术语先看同位语", "led to = 导致；responsible for = 负责"]}, {"ref": "S20", "text": "Some in the psychology camp argue that fatigue creeps up when we fixate on a relatively unimportant task at the expense of more rewarding activities.", "main": "Some argue that fatigue creeps up", "chunks": [["Some in the psychology camp", "心理学阵营的一些人"], ["argue that", "认为 / 主张"], ["fatigue creeps up", "疲劳悄悄袭来"], ["when we fixate on a relatively unimportant task", "当我们死盯着一件相对不重要的事时"], ["at the expense of more rewarding activities", "以牺牲更有回报的活动为代价"]], "translation": "心理学阵营的一些人认为：当我们为了一件相对不重要的事钻牛角尖，而牺牲掉更有回报的活动时，疲劳就会悄悄袭来。", "points": ["argue that = 主张/认为（熟词僻义，不是「争论」）", "creep up 不及物，指「不知不觉出现/爬升」，常接抽象主语", "fixate on A at the expense of B = 为了 A 牺牲 B（取舍错位）"]}, {"ref": "S21", "text": "According to Mathias Pessiglione, a cognitive neuroscientist at the Paris Brain Institute and senior author of the 2022 glutamate paper, the new study rules out a purely psychological explanation by showing that neurobiological changes alone can induce fatigue.", "main": "the new study rules out a purely psychological explanation", "chunks": [["According to Mathias Pessiglione, …", "据马蒂亚斯·佩西利奥内（介绍身份的同位语）……"], ["the new study rules out a purely psychological explanation", "新研究排除了纯粹心理学的解释"], ["by showing that …", "其方式是证明……"], ["neurobiological changes alone can induce fatigue", "仅神经生物学变化就能诱发疲劳"]], "translation": "据巴黎脑研究所认知神经科学家、2022 年那篇谷氨酸论文的资深作者马蒂亚斯·佩西利奥内所言，新研究通过证明「仅凭神经生物学变化就能诱发疲劳」，排除了纯粹心理学的解释。", "points": ["According to 引出他人观点，注意观点归属", "by showing that… 是方式状语（通过证明……）", "rule out = 排除；induce = 诱发"]}, {"ref": "S23", "text": "\"A comprehensive account should articulate the two levels,\" he says.", "main": "A comprehensive account should articulate the two levels", "chunks": [["A comprehensive account", "一个全面的解释"], ["should articulate", "应当清晰阐明"], ["the two levels", "这两个层面（指代 S19 的神经生物学 / 心理层面）"]], "translation": "「一个完整的解释，应当把这两个层面都讲清楚，」他说。", "points": ["account 这里是「解释/论述」，不是「账户」", "articulate = 清晰表达；the two levels 是回指，考研常考指代还原", "should 表「应然」，是观点句标志"]}, {"ref": "S25", "text": "For now, however, her prescription for an overworked mind is simple: switch to easier tasks and let your gray matter recover.", "main": "her prescription for an overworked mind is simple", "chunks": [["For now, however", "不过眼下"], ["her prescription for an overworked mind is simple", "她给过度劳累的大脑开的「处方」很简单"], ["switch to easier tasks", "换做更轻松的任务"], ["and let your gray matter recover", "让你的大脑（灰质）恢复一下"]], "translation": "不过眼下，她给过度劳累的大脑开的「处方」很简单：换做更轻松的任务，让你的大脑恢复一下。", "points": ["prescription 比喻义：处方 → 解决方案", "let sb do sth：使役动词 + 宾语 + 动词原形（不带 to）", "gray matter 灰质，口语引申「脑子」；英式拼 grey"]}], "qa": [{"q": "cortex 怎么记？", "a": "拉丁「树皮」→ 包在大脑外层的皮层。cortex 皮层；cortical 皮层的；常见组合：prefrontal cortex 前额叶皮层、cerebral cortex 大脑皮层、adrenal cortex 肾上腺皮质。"}, {"q": "causal 是什么意思？和 casual 怎么区分？", "a": "causal /ˈkɔːzl/ = 因果的（cause + -al）；casual /ˈkæʒuəl/ = 随意的。学术高频：causal study 因果研究、causal link 因果联系；correlation does not imply causation（相关不等于因果）。S11「This is a causal study」是在给新研究定性：它提供因果证据，而不只是相关。"}, {"q": "「小心的」是哪个单词？", "a": "最贴切是 cautious /ˈkɔːʃəs/ 谨慎的；其他：careful 小心的/仔细的、wary 警惕的、prudent 审慎的、discreet 言行谨慎的、circumspect 非常慎重周全的。形近四词：causal 因果、casual 随意、cautious 谨慎、caustic 刻薄的。态度题里 cautious 常表示「谨慎乐观/留有余地」。"}, {"q": "dorsolateral prefrontal cortex 是什么？为什么「背侧」会在脑子里？", "a": "背外侧前额叶皮层，缩写 DLPFC，是前额叶靠上、靠外侧的部分，负责工作记忆和认知控制。解剖的 dorsal/ventral 是相对方位：在大脑里 dorsal 指「朝头顶（上）」，ventral 指「朝颅底（下）」——这是胚胎神经管弯折留下的术语习惯，不是指人的后背。考试只需拆出「前 + 上 + 外 + 皮层」，重点看后面的同位语解释。"}, {"q": "concentrations 在本句是什么意思？", "a": "浓度。In large enough concentrations = 当浓度足够高时。多义：① 浓度（in high concentrations / at a concentration of）② 专注（lose concentration）③ 集中（concentration of power）。判断靠介词搭配。"}, {"q": "let your gray matter recover 怎么分析？", "a": "let sb do sth：使役动词 + 宾语 + 动词原形（不带 to）；recover 恢复。gray matter 灰质，口语引申「脑子、脑力」，美式 gray / 英式 grey；对比 white matter 白质。整句 = 让你的大脑恢复一下。"}, {"q": "文章是怎么证明谷氨酸是罪魁祸首的？刺激前额叶→表现更好但更疲劳，怎么就证明「谷氨酸损伤脑细胞」了？", "a": "文章只证明了「谷氨酸积累 → 疲劳」的因果：① 2022 年研究提示相关性；② 新研究用电极主动操纵 DLPFC → 表现提升（操纵有效）＋ 之后更不愿做费脑任务（疲劳指标）＋ 统计上谷氨酸能解释疲劳 → 因果证据。但「谷氨酸损伤脑细胞」是引用文献的已知毒性 + 作者推测（can / perhaps / might），且 In large enough concentrations 是条件假设——本实验没有测量细胞损伤，也没建立浓度-毒性对应关系。所以考研推理题若说 proves glutamate damages brain cells 就是过度推断；正确项只到「与疲劳的因果联系 / 可能是休息信号」。"}], "vocab": [{"word": "wrestling", "def": "v. 努力应对（难题）；摔跤", "coll": "wrestle with a problem", "level": "L1", "note": "名词 wrestling = 摔跤"}, {"word": "tank", "def": "v. 大幅下跌；削弱", "coll": "tank our motivation；tank the economy", "level": "L1", "note": "名词「坦克/水箱」→ 熟词僻义"}, {"word": "sustained", "def": "adj. 持续的", "coll": "sustained effort / attention", "level": "L1", "note": "sustain v. 维持"}, {"word": "boosted", "def": "v. 提升", "coll": "boost performance / confidence", "level": "L1", "note": "n. a boost"}, {"word": "account for", "def": "解释；占（比例）", "coll": "account for the fatigue", "level": "L1", "note": "三义：解释 / 占比 / 负责"}, {"word": "dispose", "def": "dispose of 处理掉、清除", "coll": "dispose of waste", "level": "L1", "note": "n. disposal"}, {"word": "comprehensive", "def": "adj. 全面的", "coll": "a comprehensive account", "level": "L1", "note": "v. comprehend 理解"}, {"word": "grueling", "def": "adj. 折磨人的、极累的", "coll": "a grueling year", "level": "L2", "note": "上下文负面；gruel 稀粥"}, {"word": "drained", "def": "adj. 精疲力竭的", "coll": "feel drained after hours of work", "level": "L2", "note": "drain 排水 → 被抽干"}, {"word": "molecular culprit", "def": "分子层面的「罪魁祸首」", "coll": "the molecular culprit", "level": "L2", "note": "culprit 罪犯 → 元凶"}, {"word": "led to", "def": "导致", "coll": "effort led to accumulation", "level": "L2", "note": "lead-led-led"}, {"word": "electrodes", "def": "n. 电极", "coll": "electrodes stimulate the brain", "level": "L2", "note": "electro- 电"}, {"word": "sense of fighting", "def": "挣扎感", "coll": "the sense of fighting to stay focused", "level": "L2", "note": "of + doing 名词化"}, {"word": "throttle", "def": "n. 油门；v. 抑制", "coll": "at full throttle 全速", "level": "L2", "note": "车/机语境，引申「全速运转」"}, {"word": "neurobiological", "def": "adj. 神经生物学的", "coll": "neurobiological changes", "level": "L2", "note": "neuro- 神经 + biological"}, {"word": "psychological", "def": "adj. 心理的", "coll": "a purely psychological explanation", "level": "L2", "note": "psych- 心理"}, {"word": "prone", "def": "adj. 易于…的；（俯）卧的", "coll": "be prone to fatigue", "level": "L2", "note": "两个义项都要认识"}, {"word": "prescription", "def": "n. 处方；解决方案", "coll": "her prescription is simple", "level": "L2", "note": "v. prescribe 开处方"}, {"word": "cognitive", "def": "adj. 认知的", "coll": "cognitive neuroscience", "level": "L3", "note": "cogn- 知道（recognize 同根）"}, {"word": "neuroscience", "def": "n. 神经科学", "coll": "cognitive neuroscience", "level": "L3", "note": "neuro- 神经"}, {"word": "glutamate", "def": "n. 谷氨酸（一种神经递质）", "coll": "glutamate builds up", "level": "L3", "note": "专名，认得即可，不用会拼"}, {"word": "prefrontal cortex", "def": "前额叶皮层", "coll": "the lateral prefrontal cortex", "level": "L3", "note": "pre- 前 + frontal 额 + cortex 皮层"}, {"word": "dorsolateral", "def": "adj. 背外侧的", "coll": "dorsolateral prefrontal cortex", "level": "L3", "note": "dorso- 背 + lateral 侧"}, {"word": "fatigue", "def": "n. 疲劳", "coll": "mental fatigue", "level": "L3", "note": "≈ exhaustion（同义替换）"}, {"word": "molecules", "def": "n. 分子", "coll": "harmful molecules pile up", "level": "L3", "note": "adj. molecular"}, {"word": "schizophrenia", "def": "n. 精神分裂症", "coll": "depression and schizophrenia", "level": "L3", "note": "专名，认得即可"}, {"word": "hinted", "def": "v. 暗示", "coll": "hint at sth", "level": "L3", "note": "hint n. 线索"}, {"word": "zaps", "def": "n. 电击、电刺激", "coll": "the zaps boosted performance", "level": "L3", "note": "口语 zap = 快速做"}, {"word": "revealed", "def": "v. 揭示、显示", "coll": "reveal the truth", "level": "L3", "note": "≈ showed"}, {"word": "piling up", "def": "堆积", "coll": "molecules keep piling up", "level": "L3", "note": "= accumulating"}, {"word": "creeps up", "def": "悄悄出现、逐渐上升", "coll": "fatigue creeps up", "level": "L3", "note": "creep-crept-crept（爬）"}, {"word": "fixate on", "def": "死盯、过度专注于", "coll": "fixate on an unimportant task", "level": "L3", "note": "常带贬义"}, {"word": "articulate", "def": "v. 清晰表达、阐明", "coll": "articulate the two levels", "level": "L3", "note": "adj. 口齿清晰的"}, {"word": "yet（最高级 + yet）", "def": "迄今为止", "coll": "the strongest evidence yet of a link", "level": "L3", "note": "不是「yet of」搭配，yet=so far"}, {"word": "stand to do", "def": "有望、预计会", "coll": "stand to gain big", "level": "L3", "note": "stand to gain / lose"}, {"word": "at the expense of", "def": "以…为代价", "coll": "at the expense of more rewarding activities", "level": "L3", "note": "与 S20 联动记忆"}, {"word": "cortex", "def": "n. （大脑）皮层；原义树皮", "coll": "cerebral cortex；prefrontal cortex", "level": "延伸", "note": "拉丁「树皮」→ 包在外层；adj. cortical"}, {"word": "causal", "def": "adj. 因果的", "coll": "a causal study；a causal link", "level": "延伸", "note": "cause + -al；≠ casual（随意的）"}, {"word": "cautious", "def": "adj. 谨慎的", "coll": "a cautious approach；be cautious about", "level": "延伸", "note": "与 causal / casual 三词辨析"}, {"word": "caustic", "def": "adj. 腐蚀性的；刻薄的", "coll": "caustic remarks", "level": "延伸", "note": "化学义 → 言辞义"}, {"word": "concentrations", "def": "n. 浓度；（注意力）专注；集中", "coll": "in high concentrations；lose concentration", "level": "延伸", "note": "con- 共同 + centr 中心 → 往中心聚；多义词"}, {"word": "gray matter", "def": "n. 灰质；引申「脑子、脑力」", "coll": "let your gray matter recover；use your gray matter", "level": "延伸", "note": "美 gray / 英 grey；对比 white matter 白质"}], "theme": "科普/心理"}, {"date": "2026-11-13", "title": "中国负债大亨拖累银行体系", "title_en": "Indebted tycoons haunt China's banking system", "source": "The Economist（2026.11.07 期 · Finance & economics）", "words": 511, "difficulty": "L2 中档（财经词汇密集）", "status": "done", "completed": true, "paragraphs": [["ON OCTOBER 31ST Bank of Shanghai gave investors a nasty shock.", "It said its net profit had collapsed by 93% in the third quarter, year on year, to 350m yuan ($53m); its non-performing loans shot up by 75% in the first nine months of 2026; and the capital set aside to cover unexpected losses hit the lowest in a decade.", "Its share price plunged by over 10%.", "The main source of the lender's troubles seems to be its relationship with one man, Yao Zhenhua."], ["Mr Yao has been stalking Chinese finance since 2015.", "That year his conglomerate, Baoneng, made a hostile bid for Vanke, a giant property developer.", "This was a triple surprise: such takeovers are almost unheard of in China; they are entirely unheard of when the target is, like Vanke, partly state-owned; and Baoneng financed the deal in an unconventional way, using premiums from several insurers it owned.", "This brazenness earned Mr Yao the nickname \"barbarian\", in tribute to American corporate raiders of the late 1980s."], ["The takeover failed and Mr Yao's use of premiums was found to be illegal (China tightly regulates how they can be invested).", "In 2017 he was banned from the insurance industry for ten years.", "But he expanded his empire in other areas.", "This included a 6.6bn yuan debt-fuelled investment in Qoros, a maker of electric cars.", "As Bank of Shanghai has disclosed, commercial conquest has not gone well for the barbarian."], ["As part of a long-running lawsuit against Mr Yao and Baoneng, the lender has sought to recover loans extended to his companies worth at least 12.9bn yuan.", "The loans were secured in 2020 with property and with personal guarantees from Mr Yao.", "This collateral took a hit when China's property sector imploded.", "Qoros, meanwhile, sold too few cars and folded.", "In January this year Mr Yao, whose poor credit score bans him from commercial flights and luxury hotels, appeared in a social-media post claiming that local government officials had cheated him out of his investment in the car firm."], ["The most stunning revelation from Bank of Shanghai is that Mr Yao and his companies have \"no executable assets\" from which to recover those debts.", "This would explain photos posted to social media of someone looking remarkably like him riding the metro in Shenzhen, a big southern city, rather than taking a limo.", "More importantly for Bank of Shanghai's investors, it explains what happened to the lender's profits, which were eaten up by huge impairment losses.", "Many other Chinese banks that have done business with Mr Yao and Baoneng may be next."], ["Mr Yao is not the first tycoon to rattle the banking system.", "In 2019 another, Xiao Jianhua, caused a mini financial crisis.", "He is in prison.", "A fellow indebted plutocrat, Lai Xiaomin, was executed in 2021.", "Despite the Communist Party's efforts to rid Chinese finance of such rogues, the Baoneng barbarian is probably not the last."]], "translations": ["10 月 31 日，上海银行给投资者来了个不小的惊吓。该行表示，其第三季度净利润同比暴跌 93%，降至 3.5 亿元人民币（合 5300 万美元）；2026 年前九个月不良贷款激增 75%；为覆盖意外损失而预留的资本金降至十年来最低。其股价暴跌超过 10%。这家银行麻烦的主要来源，似乎与一个人的关系有关——姚振华。", "自 2015 年以来，姚先生一直在中国金融圈四处出击。那一年，他的企业集团宝能对大型房地产开发商万科发起敌意收购。这构成了「三重意外」：此类收购在中国几乎闻所未闻；当目标是像万科这样部分国有的企业时，更是完全闻所未闻；而宝能以非常规方式为交易融资——动用其旗下几家保险公司的保费。这种胆大妄为使姚先生获得了「野蛮人」的绰号，以「致敬」上世纪 80 年代末美国的公司掠夺者。", "收购失败，姚先生动用保费的行为被认定违法（中国对保费如何投资有严格监管）。2017 年他被禁止进入保险业十年。但他向其他领域扩张版图，其中包括对电动汽车制造商观致汽车一笔 66 亿元、靠债务驱动的投资。正如上海银行所披露的，这位「野蛮人」的商业征服并不顺利。", "作为对姚先生和宝能长期诉讼的一部分，这家银行试图追回向其公司发放的至少 129 亿元贷款。这些贷款在 2020 年以房产和姚先生的个人担保作抵押。当中国房地产行业崩盘时，这些抵押品大幅缩水。与此同时，观致汽车销量太少，最终倒闭。今年 1 月，因信用记录不佳而被禁止乘坐商业航班和入住豪华酒店的姚先生，出现在一则社交媒体帖子里，声称地方政府官员骗走了他在那家汽车公司的投资。", "上海银行最令人震惊的披露是：姚先生及其公司「没有可供执行的资产」，无法用来偿还这些债务。这或许可以解释社交媒体上那些照片——照片里的人酷似他，在南方大城市深圳挤地铁，而不是坐豪华轿车。对上海银行的投资者而言更重要的是，这解释了该行利润的去向：利润被巨额减值损失吃掉了。其他与姚先生和宝能有业务往来的中国银行，可能是下一批。", "姚先生不是第一个撼动银行体系的大亨。2019 年，另一位大亨肖建华引发了一场小型金融危机，他如今在监狱里。另一位负债累累的富豪赖小民于 2021 年被处决。尽管中共努力清除中国金融中的这类害群之马，这位宝能「野蛮人」很可能不是最后一个。"], "questions": [{"id": "Q1", "label": "主旨题", "stem": "Which of the following best summarizes the text?", "options": ["Bank of Shanghai's losses are largely tied to one indebted tycoon, and other banks may face similar trouble.", "Chinese banks have fully recovered from the property crisis.", "Yao Zhenhua will soon repay his debts after selling his assets.", "China's insurance industry is expanding too quickly."], "answer": "A", "analysis": "全文主线：上海银行利润暴跌源于与大亨姚振华相关的坏账，且其他与姚/宝能有业务往来的银行可能步其后尘。", "wrong": {"B": "反向/无中生有：不良贷款前三季度上升 75%，资本拨备降至十年最低，谈不上「完全恢复」。", "C": "反向：文中说姚及其公司「no executable assets」，没有可变现资产。", "D": "无中生有：保险业扩张不是本文主题。"}}, {"id": "Q2", "label": "细节题", "stem": "According to the text, Yao's hostile bid for Vanke was unusual partly because ______.", "options": ["it was welcomed by the state as a market reform", "the target was partly state-owned and the bid was financed with insurance premiums", "it succeeded and made him a celebrated corporate raider", "it was funded entirely by commercial bank loans"], "answer": "B", "analysis": "P2 明确列出「三重意外」：敌意收购在中国罕见；目标万科部分国有；且用旗下保险公司保费融资（不寻常）。", "wrong": {"A": "无中生有：没有说国家欢迎；事实上这桩收购违法。", "C": "反向：takeover failed，而且他被禁入保险业十年。", "D": "偷换：融资方式是保费（premiums），不是银行贷款。"}}, {"id": "Q3", "label": "推理题", "stem": "It can be inferred from Paragraph 5 that Bank of Shanghai's third-quarter profits collapsed because ______.", "options": ["it had to book huge impairment losses on loans it may never recover", "its share price fell by more than 10%", "its non-performing loans fell sharply", "its capital reserves reached a decade high"], "answer": "A", "analysis": "P5：利润被「huge impairment losses」吃掉；而 P1 已说明拨备降至十年最低、不良贷款大增——因此可推断巨额减值损失是利润崩塌的原因。", "wrong": {"B": "因果倒置：股价下跌是结果，不是利润暴跌的原因。", "C": "反向：不良贷款「shot up by 75%」，是大幅上升。", "D": "反向：资本拨备「hit the lowest in a decade」，是十年最低。"}}, {"id": "Q4", "label": "词义题", "stem": "The word \"collateral\" in Paragraph 4 most probably means ______.", "options": ["assets pledged as security for a loan", "personal reputation in business", "government subsidies for carmakers", "insurance premiums paid by customers"], "answer": "A", "analysis": "P4：贷款以房产和姚的个人担保作抵押；房地产崩盘使「this collateral」受损——collateral = 抵押品/担保资产。", "wrong": {"B": "无中生有：P4 谈的是资产担保，不是名声。", "C": "无中生有：没有提到政府补贴。", "D": "张冠李戴：premiums 是 P2 的融资手段，不是借款抵押物。"}}], "longSentences": [{"ref": "S2", "text": "It said its net profit had collapsed by 93% in the third quarter, year on year, to 350m yuan ($53m); its non-performing loans shot up by 75% in the first nine months of 2026; and the capital set aside to cover unexpected losses hit the lowest in a decade.", "main": "It said (that) its net profit had collapsed; its non-performing loans shot up; and the capital hit the lowest", "chunks": [["It said (that) its net profit had collapsed by 93% in the third quarter, year on year, to 350m yuan", "它表示，其净利润第三季度同比暴跌 93%，降至 3.5 亿元"], ["its non-performing loans shot up by 75% in the first nine months of 2026", "其不良贷款在 2026 年前九个月激增 75%"], ["and the capital set aside to cover unexpected losses hit the lowest in a decade", "而为覆盖意外损失预留的资本降至十年来最低"]], "translation": "该行表示，其第三季度净利润同比暴跌 93%，降至 3.5 亿元；2026 年前九个月不良贷款激增 75%；而为覆盖意外损失预留的资本金降至十年来最低。", "points": ["冒号/分号并列三个分句，先抓每个分句的主谓", "set aside to cover... 是过去分词短语作后置定语，修饰 the capital", "财经文数字多：collapsed by 93%、shot up by 75% 只需知道方向，不用记数字"]}, {"ref": "S7", "text": "This was a triple surprise: such takeovers are almost unheard of in China; they are entirely unheard of when the target is, like Vanke, partly state-owned; and Baoneng financed the deal in an unconventional way, using premiums from several insurers it owned.", "main": "This was a triple surprise", "chunks": [["This was a triple surprise", "这是三重意外"], ["such takeovers are almost unheard of in China", "此类收购在中国几乎闻所未闻"], ["they are entirely unheard of when the target is, like Vanke, partly state-owned", "当目标是像万科这样部分国有的企业时，更是完全闻所未闻"], ["and Baoneng financed the deal in an unconventional way, using premiums from several insurers it owned", "而宝能以非常规方式为交易融资——动用旗下几家保险公司的保费"]], "translation": "这构成了「三重意外」：此类收购在中国几乎闻所未闻；当目标是像万科这样部分国有的企业时更是完全闻所未闻；而宝能以非常规方式为交易融资，动用了旗下几家保险公司的保费。", "points": ["冒号后三个并列分句，是「三重」的具体展开", "like Vanke 是插入语", "using... 现在分词作方式状语；it owned 是省略关系词的定语从句修饰 insurers"]}, {"ref": "S19", "text": "The most stunning revelation from Bank of Shanghai is that Mr Yao and his companies have \"no executable assets\" from which to recover those debts.", "main": "The most stunning revelation is that ... they have no executable assets", "chunks": [["The most stunning revelation from Bank of Shanghai", "上海银行最令人震惊的披露"], ["is that Mr Yao and his companies have \"no executable assets\"", "是姚先生及其公司「没有可供执行的资产」"], ["from which to recover those debts", "（定语）从中追回那些债务"]], "translation": "上海银行最令人震惊的披露是：姚先生及其公司「没有可供执行的资产」，无法用来偿还这些债务。", "points": ["表语从句 that...；from which to recover 是「介词 + which + 不定式」作定语", "executable assets = 可供执行的资产（法院执行不到的财产）", "读懂这句 = 读懂全文因果：没资产 → 贷款收不回 → 巨额减值 → 利润崩塌"]}], "qa": [{"q": "collateral 到底指什么？为什么 Q4 不选 B（个人声誉）？", "a": "collateral = 抵押品、担保资产。原文 loans were secured with property and with personal guarantees：房产（property）+ 个人担保（guarantees）就是「抵押品」。房地产崩盘后这批抵押品贬值 → collateral took a hit。声誉不是资产，也无法被处置抵债，所以 B 错。"}, {"q": "hostile bid（敌意收购）是什么？", "a": "未经目标公司管理层同意，直接向股东发出收购要约，强行收购。文中万科是部分国有企业（partly state-owned），所以敌意收购尤其罕见、敏感。常见词：hostile takeover、corporate raider（公司掠夺者/狙击手）。"}, {"q": "non-performing loans 和 impairment losses 是什么关系？", "a": "non-performing loans（不良贷款）= 借款人还不上、可能收不回的贷款，是资产质量问题；impairment losses（减值损失）= 会计上为这部分坏账计提的损失，直接冲减当期利润。所以「不良贷款激增 75%」→「巨额减值」→「净利润暴跌 93%」，三个数字是一条因果链。"}, {"q": "姚振华「野蛮人」这个称呼怎么来的？", "a": "2015 年宝能对万科发起敌意收购，并动用旗下保险公司保费融资（后被判违法）。这种激进风格让媒体把他比作 1980 年代美国的 corporate raiders（公司掠夺者），于是有了 barbarian（野蛮人）的绰号。in tribute to = 向…致敬（此处是反讽）。"}, {"q": "为什么说 no executable assets 是「最令人震惊」的披露？", "a": "因为这意味着银行即使胜诉也执行不到任何财产，129 亿贷款基本收不回 → 只能计提巨额减值 → 利润被吃掉。这也解释了为什么其他与姚/宝能有业务的银行可能步其后尘。"}, {"q": "corporate raider 是什么？和本文有什么关系？", "a": "corporate raider = 公司狙击手 / 企业掠夺者，中文常叫「门口的野蛮人」：大量买入被低估公司股票 → 发起敌意收购或施压管理层 → 拆分、重组或高价转卖获利。1980s 美国是它的黄金时代（Carl Icahn、T. Boone Pickens；《Barbarians at the Gate》讲 RJR Nabisco 收购战）。本文把姚振华的激进敌意收购比作这批人，所以给了他「barbarian」的绰号。"}, {"q": "LBO（杠杆收购）是什么？", "a": "leveraged buyout：用很少的自有资金 + 大量借债把公司买下来，再用目标公司自己的现金流/资产还债。典型结构是自有 10–20%、借 80–90%；因为要还债，收购后常裁员、砍成本、卖资产（asset stripping），这也是 raider 名声差的原因。著名案例：1988 年 KKR 以 250 亿美元收购 RJR Nabisco。生活类比：首付 100 万、贷款 900 万买楼，用租金还贷。"}, {"q": "junk bonds（垃圾债券）是什么？和 LBO 什么关系？", "a": "垃圾债券 = 信用评级低（BB 及以下）、违约风险高、因此利率高的公司债，业内更体面的叫法是 high-yield bonds（高收益债）。1980s 由 Michael Milken / 德崇证券推广，成了敌意收购的「弹药」：LBO 需要巨额资金 → 发行垃圾债券融资 → 所以「垃圾债 = 杠杆收购的燃料」。风险是经济下行时违约潮（1989–90 年垃圾债危机）。"}, {"q": "property developer 怎么理解？property 为什么是房地产？", "a": "property developer = 房地产开发商（美式常说 real estate developer）；giant 作形容词 = 大型的。property 有三个义项：① 房地产/房产（the property market / property sector，英媒首选）② 财产（personal property）③ 特性（chemical properties）。本文 a giant property developer 是 Vanke 的同位语，解释万科是干什么的——遇到公司名后的同位语，抓住它就能读懂。"}, {"q": "proper 和 property 怎么区分？", "a": "同源（拉丁 proprius =「自己的」），但词性不同：proper 是形容词「恰当的、正确的、得体的」（the proper way 正确的方式；properly 正确地）；property 是名词「财产 / 房地产 / 特性」（property market 房地产市场；chemical properties 化学性质）。记忆：-per 结尾是形容词，-ty 结尾是名词。"}, {"q": "「正确的」英文是哪个词？correct 和 right 有什么区别？", "a": "最常用 correct（客观上的正确、无误：the correct answer）和 right（更口语：You are right）。更细分：accurate 准确（数据）、precise 精确、proper 恰当（合规范）、valid 站得住脚（论证）、true 与事实相符。副词：correctly 正确地；rightly 多接评价。"}], "vocab": [{"word": "entirely", "def": "adv. 完全地，彻底地", "coll": "entirely unheard of", "level": "L1", "note": "entire 完整的 → entirely"}, {"word": "unconventional", "def": "adj. 非常规的", "coll": "an unconventional way of financing", "level": "L1", "note": "un- + conventional 常规的"}, {"word": "takeovers", "def": "n. 收购，接管", "coll": "hostile takeover 敌意收购", "level": "L1", "note": "take over 接管"}, {"word": "sector", "def": "n. 行业，部门", "coll": "the property sector 房地产行业", "level": "L1", "note": "与 section 区分"}, {"word": "folded", "def": "v. 倒闭，垮掉", "coll": "the company folded", "level": "L1", "note": "熟词僻义：折叠 →（公司）垮掉"}, {"word": "assets", "def": "n. 资产", "coll": "no executable assets", "level": "L1", "note": "反义：liabilities 负债"}, {"word": "stalking", "def": "v. 跟踪；（此处）四处猎食、伺机而动", "coll": "has been stalking Chinese finance", "level": "L2", "note": "stalk 跟踪（猎物）"}, {"word": "triple", "def": "adj. 三重的", "coll": "a triple surprise 三重意外", "level": "L2", "note": "tri- 三"}, {"word": "empire", "def": "n. 帝国；商业帝国", "coll": "build an empire", "level": "L2", "note": "引申义（非「国家」）"}, {"word": "stunning", "def": "adj. 令人震惊的", "coll": "the most stunning revelation", "level": "L2", "note": "stun 使震惊"}, {"word": "metro", "def": "n. 地铁", "coll": "ride the metro", "level": "L2", "note": "= subway；英式常用 metro"}, {"word": "nasty", "def": "adj. 糟糕的，令人不快的", "coll": "a nasty shock", "level": "L3", "note": "语气词，负面"}, {"word": "non-performing", "def": "adj. 不良的（贷款）", "coll": "non-performing loans 不良贷款", "level": "L3", "note": "NPL 缩写"}, {"word": "set aside", "def": "预留、拨出（资金）", "coll": "capital set aside to cover losses", "level": "L3", "note": "会计「拨备」"}, {"word": "plunged", "def": "v. 暴跌", "coll": "the share price plunged by 10%", "level": "L3", "note": "= plummeted"}, {"word": "lender", "def": "n. 放贷方、银行", "coll": "the lender's troubles", "level": "L3", "note": "lend → lender"}, {"word": "collateral", "def": "n. 抵押品", "coll": "property as collateral", "level": "L3", "note": "Q4 考点；担保资产"}, {"word": "imploded", "def": "v. 崩溃、内爆", "coll": "the property sector imploded", "level": "L3", "note": "im- 内 + plode 爆"}, {"word": "impairment", "def": "n. 减值（会计）", "coll": "huge impairment losses 巨额减值损失", "level": "L3", "note": "impair 损害 → 冲减利润"}, {"word": "conglomerate", "def": "n. 企业集团", "coll": "Baoneng, his conglomerate", "level": "L3", "note": "con- 共同 + glomer 团块"}, {"word": "hostile bid", "def": "敌意收购/竞购", "coll": "make a hostile bid for Vanke", "level": "L3", "note": "hostile 敌对的 + bid 出价"}, {"word": "state-owned", "def": "adj. 国有的", "coll": "a partly state-owned company", "level": "L3", "note": "state 国家 + owned 拥有"}, {"word": "premiums", "def": "n. 保费；溢价", "coll": "insurance premiums 保费", "level": "L3", "note": "保险语境 = 保费"}, {"word": "insurers", "def": "n. 保险公司", "coll": "several insurers it owned", "level": "L3", "note": "insure + -er"}, {"word": "brazenness", "def": "n. 胆大妄为，厚颜", "coll": "this brazenness earned him…", "level": "L3", "note": "brazen 厚颜的"}, {"word": "tribute", "def": "n. 致敬", "coll": "in tribute to American raiders", "level": "L3", "note": "pay tribute to"}, {"word": "raiders", "def": "n. 掠夺者；corporate raider = 公司狙击手/门口的野蛮人", "coll": "corporate raiders of the late 1980s", "level": "L3", "note": "raid 突袭；1980s 美国 LBO 时代（Icahn/Pickens）；文中指姚振华"}, {"word": "debt-fuelled", "def": "adj. 债务驱动的", "coll": "a debt-fuelled investment", "level": "L3", "note": "fuel 加燃料 → 驱动"}, {"word": "conquest", "def": "n. 征服", "coll": "commercial conquest", "level": "L3", "note": "conquer 征服"}, {"word": "tycoon", "def": "n. 大亨，巨头", "coll": "a property tycoon", "level": "L3", "note": "财经高频"}, {"word": "plutocrat", "def": "n. 财阀，富豪", "coll": "a fellow indebted plutocrat", "level": "L3", "note": "pluto- 财富 + -crat 统治者"}, {"word": "rattle", "def": "v. 使不安，撼动", "coll": "rattle the banking system", "level": "L3", "note": "拟声「嘎嘎响」→ 惊扰"}, {"word": "executed", "def": "v. 处决；执行", "coll": "was executed in 2021", "level": "L3", "note": "execute 两义"}, {"word": "barbarian", "def": "n. 野蛮人（文中绰号）", "coll": "the nickname \"barbarian\"", "level": "L3", "note": "比喻姚振华的激进收购"}, {"word": "limo", "def": "n. 豪华轿车", "coll": "rather than taking a limo", "level": "L3", "note": "limousine 的口语缩写"}, {"word": "executable", "def": "adj. 可执行的（资产=可变现的）", "coll": "no executable assets", "level": "L3", "note": "execute 执行 → 可执行"}, {"word": "leveraged buyout (LBO)", "def": "杠杆收购：少量自有资金 + 大量借债收购公司，用目标公司现金流还债", "coll": "the LBO of RJR Nabisco (1988)", "level": "延伸", "note": "leverage 杠杆；借钱放大收益与风险；常伴随 asset stripping"}, {"word": "junk bonds", "def": "垃圾债券：低评级、高利率的高收益债（high-yield bonds）", "coll": "used to finance hostile takeovers", "level": "延伸", "note": "1980s Milken/德崇证券推广；LBO 的「弹药」；评级 BB 以下"}, {"word": "property developer", "def": "房地产开发商", "coll": "a giant property developer；the property sector imploded", "level": "延伸", "note": "property 熟词僻义=房地产（= real estate）；developer 开发商/开发者"}], "theme": "金融/商业"}, {"date": "2026-11-14", "title": "魁北克的战略枫糖储备快见底了", "title_en": "Quebec's strategic maple-syrup reserve is running dry", "source": "The Economist（2026.11.14 期 · Business）", "words": 357, "difficulty": "L1 入门", "theme": "金融/商业", "status": "done", "completed": true, "paragraphs": [["QUEBEC'S STRATEGIC maple-syrup reserve is probably sweeter in the imagination than in reality, with its whitewashed barrels stacked from floor to ceiling in industrial halls.", "Yet the reserve, established in 2000 to stabilise prices and supply, is in a sticky situation: this winter it will run dry."], ["The last such calamity was in 2008, the result of several bad seasons.", "Barely had the reserve recovered when a few years later over $18m-worth of syrup was skimmed in a heist.", "More recently a series of poor harvests in the early 2020s and a sustained upswing in demand has left its barrels depleted.", "The reserve will be empty by February."], ["In a recent interview Luc Goulet of Quebec Maple Syrup Producers (PPAQ), an industry group, laid part of the blame on the uncertainty over American tariffs, which has led some buyers to bring forward purchases of Canadian syrup.", "But rising demand also reflects consumers' shift away from refined sugars in favour of more natural options.", "Canada's producers, which dominate the global supply of maple syrup, now make twice as much as a decade ago.", "Yet even that has not been enough to keep pace."], ["The industry has long centred on Quebec.", "In the early 2000s PPAQ, which controls the province's wholesale market for bulk syrup, alongside managing the reserve, introduced strict marketing restrictions and output quotas.", "A paper published last year by Qingbin Wang and co-authors at the University of Vermont found that although these measures had helped to stabilise prices through good and bad harvests, they had stymied the ability of Quebec's producers to expand their output as demand rose."], ["Between 1999 and 2005 Quebec accounted for 80% of North American production.", "By 2023, the latest year available, its share was down to 65%.", "Production in neighbouring New Brunswick has spurted.", "Buyers, who blend and package the syrup, are also sourcing more from America, particularly Vermont.", "Some of the biggest, such as Lantic and Turkey Hill Sugarbush, have built their own reserves.", "Quebec's sweet deal may be ending."]], "translations": ["魁北克的战略枫糖储备，大概在想象中比现实中更甜——白色木桶在厂房里从地板堆到天花板。然而，这个建立于 2000 年、旨在稳定价格与供应的储备，眼下处境棘手：今年冬天它就要见底了。", "上一次这样的灾难是 2008 年，由连续几个糟糕的收成季造成。储备刚缓过来没几年，价值超过 1800 万美元的枫糖又在一起盗窃案中被掠走。更近些，2020 年代初的一连串歉收加上需求的持续上升，让储备桶日渐见底。到二月，储备将彻底空了。", "在最近一次采访中，行业组织魁北克枫糖生产商协会（PPAQ）的 Luc Goulet 把部分责任归咎于美国关税的不确定性——这促使一些买家提前采购加拿大枫糖。但需求上升也反映出消费者从精制糖转向更天然的选择。主导全球枫糖供应的加拿大生产商，如今产量是十年前的两倍。即便如此，仍跟不上需求。", "该产业长期以魁北克为中心。2000 年代初，PPAQ（控制该省散装糖浆批发市场，同时管理储备）推出了严格的市场限制与产量配额。佛蒙特大学 Qingbin Wang 及合著者去年发表的一篇论文发现：尽管这些措施帮助在丰歉年份稳定了价格，却阻碍了魁北克生产商在需求上升时扩大产量的能力。", "1999 至 2005 年，魁北克占北美产量的 80%。到 2023 年（可查的最新数据），其份额降至 65%。邻省新不伦瑞克的产量猛增。负责调配与包装的买家也在更多从美国采购，尤其是佛蒙特。一些大买家（如 Lantic 与 Turkey Hill Sugarbush）已自建储备。魁北克的「甜蜜生意」或许正在走向终结。"], "questions": [{"id": "Q1", "label": "主旨题", "stem": "Which of the following best summarizes the text?", "options": ["Quebec's maple-syrup reserve is running dry and the province's dominant industry model is losing its grip.", "Maple syrup is no longer popular among consumers.", "Quebec has stopped producing maple syrup altogether.", "American tariffs have destroyed Canada's syrup industry."], "answer": "A", "analysis": "全文主线：储备见底（歉收+需求上升）＋魁北克旧的配额/管制模式稳定了价格却限制了扩张，市场份额从 80% 跌到 65%——「甜蜜生意」正在失去主导。", "wrong": {"B": "反向：需求其实在上升（消费者转向天然糖）。", "C": "无中生有：加拿大产量十年翻倍，没有停产。", "D": "过度推断：关税只是部分原因（laid part of the blame）。"}}, {"id": "Q2", "label": "细节题", "stem": "According to the text, which factor has contributed to the reserve running dry?", "options": ["A series of poor harvests and a sustained rise in demand.", "A collapse in global demand for maple syrup.", "A sharp increase in Quebec's output quotas.", "Strict marketing restrictions introduced in 2024."], "answer": "A", "analysis": "P2：「a series of poor harvests in the early 2020s and a sustained upswing in demand has left its barrels depleted」。", "wrong": {"B": "反向：需求是上升（upswing）而非崩塌。", "C": "反向/无中生有：配额是限制产出，不是增加。", "D": "时间与事实偷换：限制是 2000 年代初推出的，不是 2024 年。"}}, {"id": "Q3", "label": "推理题", "stem": "What can be inferred about PPAQ's quotas and restrictions?", "options": ["They stabilised prices but limited producers' ability to expand output.", "They caused the reserve to collapse immediately.", "They were abolished in 2023.", "They applied only to American producers."], "answer": "A", "analysis": "P4 论文结论：这些措施 helped to stabilise prices，但 stymied the ability to expand output as demand rose——稳定价格与限制扩张是一体两面。", "wrong": {"B": "过度推断：储备见底是多年歉收+需求所致，不是「立刻」崩塌。", "C": "无中生有：文中没有说废除。", "D": "张冠李戴：PPAQ 是魁北克生产者的行业组织。"}}, {"id": "Q4", "label": "词义题", "stem": "In Paragraph 1, the phrase \"sticky situation\" most probably means ______.", "options": ["a difficult and problematic situation", "a sweet and profitable business", "a temporary shortage of supply", "a successful marketing strategy"], "answer": "A", "analysis": "上下文：储备「this winter it will run dry」——面临麻烦，所以 sticky situation = 棘手处境（sticky 双关：枫糖黏稠）。", "wrong": {"B": "反向：sticky 不是 sweet 的意思，且处境是负面的。", "C": "缩小范围：不只短期短缺，是整个模式出问题。", "D": "无中生有。"}}], "longSentences": [{"ref": "S1", "text": "QUEBEC'S STRATEGIC maple-syrup reserve is probably sweeter in the imagination than in reality, with its whitewashed barrels stacked from floor to ceiling in industrial halls.", "main": "The reserve is probably sweeter in the imagination than in reality", "chunks": [["QUEBEC'S STRATEGIC maple-syrup reserve", "魁北克的战略枫糖储备"], ["is probably sweeter in the imagination than in reality", "大概在想象中比现实中更甜"], ["with its whitewashed barrels stacked from floor to ceiling in industrial halls", "（with 复合结构）白色木桶在厂房里从地板堆到天花板"]], "translation": "魁北克的战略枫糖储备，大概在想象中比现实中更甜——白色木桶在厂房里从地板堆到天花板。", "points": ["with + 宾语 + 过去分词（stacked）是 with 复合结构，作伴随状语", "sweeter 是双关：字面「更甜」，暗指「想象更美好」", "in reality / in the imagination 对照"]}, {"ref": "S4", "text": "Barely had the reserve recovered when a few years later over $18m-worth of syrup was skimmed in a heist.", "main": "the reserve had recovered", "chunks": [["Barely had the reserve recovered", "储备刚刚恢复过来"], ["when a few years later", "就在几年之后"], ["over $18m-worth of syrup was skimmed in a heist", "价值超过 1800 万美元的枫糖在一起盗窃案中被掠走"]], "translation": "储备刚缓过来没几年，价值超过 1800 万美元的枫糖又在一起盗窃案中被掠走。", "points": ["否定副词 Barely 置句首 → 部分倒装：Barely had + 主语 + done", "barely… when… = 刚一…就…（同 hardly… when…）", "$18m-worth of = 价值 1800 万美元的"]}, {"ref": "S13", "text": "A paper published last year by Qingbin Wang and co-authors at the University of Vermont found that although these measures had helped to stabilise prices through good and bad harvests, they had stymied the ability of Quebec's producers to expand their output as demand rose.", "main": "A paper found that they had stymied the ability to expand output", "chunks": [["A paper published last year by … found that", "去年由…发表的一篇论文发现"], ["although these measures had helped to stabilise prices through good and bad harvests", "尽管这些措施帮助在丰歉年份稳定了价格"], ["they had stymied the ability of Quebec's producers to expand their output", "却阻碍了魁北克生产商扩大产量的能力"], ["as demand rose", "在需求上升之际"]], "translation": "佛蒙特大学 Qingbin Wang 及合著者去年发表的一篇论文发现：尽管这些措施帮助在丰歉年份稳定了价格，却阻碍了魁北克生产商在需求上升时扩大产量的能力。", "points": ["published last year by… 是过去分词短语作后置定语修饰 A paper", "found that + 宾语从句；从句内 although 让步 + 主句", "stymie = 阻碍（≈ hinder）；as demand rose 时间状语"]}], "qa": [{"q": "sticky situation 是不是双关？为什么选「棘手处境」？", "a": "是双关：sticky 本义「黏的」（枫糖很黏），也指「棘手的」。上下文说储备 this winter will run dry（要见底了），显然是坏消息，所以 sticky situation = 棘手处境，不是「甜蜜生意」。"}, {"q": "Barely had… when… 是什么结构？", "a": "否定副词 Barely 放句首引起部分倒装：Barely had the reserve recovered when…（正常语序：The reserve had barely recovered when…）。含义 =「刚一…就…」，同 hardly… when… / no sooner… than…。翻译时按正常语序理解即可。"}, {"q": "魁北克的枫糖储备到底是什么机制？为什么叫 cartel（卡特尔）？", "a": "2000 年建立储备，用来在歉收年稳定价格和供应。PPAQ（魁北克枫糖生产商协会）控制该省散装糖浆批发市场，并实行销售限制与产量配额——相当于一个「卡特尔」（cartel，同业联盟操纵价格与产量）。文章副标题 The province's cartel is losing its grip 就是「这个卡特尔正在失去掌控」。"}, {"q": "tariff 和 quota 有什么区别？", "a": "tariff（关税）= 对进口商品征收的税；quota（配额）= 对进出口数量设的上限。二者都是贸易管制手段：关税影响价格，配额影响数量。文中 tariffs 指美国关税的不确定性，quotas 指 PPAQ 的产量配额。"}, {"q": "bulk syrup 和 blend 是什么场景？", "a": "bulk = 散装/大宗（bulk syrup 散装糖浆，对应 retail 零售包装）；blend = 混合调配。产业链：生产商 → 批发市场（散装）→ 买家（blend and package 调配包装成品牌产品）→ 超市。文中说买家也在从美国（尤其佛蒙特）采购，冲击魁北克的主导地位。"}], "hideTitle": true, "vocab": [{"word": "reflects", "def": "v. 反映；reflect on 反思", "coll": "rising demand reflects a shift…", "level": "L1", "note": "reflection n. 反映/反射"}, {"word": "dominate", "def": "v. 主导，占主导地位", "coll": "Canada's producers dominate the global supply", "level": "L1", "note": "dominant adj. 主导的；domination n."}, {"word": "alongside", "def": "prep. 与…一起、同时", "coll": "alongside managing the reserve", "level": "L1", "note": "along + side；= together with"}, {"word": "sweeter", "def": "adj. 更甜的（sweet 比较级）；此处双关「更美好」", "coll": "sweeter in the imagination than in reality", "level": "L2", "note": "sweet → sweeter → sweetest"}, {"word": "calamity", "def": "n. 灾难，祸事", "coll": "the last such calamity was in 2008", "level": "L2", "note": "= disaster（正式）"}, {"word": "upswing", "def": "n. 上升，增长", "coll": "a sustained upswing in demand", "level": "L2", "note": "反义 downturn 下降"}, {"word": "spurted", "def": "v. 激增，猛增", "coll": "Production in New Brunswick has spurted", "level": "L2", "note": "= surged / jumped"}, {"word": "barrels", "def": "n. 桶（barrel 复数）", "coll": "whitewashed barrels stacked…", "level": "L3", "note": "oil barrel 石油桶"}, {"word": "stabilise", "def": "v. 稳定（美拼 stabilize）", "coll": "to stabilise prices and supply", "level": "L3", "note": "stable → stabilise；stability n."}, {"word": "syrup", "def": "n. 糖浆", "coll": "maple syrup 枫糖浆", "level": "L3", "note": "专名，认得即可"}, {"word": "skimmed", "def": "v. 撇去（浮沫）；偷走（skim off）", "coll": "syrup was skimmed in a heist", "level": "L3", "note": "skim milk 脱脂奶；11-16 测答成「削弱」❌"}, {"word": "heist", "def": "n. 抢劫（大案），盗窃", "coll": "over $18m-worth of syrup was skimmed in a heist", "level": "L3", "note": "影视/新闻词"}, {"word": "depleted", "def": "adj. 被耗尽的；deplete v. 消耗", "coll": "left its barrels depleted", "level": "L3", "note": "= exhausted / used up；11-16 测：没想起来 ❌"}, {"word": "tariffs", "def": "n. 关税", "coll": "uncertainty over American tariffs", "level": "L3", "note": "与 quota 区分：税 vs 数量"}, {"word": "bulk syrup", "def": "散装糖浆", "coll": "wholesale market for bulk syrup", "level": "L3", "note": "bulk 大宗/散装；反义 retail 零售"}, {"word": "quotas", "def": "n. 配额，限额", "coll": "strict marketing restrictions and output quotas", "level": "L3", "note": "quota 单数 → quotas 复数"}, {"word": "stymied", "def": "v. 阻碍，使受阻", "coll": "they had stymied the ability to expand output", "level": "L3", "note": "= hindered；非「冒犯」；11-16 测：没想起来 ❌"}, {"word": "blend", "def": "v. 混合，调配", "coll": "buyers who blend and package the syrup", "level": "L3", "note": "blender 搅拌机/调配商"}, {"word": "bring forward", "def": "提前；提出（建议）", "coll": "which has led some buyers to bring forward purchases", "level": "延伸", "note": "反义 put off / postpone；lead sb to do = 促使某人做（同义 prompt/spur）"}]}, {"date": "2026-11-15", "title": "植物奶正在失去势头", "title_en": "Alternatives to milk are losing momentum", "source": "The Economist（2026.09.19 期 · Business · 旧刊）", "words": 480, "difficulty": "L2 中档", "theme": "金融/商业", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["Popcorn-flavoured oat milk in your coffee? Or cinnamon roll? Or neither.", "In the past year the volume of plant-based alternatives to milk sold in America has fallen by 5.4%, according to Circana, a market-research firm.", "Almond milk, the bestselling variety, dropped by 7.9%.", "In Britain volumes fell by 2.5% in the year to June; in France, Italy, the Netherlands and Spain growth slowed.", "Sales of dairy milk, though, are ticking up, after a long decline.", "Consumers are returning to it, seeing it as better for their wallets and their health."], ["Alternative milks went mainstream in the 2010s, partly because people perceived them to be friendlier than dairy to the climate.", "Oatly, a Swedish producer, claims that in Britain its oat milk has only one-third of the climate impact of cows' milk.", "But after milk prices dropped in 2023, many shoppers feeling the post-pandemic pinch returned to dairy."], ["As more people worried about ultra-processed foods and read packaging closely, they spotted gums, oils, sugars and flavourings among alt-milks' ingredients.", "Though whole milk contains more saturated fat, alternatives often have more sugar.", "Cows' milk has three to four times as much protein as oat milk.", "At Arla, Europe's largest dairy co-operative, revenue from high-protein products like quark and skyr has risen by 25% a year since 2024."], ["Alt-milk makers are also pushing hard on health.", "Zoe Gardner, head of marketing in Britain for Alpro, Danone's plant-based milk brand, says its growth strategy is to fortify its milks with calcium, protein, iodine and vitamins.", "The French firm's new \"Silk Protein\" soya milks and yoghurts in North America boast \"50% less sugar than regular dairy milk\".", "Among smaller suppliers, MALK labels its cartons as \"gum free\"."], ["John Crawford of Circana compares \"converts\" to alt-milks to drinkers of Diet Coke.", "Many are \"completely loyal\", he says, treating the drink as a product with its own flavour, rather than an alternative.", "That may help explain why drinks mimicking cows' milk have flopped.", "Both Arla and Danone have dropped failing brands."], ["Producers of plant-based milks believe novelty is the way forward.", "Bryan Carroll, Oatly's general manager in Britain and Ireland, says a mere \"alternative to dairy\" is not enough.", "He says new flavours are proving popular, especially with young people.", "They include popcorn and matcha, a trendy green-tea powder, which has become Oatly's best-selling flavoured product since its launch in 2025.", "At Alpro, Ms Gardner says that the success of its cinnamon-roll drink has spurred a new seasonal-flavour strategy."], ["Milks made from pistachios, pecans and barley are also sprouting on supermarket shelves.", "Tastewise, which analyses social-media chatter, finds interest in these has risen markedly in the past year.", "That in oat, almond and cashew has waned.", "Maybe the new alt-milks will win share from the old, rather than from dairy."]], "translations": ["爆米花味的燕麦奶配咖啡？或者肉桂卷味？还是都不要。据市场研究公司 Circana 的数据，过去一年美国植物奶的销量下降了 5.4%。最畅销的杏仁奶下降 7.9%。在英国，截至 6 月的一年里销量下降 2.5%；在法国、意大利、荷兰和西班牙，增长放缓。与此同时，牛奶销量在经历长期下滑后开始回升。消费者正在回归牛奶，认为它更省钱、也更健康。", "植物奶在 2010 年代走向主流，部分原因是人们认为它对气候比奶制品更友好。瑞典生产商 Oatly 声称，在英国其燕麦奶的气候影响只有牛奶的三分之一。但 2023 年奶价下跌后，许多感受到疫情后经济压力的消费者又回到了奶制品。", "随着更多人担心超加工食品、开始仔细读包装，他们发现植物奶的配料里有胶、油、糖和调味剂。虽然全脂牛奶的饱和脂肪更多，但植物奶往往含糖更高。牛奶的蛋白质含量是燕麦奶的三到四倍。在欧洲最大的奶业合作社 Arla，夸克和 skyr 等高蛋白产品的收入自 2024 年以来每年增长 25%。", "植物奶厂商也在大力打健康牌。达能旗下植物奶品牌 Alpro 的英国市场负责人 Zoe Gardner 说，其增长策略是给产品强化钙、蛋白质、碘和维生素。该公司在北美推出的新款「Silk Protein」大豆奶和酸奶号称「糖比普通牛奶少 50%」。在更小的供应商中，MALK 在包装上标注「不含胶」。", "Circana 的 John Crawford 把植物奶的「皈依者」比作健怡可乐的饮用者。他说，很多人「完全忠诚」，把它当作一种有自己风味的独立产品，而不是替代品。这或许能解释为什么模仿牛奶的饮品会失败。Arla 和达能都砍掉了失败的品牌。", "植物奶生产商相信，新意才是出路。Oatly 英国和爱尔兰总经理 Bryan Carroll 说，仅仅当「奶的替代品」是不够的。他说新口味很受欢迎，尤其是在年轻人中——包括爆米花和抹茶（一种流行的绿茶粉），抹茶自 2025 年推出以来已成为 Oatly 最畅销的风味产品。在 Alpro，Gardner 女士说其肉桂卷饮品的成功促成了一项新的季节限定口味策略。", "用开心果、碧根果和大麦做的奶也在超市货架上冒出。分析社交媒体讨论的 Tastewise 发现，过去一年人们对这些新品的兴趣明显上升，而对燕麦、杏仁和腰果的兴趣则减弱了。也许新植物奶会从老植物奶那里抢份额，而不是从奶制品那里。"], "questions": [{"id": "Q1", "label": "主旨题", "stem": "Which of the following best summarizes the text?", "options": ["Plant-based milk sales are falling as consumers return to dairy, prompting alt-milk makers to try health claims and new flavours.", "Dairy milk is disappearing from supermarket shelves.", "Alt-milk producers have stopped innovating altogether.", "Oat milk has become the most popular drink in Britain."], "answer": "A", "analysis": "全文主线：植物奶销量下滑、奶牛奶回潮；植物奶厂商转向健康配方与新口味（爆米花、抹茶等）寻找出路。", "wrong": {"B": "反向/无中生有：奶牛奶销量在回升（ticking up），不是消失。", "C": "反向：文中厂商正大力推健康与新口味，创新活跃。", "D": "偷换/夸大：抹茶只是 Oatly 最畅销的风味产品，不是英国最受欢迎的饮料。"}}, {"id": "Q2", "label": "细节题", "stem": "According to the text, which factor has contributed to shoppers returning to dairy milk?", "options": ["Dairy milk is seen as better for shoppers' budgets and health.", "Alt-milks have stopped using any flavourings.", "Dairy milk is now free of saturated fat.", "Plant-based milks contain no protein at all."], "answer": "A", "analysis": "P1 末句：Consumers are returning to it, seeing it as better for their wallets and their health；P2 也提到 2023 年奶价下跌。", "wrong": {"B": "反向/无中生有：植物奶仍在使用调味剂（ flavours 是卖点）。", "C": "反向：P3 说 whole milk contains more saturated fat。", "D": "夸大：P3 只说奶牛奶蛋白是燕麦奶的 3-4 倍，并非植物奶零蛋白。"}}, {"id": "Q3", "label": "推理题", "stem": "What can be inferred about Oatly's flavoured products?", "options": ["Novel flavours such as matcha have performed well, especially among young consumers.", "They have replaced all of Oatly's original products.", "They failed because consumers want plain milk alternatives.", "They are sold only in Britain and Ireland."], "answer": "A", "analysis": "P6：新口味 proving popular, especially with young people；抹茶自 2025 年推出后成为 Oatly 最畅销风味产品。", "wrong": {"B": "过度推断：文中只说风味产品成功，没说取代全部原产品。", "C": "反向：风味产品受欢迎，不是失败。", "D": "偷换：文中提到的是 Oatly 英国/爱尔兰总经理，不等于只在两地销售。"}}, {"id": "Q4", "label": "词义题", "stem": "In Paragraph 5, the word \"converts\" most probably means ______.", "options": ["people who have switched to alt-milks and stayed loyal", "companies that produce dairy milk", "customers who return products to shops", "scientists who study nutrition"], "answer": "A", "analysis": "下句解释：Many are completely loyal, treating the drink as a product with its own flavour——所以 converts 指「转投植物奶、并保持忠诚的消费者」。", "wrong": {"B": "张冠李戴：奶农/奶企不是「转投者」。", "C": "字面误解：convert 不是「退货」。", "D": "无中生有。"}}], "longSentences": [{"ref": "P1·S4", "text": "In Britain volumes fell by 2.5% in the year to June; in France, Italy, the Netherlands and Spain growth slowed.", "main": "volumes fell (in Britain); growth slowed (in France, Italy, the Netherlands and Spain)", "chunks": [["In Britain volumes fell by 2.5% in the year to June", "在英国，截至 6 月的一年里销量下降 2.5%"], ["in France, Italy, the Netherlands and Spain", "在法国、意大利、荷兰和西班牙"], ["growth slowed", "增长放缓"]], "translation": "在英国，截至 6 月的一年里销量下降 2.5%；在法国、意大利、荷兰和西班牙，增长放缓。", "points": ["分号并列两个分句（对比英美/欧陆）", "in the year to June = 截至 6 月的一年（数据口径）", "volume 销量，growth 增长——财经文高频"]}, {"ref": "P3·S10", "text": "As more people worried about ultra-processed foods and read packaging closely, they spotted gums, oils, sugars and flavourings among alt-milks' ingredients.", "main": "they spotted gums, oils, sugars and flavourings", "chunks": [["As more people worried about ultra-processed foods and read packaging closely", "随着更多人担心超加工食品、并仔细阅读包装"], ["they spotted gums, oils, sugars and flavourings", "他们发现了胶、油、糖和调味剂"], ["among alt-milks' ingredients", "在植物奶的配料里"]], "translation": "随着更多人担心超加工食品、开始仔细阅读包装，他们在植物奶的配料里发现了胶、油、糖和调味剂。", "points": ["As 引导时间/原因状语从句", "spot = 发现、注意到（≈ notice）", "ultra-processed foods 超加工食品，近年的高频社科词"]}], "qa": [{"q": "dairy / alt-milk / plant-based 这组词怎么区分？", "a": "dairy = 奶制品（dairy milk 牛奶；dairy co-operative 奶业合作社）；plant-based = 植物基的；alt-milk = alternative milk 的缩写，植物奶的统称。文中 dairy 与 alt-milk 是对立概念，读选项先分清这两类。"}, {"q": "converts 为什么是「皈依者/转投者」？", "a": "convert 作动词是「转变、改信」，作名词指「改信者、转投者」。P5 用它比喻「从牛奶转投植物奶、并且保持忠诚的消费者」——下句 completely loyal 就是解释。"}, {"q": "这篇文章的题目为什么感觉太明显？（2026-11-15 的反馈）", "a": "因为题目和选项是我自己写的，干扰项不够「像真的」。从 2026-11-16 起改用现成题源：六级真题仔细阅读（2023–2025，36 篇，5 道官方题+官方答案），不再由我出题。"}], "vocab": [{"word": "perceived", "def": "v. 认为，感知（perceive 过去式）", "coll": "perceive A as B；perceived as friendlier", "level": "L1", "note": "perception n. 认知/看法"}, {"word": "shelves", "def": "n. 货架（shelf 复数）", "coll": "on supermarket shelves", "level": "L1", "note": "shelf → shelves"}, {"word": "almond", "def": "n. 杏仁", "coll": "almond milk 杏仁奶", "level": "L2", "note": "专名，认得即可"}, {"word": "ticking up", "def": "回升，小幅上升", "coll": "sales are ticking up", "level": "L2", "note": "tick up 反义 tick down"}, {"word": "mainstream", "def": "主流；主流的", "coll": "went mainstream in the 2010s", "level": "L2", "note": "main + stream"}, {"word": "Oatly", "def": "n. 燕麦奶品牌（瑞典）", "coll": "Oatly claims…", "level": "L2", "note": "专名，认得即可"}, {"word": "saturated", "def": "adj. 饱和的", "coll": "saturated fat 饱和脂肪", "level": "L2", "note": "saturate v. 使饱和"}, {"word": "alt-milk", "def": "n. 植物奶（alternative milk 缩写）", "coll": "alt-milk makers", "level": "L2", "note": "alt = alternative"}, {"word": "calcium", "def": "n. 钙", "coll": "fortify with calcium", "level": "L2", "note": "化学/营养词，认得即可"}, {"word": "iodine and vitamins", "def": "碘和维生素", "coll": "fortified with iodine and vitamins", "level": "L2", "note": "营养标签高频"}, {"word": "pistachios, pecans and barley", "def": "开心果、碧根果和大麦", "coll": "milks made from pistachios, pecans and barley", "level": "L2", "note": "坚果/谷物词群"}, {"word": "cinnamon roll", "def": "肉桂卷", "coll": "cinnamon-roll drink", "level": "L3", "note": "cinnamon 肉桂"}, {"word": "dairy", "def": "n. 奶制品；adj. 乳制的", "coll": "dairy milk；dairy co-operative", "level": "L3", "note": "与 alt-milk 对立"}, {"word": "oat", "def": "n. 燕麦", "coll": "oat milk 燕麦奶", "level": "L3", "note": "oatmeal 燕麦粥"}, {"word": "post-pandemic", "def": "adj. 疫情后的", "coll": "post-pandemic pinch", "level": "L3", "note": "post- 之后 + pandemic 疫情"}, {"word": "gums", "def": "n. 胶（食品添加剂）；牙龈", "coll": "gums, oils, sugars and flavourings", "level": "L3", "note": "一词两义：食品胶/牙龈"}, {"word": "ingredients", "def": "n. 配料，成分", "coll": "alt-milks' ingredients", "level": "L3", "note": "食品包装必看词"}, {"word": "revenue", "def": "n. 收入，营收", "coll": "revenue from high-protein products", "level": "L3", "note": "财经高频；revenue ≠ profit"}, {"word": "quark", "def": "n. 夸克（一种奶制品）", "coll": "quark and skyr", "level": "L3", "note": "专名，认得即可"}, {"word": "skyr", "def": "n. 冰岛酸奶", "coll": "high-protein products like quark and skyr", "level": "L3", "note": "专名，认得即可"}, {"word": "fortify", "def": "v. 强化（营养），加固", "coll": "fortify its milks with calcium", "level": "L3", "note": "fortified 强化过的"}, {"word": "yoghurts", "def": "n. 酸奶（英拼；美拼 yogurt）", "coll": "soya milks and yoghurts", "level": "L3", "note": "英式多一个 h"}, {"word": "converts", "def": "n. 转投者，皈依者", "coll": "converts to alt-milks", "level": "L3", "note": "v. convert 转变"}, {"word": "mimicking", "def": "v. 模仿（mimic 的 -ing 形式）", "coll": "drinks mimicking cows' milk", "level": "L3", "note": "mimic 三态 mimic-mimicked"}, {"word": "flopped", "def": "v. 失败，砸锅", "coll": "drinks … have flopped", "level": "L3", "note": "= failed；flop 也指「失败之作」"}, {"word": "novelty", "def": "n. 新奇事物；新意", "coll": "novelty is the way forward", "level": "L3", "note": "novel 新奇的 + -ty"}, {"word": "spurred", "def": "v. 促进，刺激", "coll": "has spurred a new strategy", "level": "L3", "note": "= prompted；spur on"}, {"word": "sprouting", "def": "v. 冒出，出现（sprout）", "coll": "are also sprouting on shelves", "level": "L3", "note": "sprout 发芽 → 涌现"}, {"word": "social-media chatter", "def": "社交媒体讨论/言论", "coll": "analyses social-media chatter", "level": "L3", "note": "chatter 闲聊/议论"}, {"word": "waned", "def": "v. 减弱，衰退（wane 过去式）", "coll": "interest … has waned", "level": "L3", "note": "反义 wax（wax and wane 盛衰）"}]}, {"date": "2026-11-16", "title": "左右脑神话与人格测试", "title_en": "", "source": "2024年12月六级真题（第3套）· 仔细阅读 Passage One（校订版）", "words": 444, "difficulty": "L2 中档（六级真题）", "theme": "科普/心理", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["There are hundreds of personality quizzes online that assert they can ascertain whether the right or left half of your brain is dominant.", "Left-brained people are supposedly logical and excel at language and math while right-brained people are more imaginative, emotionally intelligent and skilled with spatial reasoning.", "There's just one problem: That's not how brains work.", "Popular science enthusiasts sort of took this idea and ran with it, and it's become woven in popular culture now, and it's not going away.", "Despite this enduring belief, there's no such thing as being \"right-brained\" or \"left-brained\".", "Whether you're someone who tends more towards creativity or logic has nothing to do with one hemisphere of your brain being dominant over the other.", "But the actual science of how the two halves of our brains work together is sometimes stranger than fiction."], ["The human brain is divided into two hemispheres, the left and right.", "In all vertebrate animals, the right hemisphere controls the left side of the body and vice versa.", "And scientists have long known, thanks to the behaviors of patients who suffered brain injuries, that different areas of the brain do different things.", "But many scientists struggled with this idea, because the very suggestion that the left and right halves of the brain operate differently disrupted the idea that nature tends toward perfect symmetry.", "Work by neuroscientists has revealed the importance of different hemispheres of the brain for different activities.", "However, their research quickly saw some misinterpretations in the general public: Some presumed creative people must be right-brained and logical people left-brained."], ["It is proven that not only is personality unrelated to the different halves of the brain, but people aren't really right- or left-brained to begin with.", "The idea that we have left-dominant people and right-dominant people, and that this is related to personality, is categorically false.", "That's never been supported in the neuroscience community.", "Neuroscientists don't believe that and never have.", "What scientists learned is that there are really important differences between the left hemisphere and the right hemisphere.", "It's just that they have nothing to do with personality or whether cognitive strategy is more logical or free spirited or creative."], ["While researchers have shown the limitations of how the hemispheres of our brains influence our lives, it's not difficult to understand the appeal of such ideas.", "People are endlessly fascinated by themselves and their friends, and the subtle differences in how people think about the world are really meaningful to them.", "When you come up with an online quiz that tells us something about ourselves, we're drawn to that.", "It's irresistible.", "But you have to take it with an enormous grain of salt."]], "translations": ["网上有数百个性格测试，声称能够确定你的大脑右半球还是左半球占主导地位。据说左脑主导的人逻辑性强，在语言和数学方面表现出色，而右脑主导的人则更富有想象力、情商更高，且擅长空间推理。但问题在于：大脑并非如此运作。科普爱好者们对这一观点进行了演绎推广，如今它已融入流行文化，并且深入人心。尽管这种观点长期存在，但事实上根本不存在「右脑主导」或「左脑主导」这回事。一个人更倾向于创造力还是逻辑性，与大脑某一半球占主导地位毫无关系。然而，关于大脑两半球如何协同工作的实际科学原理，有时比虚构的说法还要奇妙。", "人类的大脑分为左右两个半球。在所有脊椎动物中，右半球控制身体的左侧，反之亦然。长期以来，通过研究脑损伤患者的行为，科学家们已经知道大脑的不同区域负责不同的功能。但许多科学家难以接受这一观点，因为「左右脑功能不同」的说法似乎违背了自然界趋向完美对称的理念。神经科学家的研究揭示了大脑不同半球在不同活动中所起的重要作用。然而，他们的研究成果在公众中很快就遭到了一些误解：有些人认为有创造力的人一定是右脑主导，而逻辑性强的人一定是左脑主导。", "事实证明，不仅性格与大脑的不同半球无关，而且从根本上来说，人也并非真的存在左脑或右脑主导的情况。那种认为存在左脑主导型人和右脑主导型人、且这种主导性与性格相关的观点，是完全错误的。这一观点从未得到神经科学界的支持。神经科学家们从不相信这种说法，也从来没有相信过。科学家们发现，大脑左半球和右半球之间确实存在重要差异。只是这些差异与性格无关，也与认知方式是更偏向逻辑性、自由奔放还是创造性无关。", "尽管研究人员已经指出了大脑半球对我们生活的影响存在局限性，但不难理解这类观点为何具有吸引力。人们总是对自己和朋友充满好奇，而人们看待世界的细微差异对他们来说意义重大。当你看到一个能揭示自身某些特质的在线测试时，总会不由自主地被吸引。这让人难以抗拒。但对于测试结果，你必须持极大的怀疑态度。"], "questions": [{"id": "Q46", "label": "六级真题", "stem": "What do numerous personality quizzes online claim they are able to do?", "options": ["Distinguish between the two hemispheres of one’s brain.", "Determine whether one is left-brained or right-brained.", "Tell if one is more of a linguist or of a mathematician.", "Ascertain how one’s brain performs different tasks."], "answer": "B", "analysis": "P1：quizzes assert they can ascertain whether the right or left half of your brain is dominant → 同义改写为 determine whether one is left-brained or right-brained。", "wrong": {"A": "偷换：distinguish hemispheres ≠ 判定哪侧占主导。", "C": "无中生有：linguist/mathematician 是左脑刻板印象，不是 quiz 的声称。", "D": "偷换：brain performs different tasks ≠ 判定左右脑主导。"}}, {"id": "Q47", "label": "六级真题", "stem": "What does the author say is sometimes stranger than fiction?", "options": ["How one hemisphere of the brain impacts creativity.", "How the two halves of our brains work alternately.", "How the two hemispheres of our brains cooperate.", "How one half of the brain dominates the other."], "answer": "C", "analysis": "P1 末句：the actual science of how the two halves of our brains work together is sometimes stranger than fiction → cooperate 是 work together 的同义替换。", "wrong": {"A": "无中生有：没说半球影响创造力。", "B": "偷换：alternately（交替）≠ cooperate（协作）。", "D": "反向：文章恰恰否认半球支配。"}}, {"id": "Q48", "label": "六级真题", "stem": "Why did many scientists have difficulty endorsing the idea that different areas of the brain do different things?", "options": ["It contradicts the assumption that the two hemispheres of the brain are symmetrical.", "It dismisses the view that the universe has been evolving in a consistent manner.", "It is in conflict with the suggestion that the left and right halves of the brain work together.", "It disrupts the idea that the right hemisphere of the brain controls the left side of the body."], "answer": "A", "analysis": "P2：many scientists struggled with this idea, because the very suggestion that the left and right halves operate differently disrupted the idea that nature tends toward perfect symmetry → A（违背两半球对称的假设）。struggled with = difficulty endorsing；disrupted = contradicts。", "wrong": {"B": "无中生有：文章说的是 nature 趋向对称，不是「宇宙演化一致」。", "C": "反向/无中生有：文章没说「两半球协同」与这冲突。", "D": "张冠李戴：右半球控制左侧身体是已知事实，不是争议点。"}}, {"id": "Q49", "label": "六级真题", "stem": "What belief have neuroscientists long rejected according to the passage?", "options": ["There are left-dominant people and right-dominant people with different personalities.", "There are noticeable differences between the left and right hemispheres of the brain.", "One’s personality is hardly related to the different halves of the brain.", "Different areas of the brain are responsible for different activities."], "answer": "A", "analysis": "P3：The idea that we have left-dominant people and right-dominant people, and that this is related to personality, is categorically false → 神经科学界长期拒绝的正是这一信念。", "wrong": {"B": "反向：科学家承认左右半球有差异。", "C": "偷换：性格与半球无关是结论，不是「被拒绝的信念」。", "D": "反向：不同区域功能不同是科学共识。"}}, {"id": "Q50", "label": "六级真题", "stem": "What are we advised to do with an online quiz that tells us something about ourselves?", "options": ["Challenge its authority.", "Scrutinize its originality.", "Evaluate its popularity.", "Question its reliability."], "answer": "D", "analysis": "P4 末句：take it with an enormous grain of salt = 持极大怀疑态度 → question its reliability。", "wrong": {"A": "过度：challenge authority 语气过强。", "B": "无中生有：originality（原创性）。", "C": "无关：popularity（流行度）。"}}], "longSentences": [{"ref": "P2·S11", "text": "But many scientists struggled with this idea, because the very suggestion that the left and right halves of the brain operate differently disrupted the idea that nature tends toward perfect symmetry.", "main": "many scientists struggled with this idea", "chunks": [["But many scientists struggled with this idea", "但许多科学家难以接受这一观点"], ["because the very suggestion", "因为正是这个说法"], ["that the left and right halves of the brain operate differently", "（同位语从句：左右脑运作方式不同）"], ["disrupted the idea", "动摇了这一观念"], ["that nature tends toward perfect symmetry", "（同位语从句：自然界趋向完美对称）"]], "translation": "但许多科学家难以接受这一观点，因为「左右脑运作方式不同」这一说法本身就动摇了「自然界趋向完美对称」的观念。", "points": ["because 引导原因状语从句", "两个同位语从句：suggestion that… / idea that…", "struggle with = 难以接受/纠结；disrupt = 动摇、打破"]}, {"ref": "P3·S14", "text": "It is proven that not only is personality unrelated to the different halves of the brain, but people aren't really right- or left-brained to begin with.", "main": "It is proven that …", "chunks": [["It is proven that", "已经证明"], ["not only is personality unrelated to the different halves of the brain", "不仅性格与大脑两半球无关（not only 置句首引起倒装）"], ["but people aren't really right- or left-brained to begin with", "而且从根本上说人本来就不分左右脑主导"]], "translation": "事实证明，不仅性格与大脑的不同半球无关，而且从根本上来说，人也并非真的存在左脑或右脑主导。", "points": ["It 形式主语，that 引导主语从句", "not only 置于从句句首 → 部分倒装 is personality…", "to begin with = 从根本上说/首先"]}], "qa": [{"q": "irresistible 我猜是「无伤大雅的」，对吗？", "a": "不对。irresistible = 不可抗拒的、极其诱人的（ir- 不 + resist 抵抗 + -ible 可…的）。文中 It's irresistible 是说这类测试「让人忍不住想点」。无伤大雅 = harmless，是另一个词。"}, {"q": "take it with an enormous grain of salt 怎么理解？", "a": "take sth with a grain of salt = 对…持保留/怀疑态度（古罗马解毒偏方引申：加一小撮盐可防毒）。grain 强调「一小撮」，enormous 在这里加强语气：要持极大的怀疑。Q50 选 D（question its reliability）就来自这个短语。"}], "vocab": [{"word": "assert", "def": "v. 断言，声称", "coll": "quizzes assert they can…；assert oneself 坚持己见", "level": "L1", "note": "assertion n.；与 claim 近义"}, {"word": "categorically", "def": "adv. 断然地，绝对地", "coll": "is categorically false 完全错误", "level": "L1", "note": "category 范畴 → categorical 绝对的"}, {"word": "fascinated", "def": "adj. 着迷的", "coll": "be fascinated by sth", "level": "L1", "note": "fascinate v. 使着迷；fascinating 迷人的"}, {"word": "ascertain", "def": "v. 查明，确定", "coll": "ascertain whether…", "level": "L2", "note": "= find out；与 assert（断言）区分"}, {"word": "excel", "def": "v. 擅长", "coll": "excel at/in language and math", "level": "L2", "note": "excellent adj. 优秀的"}, {"word": "hemisphere", "def": "n. 半球", "coll": "the left and right hemispheres", "level": "L2", "note": "hemi- 半 + sphere 球"}, {"word": "vertebrate", "def": "n. 脊椎动物；adj. 有脊椎的", "coll": "all vertebrate animals", "level": "L2", "note": "vertebra 脊椎"}, {"word": "take sth with a grain of salt", "def": "对…持保留/怀疑态度", "coll": "take it with an enormous grain of salt", "level": "L2", "note": "字面「加一撮盐」→ 存疑"}, {"word": "spatial", "def": "adj. 空间的", "coll": "spatial reasoning 空间推理", "level": "L3", "note": "space → spatial"}, {"word": "woven", "def": "v. 编织（weave 过去分词）；融入", "coll": "it's become woven in popular culture", "level": "L3", "note": "weave-wove-woven"}, {"word": "vice versa", "def": "反之亦然", "coll": "the right hemisphere
