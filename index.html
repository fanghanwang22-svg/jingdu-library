controls the left side, and vice versa", "level": "L3", "note": "拉丁语；vice = 反过来"}, {"word": "symmetry", "def": "n. 对称", "coll": "nature tends toward perfect symmetry", "level": "L3", "note": "sym- 共同 + metry 测量；symmetrical adj."}, {"word": "revealed", "def": "v. 揭示，显示", "coll": "has revealed the importance of…", "level": "L3", "note": "= showed；reveal the truth"}, {"word": "misinterpretations", "def": "n. 误解", "coll": "misinterpretations in the general public", "level": "L3", "note": "mis- 错误 + interpretation 解释"}, {"word": "irresistible", "def": "adj. 不可抗拒的，极诱人的", "coll": "It's irresistible.", "level": "L3", "note": "ir- 不 + resist 抵抗；≠ harmless 无伤大雅"}]}, {"date": "2026-11-17", "title": "团队教学：一场值得的冒险", "title_en": "", "source": "2024年12月六级真题（第3套）· 仔细阅读 Passage Two（校订版 + 官方答案）", "words": 452, "difficulty": "L2 中档（六级真题）", "theme": "教育/科技", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["One hundred thirty-five students, four teachers, one giant classroom: This is what 9th grade looks like at Westwood High School, in Mesa, Arizona's largest school system.", "There, an innovative teaching model has taken hold, and is spreading to other schools in the district and beyond.", "Five years ago, faced with high teacher turnover and declining student enrollment, Westwood's leaders decided to try something different.", "Working with professors at Arizona State University's teachers college, they piloted a classroom model known as team teaching, which allows teachers to dissolve the walls that separate their classes across physical or grade divides."], ["The teachers share large groups of students — sometimes 100 or more — and rotate between group instruction, one-on-one interventions, small study groups, or whatever the teachers as a team agree is a priority that day.", "What looks at times like chaos is in fact a carefully orchestrated plan: Each morning, the Westwood teams meet to hammer out a personalized program for every student the team will focus on that day.", "By giving teachers more opportunity to collaborate, Mesa's administrators hoped to fill staffing gaps and boost teacher morale and retention.", "Initial research suggests the gamble could pay off."], ["\"Teachers are doing fantastic things, but it's very rare a teacher walks into another room to see what's happening,\" said Andi Fourlis, superintendent of Mesa Public Schools.", "\"Our profession is so slow to advance because we are working in isolation.\"", "Of course, overhauling teaching approaches can't fix all the frustrations teachers have, such as low pay, but early results from Mesa show team teaching may be helping to reverse low morale.", "In a survey of hundreds of the district's teachers, researchers found those who worked on teams reported greater job satisfaction, more frequent collaborations with colleagues, and more positive interactions with students.", "Another benefit of teams, teachers say, is that they can help each other improve their instruction.", "During one planning session, English teacher Jeff Hall shared a performance appraisal with a science teacher: Her recent lecture on something she called \"the central dogma of biology\" had bewildered him and their other teammates.", "\"If the science is too confusing for me, can you imagine the frustration you feel as kids?\" Hall said.", "But the science teacher, he said, wouldn't have known about the confusion on her own."], ["The model is not for everyone.", "Some teachers approached about volunteering for a team have said they prefer to work alone.", "Team teaching can also be a scheduling nightmare, especially at schools like Westwood where only some staff work in teams.", "There are also thorny questions like how to evaluate four teachers on the performance of 135 students.", "But for the time being, it seems to be working."]], "translations": ["135 名学生，4 名教师，一间巨大的教室：这便是亚利桑那州最大学区梅萨市韦斯特伍德高中九年级的课堂模样。在那里，一种创新性的教学模式已然扎根，并正推广至该学区内及其他地区的更多学校。五年前，面对教师流失率高和学生入学人数下降的问题，韦斯特伍德高中的领导层决定尝试新举措。他们与亚利桑那州立大学教育学院的教授们合作，试点了一种名为「团队教学」的课堂模式，这种模式能让教师打破班级之间在物理或年级层面的壁垒。", "教师们共同负责一大批学生——有时多达 100 人甚至更多——并在集体授课、一对一辅导、小组学习和教学团队当天认定的优先事项之间轮换。有时看似混乱的场景，实则是精心编排的安排：每天早上，韦斯特伍德的教学团队都会开会，为当天要重点关注的每一位学生制定个性化方案。通过给教师更多合作机会，梅萨学区的管理者希望填补人员空缺、提升教师士气与留存率。初步研究表明，这场冒险或许会有所回报。", "「教师们做着出色的工作，但一位教师走进另一个教室去看看情况，这种事极为罕见，」梅萨公立学校总监安迪·福利斯说。「我们的职业发展如此缓慢，就是因为我们在孤立地工作。」当然，改革教学方法并不能解决教师们的所有困扰，比如低薪问题，但梅萨的早期结果显示，团队教学或许有助于扭转低迷的士气。在对该学区数百名教师的调查中，研究人员发现，参与团队教学的教师报告了更高的工作满意度、更频繁的同事合作以及与学生的更积极互动。教师们表示，团队教学的另一个好处是能互相帮助改进教学。在一次备课会议上，英语教师杰夫·霍尔与一位科学教师分享了一份教学评估：她最近关于「生物学中心法则」的讲座让他和其他队友都感到困惑。「如果连我都觉得这部分科学知识太晦涩，你能想象孩子们会有多沮丧吗？」霍尔说。但他表示，这位科学教师自己不会意识到存在这样的困惑。", "这种模式并非适用于所有人。一些被问及是否愿意加入团队的教师表示更倾向于独自工作。团队教学在排课方面也可能是个难题，尤其是在像韦斯特伍德这样只有部分教职工参与团队教学的学校。此外还有棘手问题，比如如何根据 135 名学生的表现来评估 4 名教师。但就目前而言，这种模式似乎是可行的。"], "questions": [{"id": "Q51", "stem": "What do we learn about team teaching from the passage?", "options": ["It is generally conducted in classrooms without walls.", "It allows students to choose teachers they favor most.", "It prioritizes peer work over classroom instruction.", "It is closely coordinated despite seeming confusion."], "answer": "D", "label": "六级真题", "analysis": "P2：What looks at times like chaos is in fact a carefully orchestrated plan → closely coordinated despite seeming confusion（同义替换）。", "wrong": {"A": "字面误解：dissolve walls 是比喻，不是「没有墙的教室」。", "B": "无中生有：学生不能选老师。", "C": "张冠李戴：原文说在 group instruction / 一对一 / 小组间轮换，没有「优先同伴学习」。"}}, {"id": "Q52", "stem": "What does initial research suggest regarding Westwood's innovative teaching model?", "options": ["It could help raise teachers' pay.", "It could turn out to be a success.", "It could cut down overall costs.", "It could end up like a gamble."], "answer": "B", "label": "六级真题", "analysis": "P2 末句：Initial research suggests the gamble could pay off → could turn out to be a success。", "wrong": {"A": "无中生有：文中明确说低薪问题解决不了。", "C": "无中生有：没有谈成本。", "D": "反向：原文是「冒险可能有回报」，不是「结果只是个赌博」。"}}, {"id": "Q53", "stem": "What did superintendent Andi Fourlis say about the teaching profession?", "options": ["Morale cannot be boosted until teaching models are overhauled.", "Teachers are simply too busy to visit classes of their colleagues.", "Progress is slow due to lack of collaboration among teachers.", "Teachers often do fantastic things without being noticed."], "answer": "C", "label": "六级真题", "analysis": "Fourlis 原话：Our profession is so slow to advance because we are working in isolation → 进展慢是因为缺乏合作。", "wrong": {"A": "无中生有：没说要先改革模式才能提士气。", "B": "偷换：rarely walks into another room 不等于「太忙」。", "D": "偷换：fantastic things 是原话，但题干问的是「职业发展缓慢」的原因。"}}, {"id": "Q54", "stem": "What does the author want to show by citing English teacher Jeff Hall's experience?", "options": ["English teachers and science teachers are complementary in performing their tasks.", "A teacher of arts and letters is completely puzzled by what a science teacher teaches.", "The new teaching model helps inform the teacher how their instruction is received.", "Science teachers will hardly know the confusion they create without a performance appraisal."], "answer": "C", "label": "六级真题", "analysis": "Jeff Hall 的例子说明：团队教学让科学教师意识到自己的课别人听不懂 → helps inform the teacher how their instruction is received。", "wrong": {"A": "以偏概全：互补不是例子要说明的点。", "B": "表面化：只描述现象，没说明作用。", "D": "偷换：performance appraisal 只是场景，不是结论。"}}, {"id": "Q55", "stem": "What does the author think is one of the difficult problems in implementing the new teaching model?", "options": ["What to do with teachers working alone.", "What to include in teaching schedules.", "How to recruit volunteers for a team.", "How to assess each teacher's performance."], "answer": "D", "label": "六级真题", "analysis": "P4：thorny questions like how to evaluate four teachers on the performance of 135 students → how to assess each teacher's performance。", "wrong": {"A": "无中生有：教师偏好独自工作不是「难题」。", "B": "偷换：scheduling nightmare 不等于「课表里放什么」。", "C": "无中生有：文中没说招募志愿者难。"}}], "longSentences": [{"ref": "P2·S6", "text": "What looks at times like chaos is in fact a carefully orchestrated plan: Each morning, the Westwood teams meet to hammer out a personalized program for every student the team will focus on that day.", "main": "What looks like chaos is in fact a plan", "chunks": [["What looks at times like chaos", "（主语从句）有时看似混乱的东西"], ["is in fact a carefully orchestrated plan", "实际上是精心编排的计划"], ["Each morning, the Westwood teams meet to hammer out a personalized program", "每天早上团队开会反复讨论敲定个性化方案"], ["for every student the team will focus on that day", "（省略关系词）为当天要重点关注的每一位学生"]], "translation": "有时看似混乱的场景，实则是精心编排的计划：每天早上，韦斯特伍德的教学团队都会开会，为当天要重点关注的每一位学生敲定个性化方案。", "points": ["What 引导主语从句", "冒号后是对 plan 的具体解释", "hammer out = 反复讨论敲定；the team will focus on that day 是省略 that/whom 的定语从句"]}, {"ref": "P3·S14", "text": "During one planning session, English teacher Jeff Hall shared a performance appraisal with a science teacher: Her recent lecture on something she called \"the central dogma of biology\" had bewildered him and their other teammates.", "main": "Jeff Hall shared a performance appraisal with a science teacher", "chunks": [["During one planning session", "在一次备课会议上"], ["English teacher Jeff Hall shared a performance appraisal with a science teacher", "英语教师杰夫·霍尔与一位科学教师分享了一份教学评估"], ["Her recent lecture on something she called \"the central dogma of biology\"", "她最近关于「生物学中心法则」的讲座"], ["had bewildered him and their other teammates", "让他和其他队友都感到困惑"]], "translation": "在一次备课会议上，英语教师杰夫·霍尔与一位科学教师分享了一份教学评估：她最近关于「生物学中心法则」的讲座让他和其他队友都感到困惑。", "points": ["冒号后解释 appraisal 的内容", "something she called… 是省略关系词的定语从句", "bewilder = 使困惑（bewildered 困惑的）"]}, {"ref": "P3·S9–S10", "text": "\"Teachers are doing fantastic things, but it's very rare a teacher walks into another room to see what's happening,\" said Andi Fourlis, superintendent of Mesa Public Schools. \"Our profession is so slow to advance because we are working in isolation.\"", "main": "Teachers are doing fantastic things, but it's very rare (that) a teacher walks into another room", "chunks": [["Teachers are doing fantastic things", "教师们做着出色的工作（一般现在时：普遍评价）"], ["but it's very rare (that) a teacher walks into another room to see what's happening", "但很少有老师走进另一个教室去看看（it 形式主语，that 省略）"], ["said Andi Fourlis, superintendent of Mesa Public Schools", "梅萨公立学校总监安迪·福利斯说（同位语解释身份）"], ["Our profession is so slow to advance because we are working in isolation", "我们的职业发展缓慢，因为我们在孤立地工作"]], "translation": "「教师们做着出色的工作，但很少有老师会走进另一个教室去看看情况，」梅萨公立学校总监安迪·福利斯说。「我们的职业发展如此缓慢，就是因为我们在孤立地工作。」", "points": ["引语中的一般现在时 = 说话人的普遍判断/行业常态，不能据此定位「过去某时期」", "it's very rare (that) a teacher walks…：it 形式主语，that 可省略；a teacher 泛指", "引语功能：指出行业问题（孤立），为后文「团队教学解决问题」做铺垫；批评模型的内容在 P4"]}], "qa": [{"q": "dissolve the walls / cross divides 都是比喻吗？", "a": "是的。团队教学不是真的拆墙，而是「打破班级之间的壁垒」：dissolve（溶解→消除）和 cross divides（跨越界限）都是比喻用法。这类动词的比喻义是六级/考研高频考点。"}, {"q": "hammer out / orchestrated / gamble 这三个词为什么都出现在同一段？", "a": "它们共同服务于「团队教学像一场精心策划的冒险」这个比喻：orchestrated（精心编排，来自 orchestra 管弦乐团）形容计划周密；hammer out（反复敲打→反复讨论敲定）形容开会打磨方案；gamble（赌博→冒险）形容这场改革有风险但可能值得。"}, {"q": "Fourlis 为什么用一般现在时 \"are doing\"，而不是 \"were\"？她在说新模式之前的时期吗？", "a": "不是特指「新模式之前」。这里是一般现在时表「普遍状态/行业常态」：Teachers are doing fantastic things（教师群体一直做着出色的工作）／it's very rare a teacher walks into another room（常态下很少互相听课）／Our profession is so slow to advance because we are working in isolation（行业长期存在孤立问题）。若明确指过去，会说 were doing / it was rare。判断时间看上下文时间词（Five years ago…, Initial research suggests…），不要用引语时态定位。"}, {"q": "第一次读时以为 Fourlis 的引语在批评新模式，怎么判断引语是「支持」还是「反对」？", "a": "三步法：① 引语里有没有提到被评价对象（这里完全没提 team teaching）；② 评价对象是谁（Teachers 正面 / profession 负面，都不是 model）；③ 引语后面作者给的证据方向（调查显示团队教师满意度更高 + Jeff Hall 轶事 = 支持）。所以这句是「指出行业问题 → 引出解决方案」，不是批评模型；真正的缺点在 P4（并非人人适用、排课难、评估难）。"}], "vocab": [{"word": "innovative", "def": "adj. 创新的", "coll": "an innovative teaching model", "level": "L1", "note": "innovate v.；innovation n."}, {"word": "beyond", "def": "prep. 超出；在…之外", "coll": "spreading to schools beyond；beyond doubt", "level": "L1", "note": "常见搭配：beyond control/expectation"}, {"word": "profession", "def": "n. 职业", "coll": "the teaching profession", "level": "L1", "note": "professional adj. 专业的"}, {"word": "enrollment", "def": "n. 入学人数；注册", "coll": "declining student enrollment", "level": "L2", "note": "enroll v. 注册"}, {"word": "morale and retention", "def": "士气与留存率", "coll": "boost teacher morale and retention", "level": "L2", "note": "morale 士气；retention 保留"}, {"word": "gamble", "def": "n./v. 赌博；冒险", "coll": "the gamble could pay off", "level": "L2", "note": "pay off = 有回报"}, {"word": "superintendent", "def": "n. 主管；学区总监", "coll": "superintendent of Mesa Public Schools", "level": "L2", "note": "supervise 同源"}, {"word": "bewildered", "def": "adj. 困惑的", "coll": "had bewildered him", "level": "L2", "note": "bewilder v. 使困惑"}, {"word": "thorny", "def": "adj. 棘手的", "coll": "thorny questions", "level": "L2", "note": "thorn 刺 → 扎手 → 棘手"}, {"word": "dissolve", "def": "v. 溶解；消除，解散", "coll": "dissolve the walls that separate classes", "level": "L3", "note": "比喻：打破隔阂"}, {"word": "rotate", "def": "v. 轮流，轮换；旋转", "coll": "rotate between group instruction and…", "level": "L3", "note": "rotation n."}, {"word": "interventions", "def": "n. 干预，介入", "coll": "one-on-one interventions", "level": "L3", "note": "intervene v."}, {"word": "orchestrated", "def": "adj. 精心编排的", "coll": "a carefully orchestrated plan", "level": "L3", "note": "orchestra 管弦乐团 → orchestrate"}, {"word": "hammer out", "def": "反复讨论敲定", "coll": "meet to hammer out a program", "level": "L3", "note": "hammer 敲打"}, {"word": "collaborate", "def": "v. 合作", "coll": "more opportunity to collaborate", "level": "L3", "note": "collaboration n."}, {"word": "overhauling", "def": "v. 彻底改革（overhaul）", "coll": "overhauling teaching approaches", "level": "L3", "note": "over + haul 全面检修"}, {"word": "reverse low morale", "def": "扭转低迷士气", "coll": "helping to reverse low morale", "level": "L3", "note": "reverse v. 扭转；morale 士气"}, {"word": "appraisal", "def": "n. 评估", "coll": "a performance appraisal 绩效评估", "level": "L3", "note": "appraise v. 评估"}, {"word": "cross divides", "def": "跨越界限", "coll": "dissolve walls across physical or grade divides", "level": "L3", "note": "divide n. 分界线"}]}, {"date": "2026-11-18", "title": "验证码背后的思考", "title_en": "", "source": "2025年12月六级真题 · 第3套 · Passage Two（校订原文 + 官方答案）", "words": 447, "difficulty": "L2 中档（六级真题）", "theme": "科技/社会", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["The other day I had to log into a service I hadn’t used before.", "Since I was a new user, the website decided that it needed to check I wasn’t a robot and so set me a Captcha test to determine whether the user is a person or a machine.", "I was presented with an image of a roadside scene over which was laid a grid.", "My \"challenge\" was to click on each cell in the grid that contained a traffic sign.", "I did so, a bit irritated.", "Then I was presented with another image and another grid— also with a request to identify road signs.", "Like a lamb, I complied, after which the website accepted my input."], ["And then I realised what I had been doing was adding to a dataset for training the machine-learning software that guides self-driving cars.", "So, to gain access to an automated service that will benefit financially from my input, I first have to do some unpaid labour to help improve the performance of autonomous vehicles.", "Neat, eh?", "But note also the delicious additional irony that the Captcha is described as an \"automated Turing test\".", "The Turing test was conceived, you may recall, as a way of enabling humans to determine whether a machine could respond in such a way that one couldn't tell whether it was a human or a robot.", "So we have wandered into a world in which machines make us do tricks to prove that we are humans!", "The strangest aspect of this unparalleled shift is how under-discussed it has been."], ["The metaphor of the boiling frog comes to mind.", "Have we become so subtly conditioned by digital technology that we don't see what’s been happening to us?", "Have we been conditioned to accept a world governed by \"smart\" tech, trading convenience to the point where we become a bit like machines ourselves?", "In a recent startling and thoughtful book, two scholars— Brett Frischmann, a law professor, and Evan Selinger, a philosopher— argue that the answer to that question is“yes”.", "And they're right.", "There's nothing technophobic (技术恐惧的) about that.", "We shape our tools and then our tools shape us."], ["Technology is supposed to provide tools that serve human ends.", "But, as the machine-learning Captcha demonstrates, a significant proportion of digital tech now sees(and uses) humans as means to ends that are not ours.", "In the process, they reduce us to the status of cheery rats running on treadmills (踏车) designed by people who do not have our interests at heart.", "So back to the frog metaphor.", "Are we smart enough to jump out before it’s too late?", "You don’t even have to Google it to know the answer."]], "translations": ["前几天，我需要登录一个以前没用过的服务。因为我是新用户，网站认为需要验证我不是机器人，于是给我出了一个 Captcha（验证码）测试，用来判断用户是人还是机器。它给我一张路边场景的图片，上面覆盖着网格。我的「挑战」是点击网格中每个含有交通标志的格子。我照做了，有点恼火。然后又出现一张图片和另一个网格——同样要求识别路标。我像羔羊一样顺从地照做，之后网站接受了我的输入。", "然后我意识到，我一直在做的是为一个数据集添砖加瓦，用来训练指导自动驾驶汽车的机器学习软件。所以，为了使用一个会从我的输入中获利的自动化服务，我得先做一些无偿劳动，帮助提升自动驾驶汽车的性能。真「妙」啊，是吧？但请注意另一个绝妙的讽刺：Captcha 被称为「自动化图灵测试」。你可能记得，图灵测试的初衷是让人类判断机器的回应是否能让人分不清它是人还是机器人。于是我们进入了一个世界：机器让我们做各种把戏来证明我们是人！这一无与伦比的转变最奇怪的地方在于，它几乎没有被讨论过。", "这让人想到温水煮青蛙的比喻。我们是否已经被数字技术如此微妙地驯化，以至于看不到正在发生的事？我们是否已被驯化到接受一个由「智能」技术统治的世界，不断用便利交换，直到我们自己也有点像机器？在最近一本令人震惊且发人深省的书中，两位学者——法学教授 Brett Frischmann 和哲学家 Evan Selinger——认为这个问题的答案是「是的」。他们说得对。这没有任何技术恐惧症。我们塑造工具，然后工具塑造我们。", "技术本应提供服务于人类目的的工具。但正如机器学习验证码所表明的，相当大一部分数字技术现在把人视为（并用作）达到非我们目的的手段。在此过程中，它们把我们降格成欢快的老鼠，在那些并不关心我们利益的人设计的跑步机上奔跑。那么回到青蛙比喻：我们够聪明，能及时跳出来吗？你甚至不用谷歌就知道答案。"], "questions": [{"id": "Q51", "label": "六级真题", "stem": "How did the author respond to the Captcha test?", "options": ["He clicked on the cells randomly", "He accepted the challenge readily", "He completed it confidently", "He worked on it submissively"], "answer": "D", "analysis": "P1：I did so, a bit irritated… Like a lamb, I complied → 作者是「有点恼火但像羔羊一样顺从地」完成 → worked on it submissively。", "wrong": {"A": "无中生有：不是 random。", "B": "情感色彩错：readily（欣然）与 a bit irritated / like a lamb（无奈顺从）相反。", "C": "反向：confidently（自信）≠ 恼火、顺从。"}}, {"id": "Q52", "label": "六级真题", "stem": "What is ironic about the Captcha test?", "options": ["A machine can respond to the test as well as humans do", "A machine can outperform humans in object identification", "A test designed to test machines is now used by machines to test humans", "A test conceived to tell a human from a robot can now do tricks humans can’t"], "answer": "C", "analysis": "P2：Captcha 被称为「automated Turing test」；图灵测试本意是让人类判断机器，现在变成机器让人证明自己是人 → 测试设计初衷 vs 现实反转。", "wrong": {"A": "无中生有：没提机器能像人一样答题。", "B": "无中生有：没提机器识别物体更强。", "D": "偷换：不是「机器能做人类做不到的把戏」。"}}, {"id": "Q53", "label": "六级真题", "stem": "Why does the author use the metaphor of the boiling frog?", "options": ["To show that humans are unwilling to trade convenience for control by smart tech", "To show that humans are unaware of the potential danger brought by smart tech", "To question whether humans are conditioned to accept digital tech", "To question whether humans are as vulnerable as the boiling frog"], "answer": "B", "analysis": "温水煮青蛙 = 人在不知不觉中被慢慢加热（被技术驯化），察觉不到危险 → unaware of the potential danger。", "wrong": {"A": "反向：不是「不愿交换」，而是没意识到。", "C": "偷换：question whether conditioned 是作者的提问，不是比喻目的。", "D": "表面化：只问脆弱性，没抓住「无察觉」。"}}, {"id": "Q54", "label": "六级真题", "stem": "Why does the author think that Brett Frischmann and Evan Selinger are right?", "options": ["A large part of digital tech is now making use of humans to meet its own ends", "Humans are now fast locked in a race against digital tech to control the world", "Digital tech can serve human needs in ways previously thought impossible", "Digital tech is now doing thinking while humans are doing repetitive work"], "answer": "A", "analysis": "P4：a significant proportion of digital tech now sees (and uses) humans as means to ends that are not ours → 数字技术把人当手段 → A。", "wrong": {"B": "无中生有：没提人机竞赛。", "C": "反向：作者是批评技术，不是赞扬。", "D": "偷换：不是「机器思考、人做重复工作」。"}}, {"id": "Q55", "label": "六级真题", "stem": "What does the author imply by asking “Are we smart enough to jump out before it’s too late?” at the end of the passage?", "options": ["It is not sensible to expect digital tech to take humans’ interest to heart", "It is hard to say whether technology or humans will get the upper hand", "We may have to search the web to get the answer to the question", "We may not awake in time to the danger digital tech poses to us"], "answer": "D", "analysis": "P4 末：Are we smart enough to jump out before it's too late? You don't even have to Google it to know the answer. → 反讽式暗示：我们可能来不及醒悟 → D。", "wrong": {"A": "无中生有：不是「不该期待技术关心人」，而是「我们可能醒不过来」。", "B": "无关：没问谁占上风。", "C": "字面误解：You don't even have to Google it 是修辞，不是真的「要上网查」。"}}], "longSentences": [{"ref": "P2·S12", "text": "The Turing test was conceived, you may recall, as a way of enabling humans to determine whether a machine could respond in such a way that one couldn't tell whether it was a human or a robot.", "main": "The Turing test was conceived as a way of enabling humans to determine whether…", "chunks": [["The Turing test was conceived, you may recall, as a way of…", "图灵测试（你可能记得）被构想为一种……的方式"], ["enabling humans to determine whether a machine could respond", "让人类判断机器是否能回应"], ["in such a way that one couldn't tell", "以这样一种方式：让人分不清"], ["whether it was a human or a robot", "它到底是人还是机器人"]], "translation": "图灵测试（你可能记得）的初衷，是让人类判断机器的回应能否达到「让人分不清它是人还是机器人」的程度。", "points": ["be conceived as = 被构想为（conceive 构想/怀孕）", "you may recall 是插入语", "such a way that + 结果从句；whether 嵌套两次"]}, {"ref": "P4·S23", "text": "But, as the machine-learning Captcha demonstrates, a significant proportion of digital tech now sees (and uses) humans as means to ends that are not ours.", "main": "a significant proportion of digital tech sees humans as means to ends", "chunks": [["But, as the machine-learning Captcha demonstrates", "但正如机器学习验证码所表明的（as 方式状语）"], ["a significant proportion of digital tech", "相当大一部分数字技术"], ["now sees (and uses) humans as means", "现在把人视为（并用作）手段"], ["to ends that are not ours", "（定语从句）去实现并非我们的目的"]], "translation": "但正如机器学习验证码所表明的，相当大一部分数字技术现在把人视为（并用作）实现非我们目的的手段。", "points": ["as 引导方式状语从句（as + 主谓）", "see A as B = 把 A 视为 B", "means to ends = 达到目的的手段；ends = 目的（哲学词）"]}, {"ref": "P4·S24", "text": "In the process, they reduce us to the status of cheery rats running on treadmills designed by people who do not have our interests at heart.", "main": "they reduce us to the status of cheery rats", "chunks": [["In the process, they reduce us to the status of cheery rats", "在此过程中，它们把我们降格为「快乐老鼠」的地位"], ["running on treadmills", "（现在分词作定语）在跑步机上奔跑"], ["designed by people", "（过去分词作定语，修饰 treadmills）由某些人设计的"], ["who do not have our interests at heart", "（定语从句修饰 people）不把我们的利益放在心上"]], "translation": "在此过程中，它们把我们降格为「快乐老鼠」的地位——在那些并不把我们的利益放在心上的人所设计的跑步机上欢快地奔跑。", "points": ["reduce sb to sth = 使某人沦落到……（贬低）", "cheery rats running on treadmills：比喻人忙碌而原地打转、被人利用", "designed by… 修饰 treadmills；who 从句修饰 people，层层后置定语", "have sth at heart = 把……放在心上；have our interests at heart = 为我们着想"]}], "qa": [{"q": "P2 的「delicious additional irony」到底讽刺在哪？", "a": "图灵测试的初衷是：让人类判断机器能否伪装成人。结果现在反过来了——机器（网站）出题，让人类（我们）做各种小把戏来证明「我是人」。角色的反转就是 irony：本用于测机器的测试，现在被机器用来测人。"}, {"q": "Like a lamb, I complied 是什么语气？", "a": "lamb（羔羊）象征温顺、任人摆布；like a lamb 是「像羔羊一样顺从地」。配合前面的 a bit irritated，作者是「有点恼火但还是乖乖照做」——带着自嘲和无奈。Q51 的 submissively（顺从地）正是这个意思，注意不是 readily（欣然）。"}, {"q": "conceived 除了「构想」还有别的意思吗？", "a": "conceive ① 构想、设想（conceive an idea / be conceived as）② 怀孕（conceive a child）。两者都常见，靠宾语判断：接 idea/plan/way 是构想；接 child 是怀孕。"}, {"q": "submissively / readily / reluctantly 三个情感副词不认识，怎么记？", "a": "① submissively 顺从地 ← submit（提交/屈服）→ submissive 顺从的：像羔羊一样任人摆布；② readily 欣然地、轻易地 ← ready（准备好）：readily agree 欣然同意 / readily available 容易获得；③ reluctantly 不情愿地 ← reluctant 不情愿的（拉丁语「挣扎抵抗」）：reluctant to do sth。做题时先给选项标情感方向：readily(+) / reluctantly(−) / submissively(− 被动)，再回原文找态度线索（irritated、like a lamb），方向不一致的排除。"}, {"q": "they reduce us to the status of cheery rats running on treadmills designed by people who do not have our interests at heart 这句话怎么理解？", "a": "主句：they（数字技术）reduce us to the status of cheery rats = 把我们降格为「快乐的老鼠」。reduce sb to sth = 使某人沦落到…（贬低）。running on treadmills = 在跑步机上奔跑（比喻：不停忙活、自我感觉良好，其实原地打转、被人利用）。designed by people… 修饰 treadmills（这些跑步机由…设计），不是修饰 rats；who do not have our interests at heart = 不把我们的利益放在心上。整体讽刺：我们以为自己在使用技术，实际上成了科技公司跑步机上的老鼠，还乐在其中。常考作者态度：批判/警惕技术。"}, {"q": "我觉得作者是个不懂技术的文科生，只会抒发主观意见——阅读时该怎么处理这种作者？", "a": "先分清文体：这是观点评论（op-ed/essay），不是技术报告，作者的目的就是说服和批评，修辞（比喻、反讽）是工具。但他并非完全不懂：Captcha 用于标注训练数据、图灵测试、注意力经济（Jenny Odell）都是真实概念。读法：给句子标 F（事实）/V（价值判断）/R（修辞）——比如「cheery rats」是 R，「do not have our interests at heart」是 V；考试态度题/目的题只考「作者的观点」，不考「你同不同意」；你可以批判他，但答题时必须准确复述他的立场。"}, {"q": "为什么说这篇作者的观点「逻辑不成立」？他的论证链哪里有问题？", "a": "他的骨架是：一次 Captcha 经历 → 数据被用于训练 ML → 这是无偿劳动 → 数字技术把人当手段 → 我们该警惕。问题在隐含前提（warrant）：①把「免费服务换数据」等同于「无偿劳动/剥削」，忽略交换关系；②「不把我们的利益放在心上」是价值判断、无证据；③把「使用技术」等同于「被技术驯化」，中间缺机制。另外他以一次个人经历推及「a significant proportion of digital tech」（以偏概全），用温水煮青蛙比喻代替论证。较强的部分：算力/标注数据确实进入 ML 训练；图灵测试的角色反转确有讽刺意味。"}], "vocab": [{"word": "demonstrates", "def": "v. 表明，证明", "coll": "as the Captcha demonstrates", "level": "L1", "note": "demonstrate v.；demonstration n."}, {"word": "conceived", "def": "v. 构想；怀孕（conceive 过去式）", "coll": "The Turing test was conceived as…", "level": "L2", "note": "be conceived as 被构想为"}, {"word": "log into", "def": "登录", "coll": "log into a service", "level": "L3", "note": "log in / log out"}, {"word": "lamb", "def": "n. 羔羊；温顺的人", "coll": "Like a lamb, I complied", "level": "L3", "note": "like a lamb 温顺地"}, {"word": "complied", "def": "v. 服从，照做", "coll": "I complied", "level": "L3", "note": "comply with sth 遵守"}, {"word": "irony", "def": "n. 讽刺，反讽", "coll": "the delicious additional irony", "level": "L3", "note": "ironic adj."}, {"word": "unparalleled", "def": "adj. 无与伦比的", "coll": "this unparalleled shift", "level": "L3", "note": "parallel 平行的 → unparalleled 无双的"}, {"word": "metaphor", "def": "n. 比喻，隐喻", "coll": "The metaphor of the boiling frog", "level": "L3", "note": "metaphorical adj."}, {"word": "subtly", "def": "adv. 微妙地", "coll": "so subtly conditioned", "level": "L3", "note": "subtle adj. 微妙的"}, {"word": "governed", "def": "v. 统治，支配（govern 过去分词）", "coll": "a world governed by smart tech", "level": "L3", "note": "government n."}, {"word": "proportion", "def": "n. 比例；部分", "coll": "a significant proportion of digital tech", "level": "L3", "note": "in proportion to 与…成比例"}, {"word": "rat", "def": "n. 老鼠（rats 复数）", "coll": "cheery rats running on treadmills", "level": "L3", "note": "rat vs mouse"}, {"word": "irritated", "def": "adj. 恼火的", "coll": "I did so, a bit irritated", "level": "L3", "note": "irritate v. 使恼火"}, {"word": "submissively", "def": "adv. 顺从地，恭顺地", "coll": "Like a lamb, he complied submissively.", "level": "L3", "note": "submit 屈服 → submissive → submissively"}, {"word": "readily", "def": "adv. 欣然地；轻易地", "coll": "readily agree；readily available 随手可得", "level": "L3", "note": "ready → readily"}, {"word": "reluctantly", "def": "adv. 不情愿地", "coll": "reluctantly agree；reluctant to do", "level": "L3", "note": "reluctant adj. 不情愿的"}]}, {"date": "2026-11-19", "title": "性别薪酬差距的另一面", "title_en": "", "source": "2025年6月六级真题 · 第2套 · Passage Two（校订原文 + 官方答案）", "words": 454, "difficulty": "L2（偏难：抽象名词 + 省略结构多）", "theme": "经济/社会", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["Women have historically been paid less.", "But in the US in the 1980s, they began to catch up— fast.", "During that decade, the gender pay gap closed by about one percentage point a year.", "Had that trend continued, the gender wage gap would have been closed by 2017.", "But the trend didn’t continue, and the gap remains yawning."], ["According to a new study from academics at Harvard, the stagnation can be put down, perhaps counterintuitively, to the introduction of state and federal family leave policies.", "The academics argue that during the 1990 s, as governments began to introduce leave policies, it was mainly women who took advantage of them.", "Though the leave policies might have helped those women to stay in the workplace — instead of dropping out to have families — those who returned saw their wages had increased at lower rates than the men.", "After family leave was introduced in the US, in fact, the rate of gender wage convergence fell to just 0.03 percentage points per year, and has remained there ever since.", "Those monitoring the process towards salary equity at work have long watched as progress slowed in many countries around the world."], ["In fact, that progress began to reverse during the pandemic (大流行病).", "The gender pay gap is one of the most outstanding examples of that lack of parity (平等), and still exists just about everywhere.", "The motherhood penalty has become a shorthand for describing why: In many places, especially rich countries, women earn the same as men until they reach their childbearing years.", "Women who have children begin to see their salaries slip behind their male counterparts.", "Part of this is because women take on more of the unpaid labor at home, which can eat into time available for work and energy for career advancement."], ["But it’s also because mothers are passed over for raises and promotion, and because time out of the workplace sets women back, even if that time is taken voluntarily, and supported by company or government policy.", "What would have happened if leave policies hadn’t been introduced?", "The study doesn’t go into that question, other than to say that if the 1980s trend continued, we would have been at parity by now.", "It’s possible, however, that the journey towards wage parity would have stalled either way.", "If women’s gains in the 1980s were made through the erasure of things like bias, once those less uncontrollable problems had been addressed, there would still have been an issue with women— who are the ones to bear children and take care of them in the early weeks because of biological factors like the ability to breastfeed, forcing them to take breaks, whether or not those breaks were mandated."]], "translations": ["历史上女性的薪酬一直较低。但在 20 世纪 80 年代的美国，她们开始快速追赶。那十年间，性别薪酬差距每年缩小约一个百分点。如果这一趋势延续，到 2017 年性别工资差距本应已经消除。但这一趋势并未延续，差距依然巨大。", "哈佛学者的一项新研究认为，这种停滞或许可以反直觉地归因于州和联邦家庭休假政策的出台。学者们认为，20 世纪 90 年代各国政府开始推出休假政策时，受益者主要是女性。尽管这些休假政策可能帮助这些女性留在职场——而不是退出职场去组建家庭——但那些重返职场的女性发现，自己的工资增长速度低于男性。事实上，美国推出家庭休假后，性别工资趋同的速度降至每年仅 0.03 个百分点，并一直保持至今。长期以来，关注职场薪酬平等进程的人士一直看到，世界许多国家的进展都在放缓。", "事实上，这一进展在疫情期间开始逆转。性别薪酬差距是缺乏平等的最突出例子之一，而且几乎在世界各地仍然存在。「母职惩罚」已成为解释这一现象的一个简写：在许多地方，尤其是富裕国家，女性在生育年龄之前与男性收入相同。有孩子的女性开始看到自己的薪水落后于男性同行。部分原因是女性承担了更多无偿家务劳动，这会占用可用于工作的时间和职业发展的精力。", "但这同时也是因为母亲在加薪和晋升时被忽视，还因为离开职场会使女性落后——即使这段时间是自愿的、并得到公司或政府政策的支持。如果当初没有出台休假政策会怎样？这项研究没有深入探讨这个问题，只是指出：如果 20 世纪 80 年代的趋势延续，我们现在本应已经实现平等。然而，也有可能，通往薪酬平等的道路无论如何都会停滞。如果女性在 20 世纪 80 年代取得的进展是通过消除偏见之类的问题实现的，那么一旦这些较不可控的问题得到解决，女性仍会面临一个问题——由于哺乳能力等生理因素，女性要在最初几周生育和照顾孩子，迫使她们休假，而无论这些休假是否被强制规定。"], "questions": [{"id": "Q51", "label": "六级真题", "stem": "What do we learn about the gender pay gap in the US during the 1980s?", "options": ["It was being slowly closed", "It was shrinking rapidly", "It started to yawn", "It remained substantial"], "answer": "B", "analysis": "P1：in the US in the 1980s, they began to catch up—fast；the gap closed by about one percentage point a year → shrinking rapidly。", "wrong": {"A": "反向：原文是 fast（快速缩小），不是 slowly。", "C": "时间错位：差距是后来才停滞并「张开」的。", "D": "数据不符：80 年代差距在缩小，不是维持巨大。"}}, {"id": "Q52", "label": "六级真题", "stem": "What happened with the introduction of state and federal family leave policies?", "options": ["The process towards salary equity at work began to reverse", "The rate of gender wage convergence started to fall noticeably", "The trend of women returning to work after childbirth started", "The narrowing of the gender pay gap attracted more attention"], "answer": "B", "analysis": "P2：After family leave was introduced in the US, the rate of gender wage convergence fell to just 0.03 percentage points per year → B（趋同速度明显下降）。", "wrong": {"A": "时间错位：progress began to reverse 发生在疫情期间（P3），不是休假政策出台时。", "C": "无中生有：没提「女性产后返工潮」这一结果。", "D": "无中生有：attention 不是政策的结果。"}}, {"id": "Q53", "label": "六级真题", "stem": "What partly accounts for the slip in women’s salaries?", "options": ["The insufficient motivation women generally have for career advancement", "The opportunities numerous women give up for pay raise and promotion", "The huge amounts of time and energy women spend taking care of the family", "The lack of policy support from government and business corporations"], "answer": "C", "analysis": "P3：women take on more of the unpaid labor at home, which can eat into time available for work and energy for career advancement → C。", "wrong": {"A": "无中生有：不是动机不足。", "B": "张冠李戴：passed over（被跳过）是被动错失机会，不是主动 give up。", "D": "无中生有：文中政策其实有支持。"}}, {"id": "Q54", "label": "六级真题", "stem": "What does the new study say about wage parity?", "options": ["It would have stalled if those controllable problems had not been addressed", "It would have halted if company and government had not worked together", "It would have been achieved with the complete erasure of gender biases", "It would have been attained with the continuation of the 1980s trend"], "answer": "D", "analysis": "P4：if the 1980s trend continued, we would have been at parity by now → D（延续 80 年代趋势就能实现）。", "wrong": {"A": "反向：原文说 less uncontrollable problems 已被处理，不是没处理。", "B": "无中生有：没提政企合作。", "C": "过度推断：消除偏见只是 80 年代进展的方式，不等于唯一条件。"}}, {"id": "Q55", "label": "六级真题", "stem": "What prevents women from achieving parity with men in the final analysis?", "options": ["Ignoring biases against women in the workplace", "Giving birth to children and taking care of them", "Failing to mandate breaks for childbirth and care", "Lacking resources to address biological problems"], "answer": "B", "analysis": "P4 末句：there would still have been an issue with women—who are the ones to bear children and take care of them in the early weeks because of biological factors… → B（最终仍是生育与照护）。", "wrong": {"A": "张冠李戴：bias 是 80 年代已处理的「较不可控问题」，不是最后障碍。", "C": "偷换：原文说 whether or not those breaks were mandated，强制休假与否不是障碍本身。", "D": "无中生有：没提资源问题。"}}], "longSentences": [{"ref": "P2·S6", "text": "According to a new study from academics at Harvard, the stagnation can be put down, perhaps counterintuitively, to the introduction of state and federal family leave policies.", "main": "the stagnation can be put down to the introduction of family leave policies", "chunks": [["According to a new study from academics at Harvard", "根据哈佛学者的一项新研究"], ["the stagnation can be put down", "这种停滞可以归因于"], ["perhaps counterintuitively", "（插入语）也许反直觉地"], ["to the introduction of state and federal family leave policies", "州和联邦家庭休假政策的出台"]], "translation": "根据哈佛学者的一项新研究，这种停滞或许可以反直觉地归因于州和联邦家庭休假政策的出台。", "points": ["put down to = 归因于（= attribute to）", "perhaps counterintuitively 是插入语，不参与句子主干", "the stagnation / the introduction 都是抽象名词主语"]}, {"ref": "P4·S20", "text": "If women's gains in the 1980s were made through the erasure of things like bias, once those less uncontrollable problems had been addressed, there would still have been an issue with women— who are the ones to bear children and take care of them in the early weeks because of biological factors like the ability to breastfeed, forcing them to take breaks, whether or not those breaks were mandated.", "main": "there would still have been an issue with women", "chunks": [["If women's gains in the 1980s were made through the erasure of things like bias", "如果 80 年代的进展是通过消除偏见之类的问题实现的"], ["once those less uncontrollable problems had been addressed", "一旦这些较不可控的问题得到解决"], ["there would still have been an issue with women", "女性仍会面临一个问题"], ["who are the ones to bear children and take care of them in the early weeks", "（定语从句）她们要在最初几周生育和照顾孩子"], ["because of biological factors like the ability to breastfeed", "因为哺乳能力等生理因素"], ["forcing them to take breaks, whether or not those breaks were mandated", "迫使她们休假，不管这些休假是否被强制规定"]], "translation": "如果女性在 20 世纪 80 年代取得的进展是通过消除偏见之类的问题实现的，那么一旦这些较不可控的问题得到解决，女性仍会面临一个问题——由于哺乳能力等生理因素，女性要在最初几周生育和照顾孩子，迫使她们休假，而无论这些休假是否被强制规定。", "points": ["虚拟 + 条件：If…were made…, there would still have been…", "once 引导时间条件状语从句", "forcing 现在分词作结果状语；whether or not 让步", "破折号 who 从句修饰 women（非限制性定语从句，who 指人）；bear children = 生育（不是忍受）；them = children；forcing 分词作结果状语"]}, {"ref": "P2·S10", "text": "Those monitoring the process towards salary equity at work have long watched as progress slowed in many countries around the world.", "main": "Those (who are) monitoring the process have long watched", "chunks": [["Those monitoring the process towards salary equity at work", "（省略 who are）关注职场薪酬平等进程的人士"], ["have long watched", "长期以来一直看着"], ["as progress slowed in many countries around the world", "（as 引导时间状语从句）随着世界许多国家进展放缓"]], "translation": "长期以来，关注职场薪酬平等进程的人士一直看到：世界许多国家的进展在放缓。", "points": ["Those + 现在分词 = Those who are doing，who are 被省略（后置定语）", "Those 作代词在书面语中通常指「人」：those who… / those doing…", "as 引导时间状语从句：随着…/当…时；watch 看到的是 as 从句所述的情况"]}, {"ref": "P4·S18–S19", "text": "The study doesn't go into that question, other than to say that if the 1980s trend continued, we would have been at parity by now. It's possible, however, that the journey towards wage parity would have stalled either way.", "main": "The study says …; It's possible, however, that …", "chunks": [["The study doesn't go into that question, other than to say that…", "该研究并未深入探讨那个问题，只是说……"], ["if the 1980s trend continued, we would have been at parity by now", "（反事实虚拟）如果 80 年代的趋势延续，我们现在本应已经实现平等"], ["It's possible, however, that the journey towards wage parity would have stalled either way", "不过，也有可能通往薪酬平等的进程无论如何都会停滞"]], "translation": "该研究并未深入探讨那个问题，只是说：如果 20 世纪 80 年代的趋势延续，我们现在本应已经实现平等。不过，也有可能，无论趋势是否延续，通往薪酬平等的进程都会停滞。", "points": ["if + 过去时，would have been：反事实虚拟，表示「与事实相反的假设」", "however 标志作者转折：从「研究推论」转到「作者补充/削弱」", "either way = 无论哪种情况（趋势延续与否）", "阅读时给每句标「谁的主张」：study / author / critics"]}], "qa": [{"q": "motherhood penalty 是「母职惩罚」，是法律惩罚吗？", "a": "不是法律惩罚，而是女性因生育和育儿在薪酬、晋升上承受的系统性劣势。penalty 在这里引申为「不利后果」。文章用它解释：女性在生育年龄前收入与男性相同，一旦有孩子薪水就落后。"}, {"q": "counterintuitively 怎么用？", "a": "counter-（相反）+ intuitive（直觉的）→ 「反直觉地」。文章用它强调一个反常识结论：家庭休假政策本意是帮女性，结果反而放慢了性别工资趋同。写作常用：Counterintuitively, the new policy reduced productivity."}, {"q": "yawning gap 为什么是「巨大差距」？", "a": "yawn 是打哈欠、张开（嘴）。a yawning gap 字面「张着大口的差距」→ 巨大的差距。固定搭配，考研阅读常见：the yawning gap between rich and poor。"}, {"q": "Those monitoring the process… 为什么没有 who？怎么知道 those 指人？", "a": "这是「Those + 现在分词」结构：Those monitoring = Those who are monitoring，相当于省略了 who are，整个分词短语作后置定语。判断 those 指人靠三点：① 书面语中 those 作代词一般指人（those who…）；② monitor / watch 这些动作的主语必须是人；③ 语境：关注薪酬平等进程的「人士」。同类结构：Those living in poverty need help. / Anyone wanting to join should sign here. / Those concerned about climate change…"}, {"q": "gains 我一直理解成「报酬」，这里为什么是「成果/进展」？", "a": "gain 作名词既可指「收益、利润」（capital gains 资本利得），也可指「成果、进展」（gains in education / gains in the 1980s = 在某一领域或时期取得的进展）。判断义项看搭配和逻辑：① 这里 gains in the 1980s 是「时间段的 gains」，接 were made through（通过…取得），是「取得的东西」；② 下一句 once those less uncontrollable problems had been addressed, there would still have been an issue with women——说明这些 gains 是「已取得的进展」，后来又被新问题挡住。所以译成「成果/进展」才通。"}, {"q": "P4 先说「趋势延续就能实现 parity」，又说「可能无论如何都会停滞」，这不是矛盾吗？做题时该信哪个？", "a": "不矛盾，是「观点归属」不同。第一句是研究/论文的推论（反事实假设：if the 1980s trend continued, we would have been at parity by now——如果 80 年代趋势延续，现在本应已实现）；第二句是作者的补充与削弱（It's possible, however, that the journey would have stalled either way——不过也可能，无论趋势是否延续，进程都会停滞，因为最后的障碍是生育/育儿这种生理性因素）。做题时先看题干问的是谁：问 study 说了什么 → 选「延续趋势就能实现」（Q54 D）；问 in the final analysis / 最终障碍 → 选作者的补充（Q55 B 生育照护）。"}, {"q": "Q52 B 说 noticeably 下降，但原文是 fell to just 0.03，0.03 明明很小，怎么叫「明显」？", "a": "noticeably 修饰的是「速度的下降」（fall），不是「0.03」这个水平。原句主语是 the rate of gender wage convergence（趋同速度），谓语 fell（速度下降），落点 to just 0.03（降到每年 0.03 个百分点）。对比 P1：80 年代是每年约 1 个百分点 → 现在 0.03，速度骤降约 97%，且 has remained there ever since，所以「速度明显下降」完全成立。读法要点：fell to X = 降到 X（结果水平）；fell by X = 下降了 X（幅度）；描述动作的副词修饰动词，不修饰后面的数值。"}, {"q": "P4 末句的破折号后面 who are the ones… 是修饰 issue 还是 women？bear 是「忍受」吗？", "a": "破折号后的 who 从句是**非限制性定语从句，修饰 women**（不是 issue）：who 只能指人，而 issue 不是人；且语义上「要生育、照顾孩子的人」只能是女性。bear 在这里是「生育」（bear children = 生孩子），不是「忍受」；忍受是 bear the pain。整句：女性仍会面临一个问题——她们才是要生育并在最初几周照顾孩子的人，因为哺乳能力等生理因素，迫使她们中断工作，无论这些中断是否被强制规定。"}, {"q": "破折号后 who are the ones to bear children… 我以为是「到底谁要生育」，把 who 当疑问词了，怎么区分？", "a": "这里的 who 是**关系代词**（引导非限制性定语从句，指 women），不是疑问代词。三条判别：① **看问号/句式**：整句是陈述句（there would still have been…），没有问号；疑问句 who 需要独立问句和问号。② **看 who 前面有没有先行名词**：women—who…，who 指代紧邻的 women；③ **替换检验**：把 who 换成 they/these women——「她们是要生育孩子的人」通顺；换成疑问「谁是要生育的人」后面 because 从句接不上。破折号在这里是「补充说明 women」，不是修饰 issue。"}, {"q": "阅读时遇到破折号插一大段（甚至带 who 从句），总被它带偏，怎么办？", "a": "第一遍读时，**跳过破折号/括号里的补充内容，只读主干**：there would still have been an issue with women … because of biological factors…（女性仍会面临一个问题，因为生理因素）。破折号内容（who are the ones to bear children…）是补充说明 women，读第二遍再回来补。这是新闻/学术英语的常见技巧：插入语不影响主旨，出题也通常不考破折号里的细节，而考主干和作者观点。"}], "vocab": [{"word": "federal", "def": "adj. 联邦的", "coll": "state and federal family leave policies", "level": "L1", "note": "federal vs state 联邦 vs 州"}, {"word": "monitoring", "def": "v. 监测，关注", "coll": "those monitoring the process", "level": "L1", "note": "monitor v./n."}, {"word": "addressed", "def": "v. 处理，解决", "coll": "problems had been addressed", "level": "L1", "note": "address a problem = 解决问题"}, {"word": "eat into", "def": "侵蚀，占用", "coll": "eat into time available for work", "level": "L2", "note": "eat into savings/time"}, {"word": "stalled", "def": "v. 停滞，卡住", "coll": "the journey would have stalled", "level": "L2", "note": "stall = 熄火/停滞"}, {"word": "yawning", "def": "adj. 张开的；巨大的", "coll": "the gap remains yawning", "level": "L3", "note": "yawning gap 巨大差距"}, {"word": "stagnation", "def": "n. 停滞", "coll": "the stagnation can be put down to…", "level": "L3", "note": "stagnate v."}, {"word": "leave policies", "def": "休假政策", "coll": "family leave policies", "level": "L3", "note": "maternity/paternity leave"}, {"word": "convergence", "def": "n. 趋同，收敛", "coll": "gender wage convergence", "level": "L3", "note": "converge v. 趋同"}, {"word": "penalty", "def": "n. 惩罚；不利后果", "coll": "the motherhood penalty", "level": "L3", "note": "引申义：劣势"}, {"word": "parity", "def": "n. 平等，同等", "coll": "wage parity；at parity by now", "level": "L3", "note": "on par with 与…持平"}, {"word": "erasure", "def": "n. 消除，抹除", "coll": "the erasure of things like bias", "level": "L3", "note": "erase v."}, {"word": "counterintuitively", "def": "adv. 反直觉地", "coll": "perhaps counterintuitively", "level": "L3", "note": "counter- + intuitive"}, {"word": "bias", "def": "n. 偏见", "coll": "things like bias", "level": "L3", "note": "gender bias 性别偏见"}, {"word": "mandated", "def": "adj. 强制规定的", "coll": "whether or not those breaks were mandated", "level": "L3", "note": "mandate v./n."}, {"word": "gains", "def": "n. 成果、进展（≠仅指钱）", "coll": "gains in the 1980s；gains in education；capital gains 资本利得", "level": "L3", "note": "gain 作名词可指收益，也可指取得的进展"}]}, {"date": "2026-11-20", "title": "正念的边界", "title_en": "", "source": "2025年12月六级真题 · 第3套 · Passage One（校订原文 + 官方答案）", "words": 450, "difficulty": "L2 中档（六级真题）", "theme": "心理/健康", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["Mindfulness has been shown to have a number of meaningful health benefits — it can help reduce anxiety and promote healing in those suffering from chronic illness.", "The practice is based on an insight first described in ancient Buddhist texts that human beings have the capacity to observe experience without being caught up in it.", "This means simply that it is possible to observe ourselves having a craving, or a happy thought, or even a scary emotion, without reacting in the moment in a way that amplifies the feeling or sends the mind spiraling off into thinking about old memories or anticipating events.", "This practice of mindfulness can help calm the mind and the body as we learn not to react to experience with likes and dislikes or judgments of good and bad.", "It does not make us cold or indifferent but more fully present."], ["One of the challenges of practicing mindfulness in our contemporary world is that there has been a profound transformation in human attention.", "The artist Jenny Odell argues that in our \"attention economy\" human attention has been transformed into a commodity that big corporations buy and sell.", "This economy rests on a technological revolution of mobile phones and social media that makes it possible for corporations to target our attention with their content at every moment.", "The devices most people use are a perpetual diversion from the present moment.", "The result is that it can feel as though our ability to focus, and be fully present, has been stolen."], ["But mindfulness can help us resist the attention economy and relish the things that make life special, like being together with those we love.", "Most mindfulness research focuses on the individual benefits of the practice, but some scholars assert that we can not only practice mindfulness for ourselves but also practice it for others.", "It can help us build stronger, healthier relationships.", "The sad truth is that living in the attention economy, most of us have become bad listeners.", "However, just as it is possible to watch ourselves having an experience without reacting, it’s possible to watch another person have an experience without getting tied up in reactivity and judgment."], ["The gift of mindfulness is a practice of listening with compassion to others describe their experiences.", "To give this gift means putting away your phone, turning off social media, and setting aside other common distractions.", "It means practicing being fully present in another person's presence and listening to them with complete attention without judgment, while resisting the urge to make the interaction about you.", "If we judge the value of gifts based on their price, this gift may seem worthless, but in a distracted world, it is a precious one."]], "translations": ["正念已被证明有多种有意义的健康益处——它能帮助减轻焦虑，并促进慢性病患者的康复。这一练习基于一个最早见于古代佛教典籍的洞见：人类有能力观察经验而不被其卷入。简单说就是：我们有可能观察到自己的渴望、一个快乐的念头，甚至一种可怕的感受，而不在当时做出反应——那种反应会放大感受，或让思绪开始盘旋，去想旧日记忆或预想未来事件。当我们学会不以好恶或好坏判断来回应经验时，正念练习能帮助平静身心。它不会让我们冷漠无情，而是让我们更全然地活在当下。", "在当代世界练习正念的挑战之一，是人类注意力发生了深刻转变。艺术家 Jenny Odell 认为，在我们的「注意力经济」中，人的注意力已被转化为一种大公司买卖的商品。这种经济建立在手机与社交媒体的技术革命之上，使公司能够时刻用内容瞄准我们的注意力。多数人使用的设备是对当下时刻的持续干扰。结果是，我们会觉得自己的专注力和全然在场的能力被偷走了。", "但正念能帮助我们抵抗注意力经济，并享受那些让生活特别的事物，比如与所爱之人在一起。多数正念研究关注这项练习的个人益处，但一些学者断言，我们不仅可以为自己练习正念，也可以为他人练习。它能帮我们建立更牢固、更健康的关系。可悲的事实是，生活在注意力经济中，我们大多数人都成了糟糕的倾听者。然而，正如有可能观察自己的经历而不做出反应一样，也有可能观察他人的经历而不被情绪反应和评判所困。", "正念的礼物，是一种带着同情去倾听他人讲述其经历的练习。送出这份礼物意味着放下手机、关掉社交媒体、搁置其他常见的干扰。它意味着练习在另一个人面前全然在场，以完全的注意力倾听而不评判，同时克制住让互动围绕自己的冲动。如果我们以价格衡量礼物的价值，这份礼物可能显得一文不值；但在这个分心的世界里，它是珍贵的。"], "questions": [{"id": "Q46", "label": "六级真题", "stem": "What do we learn from the passage about practicing mindfulness?", "options": ["It triggers our mind to reflect on past experiences or anticipate future events", "It focuses our attention on the present moment without making judgments", "It concentrates our mind on our personal feelings, happy or scary", "It helps our mind to stay calm when facing judgments from others"], "answer": "B", "analysis": "P1：observe experience without being caught up in it；without reacting；not to react … with judgments → focuses attention on the present moment without making judgments。", "wrong": {"A": "反向：正念正是要避免陷入对过去/未来的联想。", "C": "偷换：不是把注意力集中在自己的感受上。", "D": "无中生有：没提面对他人评判。"}}, {"id": "Q47", "label": "六级真题", "stem": "What do we see in today’s “attention economy” according to Jenny Odell?", "options": ["Focus on technological advances continuously updates products and services", "People’s attention is turned into something that can be bought and sold", "Businesses profit from selling mobile phones and revolutionizing social media", "People tend to purchase products and services without careful thinking"], "answer": "B", "analysis": "P2：Jenny Odell：in our attention economy human attention has been transformed into a commodity that big corporations buy and sell。", "wrong": {"A": "无中生有：不是技术更新产品。", "C": "偷换：卖手机/社媒不是重点。", "D": "无中生有：没提消费者不思考。"}}, {"id": "Q48", "label": "六级真题", "stem": "What happens with the prevalent use of mobile phones or social media?", "options": ["They keep distracting users from the here and now", "They render users incapable of resisting temptation", "They rob users of their ability to observe experience", "They tempt users to endorse the attention economy"], "answer": "A", "analysis": "P2：The devices most people use are a perpetual diversion from the present moment；our ability to focus … has been stolen → 不断让人远离当下。", "wrong": {"B": "无中生有：不是无法抵抗诱惑。", "C": "偷换：observe experience 是正念的能力，设备偷走的是专注/在场。", "D": "无中生有：没提用户支持注意力经济。"}}, {"id": "Q49", "label": "六级真题", "stem": "What benefit can practicing mindfulness bring to us according to some scholars?", "options": ["It prevents us from making arbitrary judgments about others", "It shifts our attention from material things to spiritual pursuits", "It is conducive to our forging better interpersonal relationships", "It is helpful in regaining our ability to enjoy what we have in life"], "answer": "C", "analysis": "P3：some scholars assert that we can … practice it for others. It can help us build stronger, healthier relationships → 有助于建立更好的人际关系。", "wrong": {"A": "偷换+无中生有：without judgment 是方法，arbitrary judgments 文中没有；且不是学者说的 benefit。", "B": "无中生有：没提物质→精神。", "D": "张冠李戴：享受生活是前一句 relish 的内容，不是学者指出的研究益处。"}}, {"id": "Q50", "label": "六级真题", "stem": "What does the author suggest we do in another person's presence?", "options": ["Share each other’s experience frankly and compassionately", "Pay full attention to establishing close relationships with them", "Be attentive listeners while refraining from making judgments", "Remind them of the distraction from mobile phones and social media"], "answer": "C", "analysis": "P4：listening to them with complete attention without judgment → 做专注的倾听者、不评判。", "wrong": {"A": "无中生有：不是坦率分享彼此经历。", "B": "偷换：建立关系是结果，不是做法。", "D": "无中生有：没提提醒对方放下手机。"}}], "longSentences": [{"ref": "P1·S2", "text": "The practice is based on an insight first described in ancient Buddhist texts that human beings have the capacity to observe experience without being caught up in it.", "main": "The practice is based on an insight", "chunks": [["The practice is based on an insight", "这一练习基于一个洞见"], ["first described in ancient Buddhist texts", "（过去分词作定语）最早见于古代佛教典籍的"], ["that human beings have the capacity", "（同位语从句）人类有能力"], ["to observe experience without being caught up in it", "观察经验而不被其卷入"]], "translation": "这一练习基于一个最早见于古代佛教典籍的洞见：人类有能力观察经验而不被其卷入。", "points": ["be based on = 基于", "insight 后接 that 同位语从句解释内容", "without being caught up in = 不被…卷入（被动动名词）"]}, {"ref": "P4·S17", "text": "It means practicing being fully present in another person's presence and listening to them with complete attention without judgment, while resisting the urge to make the interaction about you.", "main": "It means practicing … and listening …", "chunks": [["It means practicing being fully present in another person's presence", "它意味着练习在另一个人面前全然在场"], ["and listening to them with complete attention without judgment", "并以完全的注意力倾听而不评判"], ["while resisting the urge to make the interaction about you", "（while + doing）同时克制让互动围绕自己的冲动"]], "translation": "它意味着练习在另一个人面前全然在场，以完全的注意力倾听而不评判，同时克制住让互动围绕自己的冲动。", "points": ["mean doing sth = 意味着做某事（区别于 mean to do 打算做）", "while + 现在分词作伴随/对比状语", "make sth about you = 让某事围绕自己/以自我为中心"]}], "qa": [{"q": "全文大白话概括（读不懂时先看这个）", "a": "这篇文章在说：① 正念就是「观察自己的念头和感受，但不被它们卷走，也不急着评判」；② 现在的问题是手机和社交媒体把人的注意力变成了大公司买卖的商品，我们总是分心；③ 正念能帮我们抵抗这种分心；④ 更进一步，正念还能用在别人身上——认真听别人说话（放下手机、不评判、别把话题转到自己），这在一个人人分心的时代，是给别人的珍贵礼物。\n一句话：注意力被抢走了，正念帮我们拿回来，还能把它当礼物送给别人（认真倾听）。"}, {"q": "sends the mind spiraling off into thinking about… 怎么理解 spiraling？", "a": "spiral 本义「螺旋」，引申为「盘旋上升/失控地越陷越深」。sends the mind spiraling off into thinking about old memories = 让思绪开始盘旋，陷入对旧记忆的联想。类似：spiraling costs 螺旋式上涨的成本。"}, {"q": "compassion / passion 词根怎么记？", "a": "passion = 强烈情感（也指「受难」，如 the Passion of Christ）；com-（共同）+ passion → compassion = 感同身受、同情、怜悯。compassionate = 富有同情心的。"}, {"q": "relish 和 enjoy 有什么区别？", "a": "enjoy 泛泛「享受」；relish 更强调「细细品味、津津有味地享受」，常接 -ing：relish the moment / relish the challenge。"}, {"q": "conducive 和 forging 都不认识，导致 Q49 选不出 C，怎么记？", "a": "① conducive adj. 有助于…的，be conducive to sth/doing；词根 duc/duct = lead（引导）：conducive 引导向好的结果。② forging 是 forge 的 -ing：forge ① 锻造（铁）② 缔造、建立（关系/联盟）③ 伪造（签名/文件）；此处 forging better relationships = 缔造更好的人际关系。选项替换词往往决定对错，遇到不认识就记入多义词卡。"}, {"q": "最后一段（正念的礼物）到底在说什么？翻译成中文也读不懂。", "a": "段落结构是「定义 → 做法 → 价值判断」三步：\n① 定义：把正念用在别人身上，就是「带着同情听别人讲他的经历」。\n② 做法（三件事）：放下手机/关掉社媒/排除干扰；人在场、心也在场（全然在场）；听的时候不评判、不把话题扯回自己身上。\n③ 价值判断（最后一句）：这个「礼物」不花钱——如果按价格衡量，它「一文不值」；但在一个人人都分心的时代，能有人认真听你说话非常稀缺，所以它「珍贵」。\n大白话版：「正念用在人际关系上，就是认真倾听别人。具体做法：把手机放一边、别刷社媒、专心在对方身上、听的时候别评判、别急着把话题转到自己。这个礼物不要钱，按价钱算一文不值；但在这个人人分心的世界里，认真听人说话太稀缺了，所以它很珍贵。」"}], "vocab": [{"word": "profound", "def": "adj. 深刻的，深远的", "coll": "a profound transformation", "level": "L1", "note": "profoundly adv."}, {"word": "assert", "def": "v. 断言，声称", "coll": "some scholars assert that…", "level": "L1", "note": "assertion n.；与 claim 近义"}, {"word": "chronic", "def": "adj. 慢性的，长期的", "coll": "chronic illness", "level": "L2", "note": "acute 急性 vs chronic 慢性"}, {"word": "commodity", "def": "n. 商品", "coll": "attention transformed into a commodity", "level": "L2", "note": "commodify v. 商品化"}, {"word": "contemporary", "def": "adj. 当代的", "coll": "in our contemporary world", "level": "L2", "note": "contemporaries 同代人"}, {"word": "craving", "def": "n. 渴望，强烈欲望", "coll": "having a craving", "level": "L3", "note": "crave v.；crave for"}, {"word": "amplifies", "def": "v. 放大，增强", "coll": "amplifies the feeling", "level": "L3", "note": "amplify → amplification"}, {"word": "spiraling", "def": "v. 盘旋；失控升级（spiral 的 -ing）", "coll": "sends the mind spiraling off", "level": "L3", "note": "spiral costs 螺旋上涨"}, {"word": "perpetual", "def": "adj. 永久的，不断的", "coll": "a perpetual diversion", "level": "L3", "note": "perpetually adv."}, {"word": "diversion", "def": "n. 转移注意力的东西；改道", "coll": "a perpetual diversion from the present moment", "level": "L3", "note": "divert v."}, {"word": "rests on", "def": "依赖于，建立在…之上", "coll": "This economy rests on a technological revolution", "level": "L3", "note": "rest on = depend on"}, {"word": "relish", "def": "v. 享受，品味", "coll": "relish the things that make life special", "level": "L3", "note": "relish the challenge"}, {"word": "compassion", "def": "n. 同情，怜悯", "coll": "listening with compassion", "level": "L3", "note": "com- + passion；compassionate adj."}, {"word": "conducive", "def": "adj. 有助于…的", "coll": "be conducive to sth / doing sth", "level": "L3", "note": "词根 duc/duct = lead（引导）"}, {"word": "forge", "def": "v. 锻造；缔造（关系）；伪造", "coll": "forge relationships；a forged signature", "level": "L3", "note": "多义：关系/签名/铁器"}]}, {"date": "2026-11-22", "title": "泰国的生育率崩塌", "title_en": "Thailand's fertility rate is collapsing", "source": "The Economist（2026.11.21 期 · Asia · L3 泛读）", "words": 537, "difficulty": "L3（经济学人，长句多）", "theme": "社会/人口", "status": "done", "completed": true, "hideTitle": true, "paragraphs": [["WITH ITS golden beaches and cheap beer, Thailand has long been popular among backpackers and partygoers.", "But in recent years it has attracted a new type of tourist.", "Prospective parents from around the world are flooding in for fertility treatments, drawn by low costs and high-quality care.", "Yet even as local baby-making businesses are booming, Thailand itself is in the midst of a baby bust."], ["In 2025 the country of 66m people registered a mere 417,000 births, the fewest for 75 years and 10% less than in 2024; it is expected to fall again this year.", "Estimates for Thailand's total fertility rate (TFR), the number of births a typical woman has over her lifetime, are varied, but all are alarmingly low.", "Demographers at Mahidol University near Bangkok put the latest figure at 0.86, well under half the replacement rate of 2.1 (and below the UN's projection, for 2025, of 1.2).", "That is also lower than the latest reliable estimates for China (1.0) and Japan (1.1), two Asian countries associated with fertility crises (though Taiwan and South Korea are even lower)."], ["What makes Thailand's demographic slide remarkable is its speed.", "In 1970 the average Thai woman had more than five children, compared with 4.5 in South Korea and around two in Japan.", "As countries grow richer, people tend to have fewer offspring.", "But Thailand's ultra-low fertility has come at unusually low income levels: its GDP per person, of $8,100 in 2025, was less than half of Japan's and South Korea's, even adjusted for the cost of living (see chart).", "That has made Thailand the only country in South-East Asia where the population has already peaked.", "Like China, it is an extreme example of a predicament now confronting much of the developing world: getting old before getting rich."], ["Many of the forces driving the global fertility decline are shaping outcomes in Thailand.", "Economic development, expanding education and urbanisation have changed the nature of work and transformed the role of women.", "Nearly 60% of Thai women have formal jobs.", "The share of Thais of reproductive age who are single rose from 35.7% in 2017 to 40.5% in 2023, according to the national planning agency."], ["But despite these trends, most Thais still want children, points out Manasigan Kanchanachitra of Mahidol.", "A UN survey this year found that they wanted, on average, around two.", "Cost is the main problem.", "As Thais have grown richer, their aspirations for their kids have also surged.", "They increasingly see expensive private schools as the only way to ensure their children's success, says Dr Manasigan.", "Adding to the burden is filial duty: young Thais are expected to take care of their parents.", "In September the World Bank predicted that Thailand would, by 2033, become a \"super-aged\" society, with more than 20% of the population aged over 65."], ["During elections this year, every big party promised to tackle the issue, with policy ideas that included giving more generous cash transfers for newborns, though the evidence suggests most such schemes have little impact.", "Fulfilling any of these promises, in any case, requires a degree of continuity and co-ordination often absent in Thai governance.", "The country has had four prime ministers in the past five years—almost as many as Britain."]], "translations": ["泰国拥有金色沙滩和廉价啤酒，长期以来深受背包客和派对爱好者的欢迎。但近年来，它吸引了一类新的游客。来自世界各地的准父母蜂拥而至，寻求生育治疗，他们被低廉的费用和高质量的医疗服务所吸引。然而，就在当地「造人」产业蓬勃发展之际，泰国自身却正陷入一场「婴儿荒」。", "2025 年，这个拥有 6600 万人口的国家仅登记了 41.7 万例新生儿，为 75 年来最低，比 2024 年减少 10%；预计今年还会进一步下降。对泰国总和生育率（TFR，即一名女性一生中生育子女的数量）的估计各不相同，但都低得惊人。曼谷附近玛希隆大学的人口学家给出的最新数字为 0.86，不到 2.1 更替水平的一半（也低于联合国对 2025 年 1.2 的预测）。这同样低于中国（1.0）和日本（1.1）的最新可靠估计——这两个亚洲国家都与生育危机联系在一起（不过台湾和韩国更低）。", "让泰国人口下滑尤其引人注目的是它的速度。1970 年，泰国女性平均生育超过 5 个孩子，而韩国为 4.5 个，日本约为 2 个。随着国家变富，人们倾向于少生孩子。但泰国的超低生育率是在异常低的收入水平上出现的：2025 年泰国人均 GDP 为 8,100 美元，即使按生活成本调整，也不到日本和韩国的一半（见图表）。这使泰国成为东南亚唯一个人口已经见顶的国家。与中国一样，它也是当今发展中世界大部分地区所面临困境的极端例子：未富先老。", "推动全球生育率下降的许多力量，也在塑造泰国的结果。经济发展、教育扩张和城市化改变了工作的性质，也改变了女性的角色。近 60% 的泰国女性拥有正式工作。根据国家规划机构的数据，处于生育年龄的泰国人中，单身者比例从 2017 年的 35.7% 上升到 2023 年的 40.5%。", "但玛希隆大学的 Manasigan Kanchanachitra 指出，尽管有这些趋势，大多数泰国人仍然想要孩子。今年的一项联合国调查发现，他们平均想要大约两个孩子。成本是主要问题。随着泰国人变得更富有，他们对孩子的期望也水涨船高。Manasigan 博士说，他们越来越把昂贵的私立学校视为确保孩子成功的唯一途径。雪上加霜的是赡养义务：年轻的泰国人被期望照顾父母。今年 9 月，世界银行预测，到 2033 年泰国将成为「超老龄」社会，65 岁以上人口超过 20%。", "在今年的选举中，每个大党都承诺解决这一问题，政策主张包括为新生儿提供更慷慨的现金转移支付，尽管证据表明大多数此类方案收效甚微。无论如何，要兑现这些承诺，都需要一定程度的连续性和协调，而这在泰国治理中往往缺失。过去五年，该国换了四位总理——几乎和英国一样多。"], "questions": [], "longSentences": [{"ref": "P2·S8", "text": "Estimates for Thailand's total fertility rate (TFR), the number of births a typical woman has over her lifetime, are varied, but all are alarmingly low.", "main": "Estimates are varied, but all are alarmingly low", "chunks": [["Estimates for Thailand's total fertility rate (TFR)", "对泰国总和生育率（TFR）的估计"], ["the number of births a typical woman has over her lifetime", "（同位语）一名女性一生中生育子女的数量"], ["are varied", "各不相同"], ["but all are alarmingly low", "但都低得惊人"]], "translation": "对泰国总和生育率的估计各不相同，但都低得惊人。", "points": ["同位语解释 TFR（名词短语后置）", "be varied = 各不相同", "but 连接并列分句；alarmingly 修饰 low"]}, {"ref": "P3·S12", "text": "But Thailand's ultra-low fertility has come at unusually low income levels: its GDP per person, of $8,100 in 2025, was less than half of Japan's and South Korea's, even adjusted for the cost of living (see chart).", "main": "Thailand's ultra-low fertility has come at unusually low income levels", "chunks": [["Thailand's ultra-low fertility has come at unusually low income levels", "泰国的超低生育率出现在异常低的收入水平上"], ["its GDP per person, of $8,100 in 2025", "2025 年人均 GDP 为 8,100 美元"], ["was less than half of Japan's and South Korea's", "不到日本和韩国的一半"], ["even adjusted for the cost of living (see chart)", "（过去分词状语）即使按生活成本调整"]], "translation": "泰国超低生育率出现在异常低的收入水平上：2025 年人均 GDP 8,100 美元，即使按生活成本调整，也不到日本和韩国的一半。", "points": ["come at a cost/level = 以…为代价/在…水平上出现", "冒号后解释；Japan's/South Korea's 后省略 GDP", "even adjusted for… 是过去分词作让步状语"]}, {"ref": "P6·S27", "text": "Fulfilling any of these promises, in any case, requires a degree of continuity and co-ordination often absent in Thai governance.", "main": "Fulfilling any of these promises requires a degree of continuity and co-ordination", "chunks": [["Fulfilling any of these promises", "（动名词主语）兑现这些承诺中的任何一个"], ["in any case", "（插入语）无论如何"], ["requires a degree of continuity and co-ordination", "需要一定程度的连续性和协调"], ["often absent in Thai governance", "（后置定语）这在泰国治理中往往缺失"]], "translation": "无论如何，要兑现这些承诺中的任何一个，都需要一定程度的连续性和协调，而这在泰国治理中往往缺失。", "points": ["动名词短语作主语，谓语用单数 requires", "in any case 插入语", "absent in… 是形容词短语作后置定语，修饰 continuity and co-ordination"]}], "qa": [{"q": "fertility 是「生育」吗？", "a": "fertility = 生育率/生育能力。文中 fertility rate = 生育率；fertility treatment = 生育治疗（IVF 等）；fertile 肥沃的/能生育的。"}, {"q": "estimates 是「数据」吗？", "a": "estimate = 估计值、估算（不是原始数据）。estimates are varied = 各方估计各不相同。动词 estimate = 估计。"}, {"q": "single rose 是「单身」吗？", "a": "这里 single = 单身者（the share of Thais … who are single），rose = rise 的过去式（上升）。合起来：单身者比例上升。不是词组 single rose（单枝玫瑰）。"}, {"q": "reproductive 是「准备生育」吗？", "a": "reproductive age = 生育年龄（通常 15–49 岁），是固定说法；reproduce = 繁殖/生育。不是「准备生育」。"}, {"q": "surged 是负面词吗？", "a": "surge = 激增、猛涨（中性偏「猛烈」）。文中 their aspirations for their kids have also surged = 对孩子的期望水涨船高。负面与否看语境：surge in demand 中性；surge in prices 偏负面。"}, {"q": "filial duty 我记成「孝敬的责任」，对吗？还有 baby bust？", "a": "对：filial duty = 孝道/赡养义务（filial = 子女的）。baby bust 与 baby boom 相对：bust = 骤降/萎缩，baby bust = 婴儿荒。"}], "vocab": [{"word": "registered", "def": "v. 登记，记录", "coll": "registered 417,000 births", "level": "L1", "note": "register v./n. 登记/注册"}, {"word": "adjusted", "def": "v. 调整（adjust 过去式/分词）", "coll": "adjusted for the cost of living", "level": "L1", "note": "adjust to 适应；adjust for 按…调整"}, {"word": "agency", "def": "n. 机构", "coll": "the national planning agency", "level": "L1", "note": "agency = 机构；also 能动性"}, {"word": "baby-making", "def": "n. 造人，生育", "coll": "local baby-making businesses", "level": "L2", "note": "口语化表达"}, {"word": "fertility", "def": "n. 生育率；生育能力", "coll": "fertility rate；fertility treatment", "level": "L2", "note": "fertile 肥沃的/能生育的"}, {"word": "estimates", "def": "n. 估计值", "coll": "estimates are varied", "level": "L2", "note": "estimate v. 估计"}, {"word": "crises", "def": "n. 危机（复数）", "coll": "fertility crises", "level": "L2", "note": "crisis 单数；复数 crises"}, {"word": "offspring", "def": "n. 后代，子女", "coll": "fewer offspring", "level": "L2", "note": "单复数同形"}, {"word": "predicament", "def": "n. 困境", "coll": "a predicament confronting…", "level": "L2", "note": "= difficult situation"}, {"word": "formal", "def": "adj. 正式的", "coll": "formal jobs", "level": "L2", "note": "formal vs informal"}, {"word": "single", "def": "adj. 单身的", "coll": "the share of Thais who are single", "level": "L2", "note": "single rose = 单身比例上升"}, {"word": "reproductive", "def": "adj. 生育的，生殖的", "coll": "reproductive age 生育年龄", "level": "L2", "note": "reproduce v. 繁殖"}, {"word": "surged", "def": "v. 激增（surge 过去式）", "coll": "aspirations have surged", "level": "L2", "note": "surge 中性偏猛烈"}, {"word": "filial duty", "def": "孝道，赡养义务", "coll": "filial duty: take care of parents", "level": "L2", "note": "filial = 子女的"}, {"word": "schemes", "def": "n. 方案，计划", "coll": "most such schemes", "level": "L2", "note": "scheme 可中性可贬（a scheme to…）"}, {"word": "beaches", "def": "n. 海滩（复数）", "coll": "golden beaches", "level": "L3", "note": "beach 复数 beaches"}, {"word": "backpackers", "def": "n. 背包客", "coll": "popular among backpackers", "level": "L3", "note": "backpack 背包"}, {"word": "prospective", "def": "adj. 潜在的，未来的", "coll": "prospective parents 准父母", "level": "L3", "note": "prospect 前景"}, {"word": "bust", "def": "n. 骤降，萎缩", "coll": "a baby bust 婴儿荒", "level": "L3", "note": "反义 boom"}, {"word": "66m", "def": "6600 万（m = million）", "coll": "the country of 66m people", "level": "L3", "note": "m 在数字中=百万"}, {"word": "demographers", "def": "n. 人口学家", "coll": "demographers at Mahidol University", "level": "L3", "note": "demography 人口学"}, {"word": "demographic", "def": "adj. 人口的，人口结构的", "coll": "Thailand's demographic slide", "level": "L3", "note": "demographic 也可作名词（人群细分）"}, {"word": "see chart", "def": "见图表", "coll": "(see chart)", "level": "L3", "note": "图表引用语"}, {"word": "confronting", "def": "v. 面临，面对（confront 的 -ing）", "coll": "a predicament confronting much of the world", "level": "L3", "note": "confront = 面对/使面临"}, {"word": "urbanisation", "def": "n. 城市化", "coll": "urbanisation has changed work", "level": "L3", "note": "英拼 -isation；美拼 -ization"}, {"word": "the share of", "def": "…的比例", "coll": "the share of Thais of reproductive age", "level": "L3", "note": "share = 份额/比例"}, {"word": "aspirations", "def": "n. 期望，抱负", "coll": "aspirations for their kids have surged", "level": "L3", "note": "aspire to 渴望"}, {"word": "elections", "def": "n. 选举", "coll": "During elections this year", "level": "L3", "note": "election 选举"}, {"word": "transfers", "def": "n. 转移支付", "coll": "cash transfers for newborns", "level": "L3", "note": "transfer = 转移/转账"}, {"word": "co-ordination", "def": "n. 协调", "coll": "continuity and co-ordination", "level": "L3", "note": "coordinate v.；co-ordination 英拼"}, {"word": "prime ministers", "def": "n. 总理，首相", "coll": "four prime ministers in five years", "level": "L3", "note": "PM 缩写"}]}], "tests": [{"id": "test1", "title": "阶段测试 1（11-12 ~ 11-19 共 8 篇）", "date": "2026-11-19", "minutes": 40, "desc": "单词三档：必备 20 · 会认 10 · 扩展（语境填空）10；长难句 5（主干 + 翻译）。共 45 题，建议 40 分钟。", "sections": [{"key": "must", "name": "一、必备词（A 类 · 20 题）", "items": [{"id": "must-01", "type": "mcq", "stem": "「revenue」最接近的意思是：", "options": ["国有的", "收入，营收", "稳定（美拼 stabilize）", "谨慎的"], "answer": "B", "explain": "revenue = 收入，营收；搭配：revenue from high-protein products"}, {"id": "must-02", "type": "mcq", "stem": "「tariffs」最接近的意思是：", "options": ["被耗尽的", "配额，限额", "关税", "创新的"], "answer": "C", "explain": "tariffs = 关税；搭配：uncertainty over American tariffs"}, {"id": "must-03", "type": "mcq", "stem": "「gains」最接近的意思是：", "options": ["谨慎的", "心理的", "灾难，祸事", "成果、进展（≠仅指钱）"], "answer": "D", "explain": "gains = 成果、进展（≠仅指钱）；搭配：gains in the 1980s；gains in education；capital gains 资本利得"}, {"id": "must-04", "type": "mcq", "stem": "「reflects」最接近的意思是：", "options": ["轮流，轮换", "被耗尽的", "稳定（美拼 stabilize）", "反映"], "answer": "D", "explain": "reflects = 反映；搭配：rising demand reflects a shift…"}, {"id": "must-05", "type": "mcq", "stem": "「mainstream」最接近的意思是：", "options": ["心理的", "谨慎的", "主流", "创新的"], "answer": "C", "explain": "mainstream = 主流；搭配：went mainstream in the 2010s"}, {"id": "must-06", "type": "mcq", "stem": "「state-owned」最接近的意思是：", "options": ["主流", "国有的", "稳定（美拼 stabilize）", "监测，关注"], "answer": "B", "explain": "state-owned = 国有的；搭配：a partly state-owned company"}, {"id": "must-07", "type": "mcq", "stem": "「stabilise」最接近的意思是：", "options": ["揭示、显示", "认知的", "稳定（美拼 stabilize）", "轮流，轮换"], "answer": "C", "explain": "stabilise = 稳定（美拼 stabilize）；搭配：to stabilise prices and supply"}, {"id": "must-08", "type": "mcq", "stem": "「cautious」最接近的意思是：", "options": ["谨慎的", "创新的", "被耗尽的", "反映"], "answer": "A", "explain": "cautious = 谨慎的；搭配：a cautious approach；be cautious about"}, {"id": "must-09", "type": "mcq", "stem": "「calamity」最接近的意思是：", "options": ["监测，关注", "认知的", "灾难，祸事", "创新的"], "answer": "C", "explain": "calamity = 灾难，祸事；搭配：the last such calamity was in 2008"}, {"id": "must-10", "type": "mcq", "stem": "「rotate」最接近的意思是：", "options": ["监测，关注", "收入，营收", "反映", "轮流，轮换"], "answer": "D", "explain": "rotate = 轮流，轮换；搭配：rotate between group instruction and…"}, {"id": "must-11", "type": "mcq", "stem": "「collateral」最接近的意思是：", "options": ["被耗尽的", "抵押品", "认知的", "稳定（美拼 stabilize）"], "answer": "B", "explain": "collateral = 抵押品；搭配：property as collateral"}, {"id": "must-12", "type": "mcq", "stem": "「depleted」最接近的意思是：", "options": ["被耗尽的", "创新的", "关税", "反映"], "answer": "A", "explain": "depleted = 被耗尽的；搭配：left its barrels depleted"}, {"id": "must-13", "type": "mcq", "stem": "「revealed」最接近的意思是：", "options": ["抵押品", "稳定（美拼 stabilize）", "揭示、显示", "成果、进展（≠仅指钱）"], "answer": "C", "explain": "revealed = 揭示、显示；搭配：reveal the truth"}, {"id": "must-14", "type": "mcq", "stem": "「quotas」最接近的意思是：", "options": ["认知的", "创新的", "配额，限额", "收入，营收"], "answer": "C", "explain": "quotas = 配额，限额；搭配：strict marketing restrictions and output quotas"}, {"id": "must-15", "type": "mcq", "stem": "「monitoring」最接近的意思是：", "options": ["监测，关注", "揭示、显示", "轮流，轮换", "
