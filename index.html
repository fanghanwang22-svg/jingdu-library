  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.add('hidden');},2200); }
  function fmt(sec){ sec=Math.max(0,Math.floor(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
  function byDate(d){ for(var i=0;i<ART.length;i++){ if(ART[i].date===d) return ART[i]; } return null; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function visibleArts(){ return ART.filter(function(a){ return a.date <= todayStr(); }); }
  function allVocab(){
    var out=[];
    ART.forEach(function(a){ (a.vocab||[]).forEach(function(v){ out.push({date:a.date, title:a.title, theme:a.theme||'综合', word:v.word, def:v.def, coll:v.coll, level:v.level, note:v.note}); }); });
    return out;
  }
  function allQA(){
    var out=[];
    ART.forEach(function(a){ (a.qa||[]).forEach(function(x){ out.push({date:a.date, title:a.title, q:x.q, a:x.a}); }); });
    return out;
  }
  function progress(a){
    var ans = state.answers[a.date]||{}, n=0;
    (a.questions||[]).forEach(function(q){ if(ans[q.id]) n++; });
    var mk = (state.marks[a.date]||[]).length;
    return {ans:n, total:(a.questions||[]).length, marks:mk};
  }
  function statusOf(a){
    if(state.completed[a.date] === true) return 'done';
    if(state.completed[a.date] === false){
      var p0 = progress(a);
      return (p0.ans>0 || p0.marks>0) ? 'doing' : 'new';
    }
    if(a.completed) return 'done';
    var p = progress(a);
    return (p.ans>0 || p.marks>0) ? 'doing' : 'new';
  }
  function statusLabel(s){ return s==='done' ? '已完成' : (s==='doing' ? '进行中' : '待读'); }
  function titleVisible(a){ return !a.hideTitle || statusOf(a)==='done'; }
  function displayTitle(a){ return titleVisible(a) ? a.title : '今日文章（标题待解锁）'; }

  /* ---------- 侧栏 ---------- */
  function renderSidebar(){
    listEl.innerHTML='';
    visibleArts().forEach(function(a){
      var p = progress(a);
      var st = statusOf(a);
      var item = document.createElement('div');
      item.className = 'art-item' + (a.date===curDate && curView==='article' ? ' active':'');
      var cls = st==='done' ? 'done' : (st==='doing' ? 'doing' : '');
      var label = statusLabel(st);
      item.innerHTML = '<div class="d"><span>'+esc(a.date)+'</span><span class="badge '+cls+'">'+label+'</span></div>'+
        '<div class="t">'+esc(titleVisible(a) ? a.title : '今日文章 · 标题待解锁')+'</div>';
      item.addEventListener('click', function(){ curDate=a.date; curView='article'; curTab='reading'; state.last=a.date; state.view='article'; state.tab='reading'; save(); renderAll(); });
      listEl.appendChild(item);
    });
    ['article','vocab','qa','test'].forEach(function(v){
      var b=document.getElementById('btn-v-'+v);
      if(b) b.classList.toggle('active', curView===v);
    });
  }

  /* ---------- 主视图 ---------- */
  function renderAll(){ renderSidebar(); renderMain(); }
  function renderMain(){
    if(curView==='test'){ renderTestView(); return; }
    if(curView==='vocab'){ renderVocabView(); return; }
    if(curView==='qa'){ renderQAView(); return; }
    var a = byDate(curDate) || (visibleArts().slice(-1)[0] || null);
    if(!a){ mainEl.innerHTML='<div class="wrap" style="padding-top:60px;color:#6b7280">📭 今天还没有文章，等早上 7:30 推送。</div>'; return; }
    curDate = a.date;
    var p = progress(a);
    mainEl.innerHTML = '';
    var wrap = document.createElement('div'); wrap.className='wrap';
    var tabs = [['reading','原文'],['translation','翻译'],['questions','题目'],['vocab','生词'],['longsent','长难句'],['qa','问答']];
    var tabHtml = tabs.map(function(t){ return '<button data-tab="'+t[0]+'" class="'+(curTab===t[0]?'active':'')+'">'+t[1]+'</button>'; }).join('');
    wrap.innerHTML =
      '<h1>'+esc(displayTitle(a))+'</h1>'+
      (titleVisible(a) && a.title_en ? '<div class="en-title">'+esc(a.title_en)+'</div>' : '')+
      (titleVisible(a) ? '' : '<div class="hint">🔒 标题已锁定：读完后点右上角「标记完成」即可解锁（避免提前剧透）。</div>')+
      '<div class="meta">'+esc(a.source)+' · '+esc(a.date)+' · '+a.words+' 词 · '+esc(a.difficulty)+' · 题材 '+esc(a.theme||'—')+' · 状态 '+statusLabel(statusOf(a))+' · 答题 '+p.ans+'/'+p.total+' · 标记 '+p.marks+'</div>'+
      '<div class="toolbar">'+
        '<span class="timer" id="timer">'+fmt(state.times[a.date]||0)+'</span>'+
        '<button id="btn-timer">'+(timerOn?'⏸ 暂停':'▶ 计时')+'</button>'+
        '<button class="ghost" id="btn-rtime" title="计时清零">↺</button>'+
        '<button class="primary" id="btn-copy">复制我的标记</button>'+
        '<button id="btn-dl">下载 .md</button>'+
        '<button id="btn-reveal">'+(state.reveal[a.date]?'隐藏解析':'显示解析')+'</button>'+
        '<button id="btn-done">'+(statusOf(a)==='done'?'取消完成':'标记完成')+'</button>'+
        '<span class="sp"></span>'+
        '<button class="ghost" id="btn-clear">清空本篇</button>'+
      '</div>'+
      '<div class="tabs" id="tabs">'+tabHtml+'</div>'+
      '<div id="tab-body"></div>';
    mainEl.appendChild(wrap);
    wrap.querySelectorAll('#tabs button').forEach(function(b){
      b.addEventListener('click', function(){ curTab=b.dataset.tab; state.tab=curTab; save(); renderMain(); });
    });
    document.getElementById('btn-copy').addEventListener('click', function(){ copyText(buildMarkdown(a), '已复制 ✓ 回聊天窗口粘贴发我'); });
    document.getElementById('btn-dl').addEventListener('click', function(){ downloadText(buildMarkdown(a), '阅读标记_'+a.date+'.md'); });
    document.getElementById('btn-clear').addEventListener('click', function(){
      if(confirm('清空本篇的标记和答案？')){ delete state.marks[a.date]; delete state.answers[a.date]; save(); renderAll(); }
    });
    document.getElementById('btn-reveal').addEventListener('click', function(){
      state.reveal[a.date] = !state.reveal[a.date];
      if(state.reveal[a.date]){ curTab='questions'; state.tab='questions'; }
      save(); renderMain();
      toast(state.reveal[a.date] ? '已显示解析 · 并切到「题目」页' : '已隐藏解析');
    });
    document.getElementById('btn-timer').addEventListener('click', function(){
      timerOn=!timerOn;
      toast(timerOn ? '开始计时' : '已暂停');
      save(); renderMain();
    });
    document.getElementById('btn-done').addEventListener('click', function(){
      state.completed[a.date] = !(statusOf(a)==='done');
      save(); renderAll();
    });
    document.getElementById('btn-rtime').addEventListener('click', function(){
      if(confirm('把本篇计时清零？')){ state.times[a.date]=0; save(); renderMain(); }
    });
    renderTab(a);
    startTimer();
  }

  function renderTab(a){
    var body = document.getElementById('tab-body');
    if(!body) return;
    body.innerHTML='';
    if(curTab==='reading'){ renderReading(a); return; }
    if(curTab==='translation'){ renderTranslation(a); return; }
    if(curTab==='questions'){ renderQuestions(a); return; }
    if(curTab==='vocab'){ renderArticleVocab(a); return; }
    if(curTab==='longsent'){ renderLongSent(a); return; }
    if(curTab==='qa'){ renderArticleQA(a); return; }
  }

  /* ---------- 原文 + 标记 ---------- */
  function renderReading(a){
    var body = document.getElementById('tab-body');
    var legend = '<div class="hint">通读时不查词；鼠标划出不懂的词/句 → 点「疑问」或生词三档；做完 4 题后可「复制我的标记」发我。</div>'+
      '<div class="legend"><span><i style="background:'+getVar('--q')+'"></i>疑问</span>'+
      '<span><i style="background:'+getVar('--w1')+'"></i>生词① 认出但不熟</span>'+
      '<span><i style="background:'+getVar('--w2')+'"></i>生词② 不认识但能猜出大意</span>'+
      '<span><i style="background:'+getVar('--w3')+'"></i>生词③ 完全不明白</span></div>';
    var art = document.createElement('div'); art.id='article';
    var g=0;
    (a.paragraphs||[]).forEach(function(para, pi){
      var p=document.createElement('p'); p.className='para';
      para.forEach(function(s){
        g++;
        var span=document.createElement('span'); span.className='sent'; span.dataset.p=pi+1; span.dataset.g=g;
        span.textContent = s + ' ';
        p.appendChild(span);
      });
      art.appendChild(p);
    });
    body.innerHTML = legend;
    body.appendChild(art);
    applyMarks(a);
  }
  function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function applyMarks(a){
    var art = document.getElementById('article'); if(!art) return;
    var ms = state.marks[a.date]||[];
    ms.forEach(function(m){
      m.g = m.g || 0;
      var span = m.g ? art.querySelector('.sent[data-g="'+m.g+'"]') : null;
      var range = null;
      if(span){
        var idx = span.textContent.indexOf(m.quote);
        if(idx>=0) range = makeRange(span, idx, idx + m.quote.length);
      }
      if(!range){
        var spans = art.querySelectorAll('.sent');
        for(var i=0;i<spans.length;i++){
          var k = spans[i].textContent.indexOf(m.quote);
          if(k>=0){ range = makeRange(spans[i], k, k + m.quote.length); break; }
        }
      }
      if(range) wrapRange(range, 'hl ' + (m.type==='q'?'hl-q':LEVEL_CLS[m.level]||'hl-w3'), m.id);
    });
  }
  function makeRange(el, s, e){
    var walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
    var pos=0, sn=null, so=0, en=null, eo=0;
    while(walker.nextNode()){
      var n=walker.currentNode, len=n.length;
      if(!sn && s>=pos && s<=pos+len){ sn=n; so=s-pos; }
      if(e>=pos && e<=pos+len){ en=n; eo=e-pos; }
      pos+=len;
      if(sn&&en) break;
    }
    if(!sn||!en) return null;
    var r=document.createRange(); r.setStart(sn,so); r.setEnd(en,eo); return r;
  }
  function wrapRange(range, cls, id){
    var art=document.getElementById('article'); if(!art) return;
    var nodes=[]; var walker=document.createTreeWalker(art,NodeFilter.SHOW_TEXT,null);
    while(walker.nextNode()){ var n=walker.currentNode; if(range.intersectsNode(n)) nodes.push(n); }
    nodes.forEach(function(node){
      var start=0,end=node.length;
      if(node===range.startContainer) start=range.startOffset;
      if(node===range.endContainer) end=range.endOffset;
      if(start>=end) return;
      var mid=node.splitText(start); mid.splitText(end-start);
      var sp=document.createElement('span'); sp.className=cls; sp.dataset.ann=id;
      mid.parentNode.insertBefore(sp,mid); sp.appendChild(mid);
    });
  }

  /* ---------- 划词气泡 ---------- */
  function hideBubble(){ bubble.classList.add('hidden'); bubble.innerHTML=''; activeAnn=null; }
  function showBubble(html, rect){
    bubble.innerHTML=html; bubble.classList.remove('hidden');
    var w=bubble.offsetWidth||220, h=bubble.offsetHeight||70;
    var left=rect.left+rect.width/2-w/2; left=Math.max(8,Math.min(left,window.innerWidth-w-8));
    var top=rect.bottom+8; if(top+h>window.innerHeight-10) top=Math.max(10,rect.top-h-8);
    bubble.style.left=left+'px'; bubble.style.top=top+'px';
  }
  document.addEventListener('mouseup', function(e){
    if(curView!=='article' || curTab!=='reading') return;
    if(bubble.contains(e.target)) return;
    var art=document.getElementById('article'); if(!art) return;
    var sel=window.getSelection(); if(!sel||sel.isCollapsed) return;
    var range=sel.getRangeAt(0);
    if(!art.contains(range.commonAncestorContainer)) return;
    if(!String(sel).trim()) return;
    lastRange=range.cloneRange();
    showBubble('<div class="bh">标记为</div>'+
      '<div class="tbar"><button data-act="q">疑问</button><button data-act="x" class="ghost">取消</button></div>'+
      '<div class="tbar"><span class="bh" style="align-self:center;padding:0 2px">生词</span>'+
      '<button data-act="w1">① 不熟</button><button data-act="w2">② 能猜</button><button data-act="w3">③ 不懂</button></div>',
      range.getBoundingClientRect());
  });
  bubble.addEventListener('click', function(e){
    var btn=e.target.closest('button'); if(!btn) return;
    var act=btn.dataset.act;
    if(act==='x'){ hideBubble(); return; }
    if(act==='q'){ addMark('q',0); return; }
    if(act==='w1'||act==='w2'||act==='w3'){ addMark('w', parseInt(act.charAt(1),10)); return; }
    if(act==='save'){ if(activeAnn){ var i=document.getElementById('note-input'); if(i) activeAnn.note=i.value.trim(); save(); } hideBubble(); toast('已记录'); return; }
    if(act==='del'){ if(activeAnn) deleteMark(activeAnn); return; }
  });
  function addMark(type, level){
    if(!lastRange) return;
    var range=lastRange.cloneRange();
    var quote=range.toString().replace(/\s+/g,' ').trim(); if(!quote){ hideBubble(); return; }
    var node=range.startContainer, el=node.nodeType===3?node.parentNode:node;
    var sentEl = el.closest ? el.closest('.sent') : null;
    var p = sentEl ? +sentEl.dataset.p : 0, g = sentEl ? +sentEl.dataset.g : 0;
    var id='a'+(++annSeq)+'-'+Date.now();
    window.getSelection().removeAllRanges();
    wrapRange(range, 'hl '+(type==='q'?'hl-q':LEVEL_CLS[level]), id);
    var ann={id:id,type:type,level:level||0,quote:quote,p:p,g:g,note:''};
    if(!state.marks[curDate]) state.marks[curDate]=[];
    state.marks[curDate].push(ann);
    save();
    activeAnn=ann;
    var rect=range.getBoundingClientRect();
    var label = type==='q' ? '已标为疑问' : '已标为'+LEVEL_TEXT[level];
    showBubble('<div class="bh">'+label+' · 可补一句问题</div>'+
      '<input id="note-input" placeholder="例如：这里修饰谁？" autocomplete="off">'+
      '<div class="row"><button data-act="save">保存</button><button data-act="del" class="ghost">删除</button></div>', rect);
    var inp=document.getElementById('note-input'); if(inp) inp.focus();
    renderSidebar();
  }
  function deleteMark(ann){
    var art=document.getElementById('article');
    if(art){ art.querySelectorAll('[data-ann="'+ann.id+'"]').forEach(function(n){
      var p=n.parentNode; while(n.firstChild) p.insertBefore(n.firstChild,n); p.removeChild(n); p.normalize();
    }); }
    var ms=state.marks[curDate]||[];
    state.marks[curDate]=ms.filter(function(x){ return x.id!==ann.id; });
    save(); hideBubble(); renderSidebar();
  }
  document.addEventListener('click', function(e){
    var hl = e.target.closest ? e.target.closest('.hl') : null;
    if(!hl) return;
    var id=hl.dataset.ann; var ann=null;
    (state.marks[curDate]||[]).forEach(function(x){ if(x.id===id) ann=x; });
    if(!ann) return;
    activeAnn=ann;
    showBubble('<div class="bh">'+(ann.type==='q'?'疑问':LEVEL_TEXT[ann.level]||'生词')+'</div>'+
      '<input id="note-input" value="'+esc(ann.note)+'" placeholder="补充一句问题（可留空）" autocomplete="off">'+
      '<div class="row"><button data-act="save">保存</button><button data-act="del" class="ghost">删除</button></div>',
      hl.getBoundingClientRect());
    var inp=document.getElementById('note-input'); if(inp) inp.focus();
  });
  document.addEventListener('mousedown', function(e){
    if(bubble.classList.contains('hidden')) return;
    if(bubble.contains(e.target)) return;
    if(e.target.closest && e.target.closest('.hl')) return;
    hideBubble();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') hideBubble(); });

  /* ---------- 翻译 / 题目 / 生词 / 长难句 / 问答 ---------- */
  function renderTranslation(a){
    var body=document.getElementById('tab-body');
    var html='<div class="hint">先自己读原文，再看翻译对答案。翻译不是「唯一正解」，重点看自己哪句理解偏了。</div>';
    if(!(a.translations||[]).length){ html+='<div class="hint">📝 这篇的全文翻译、题目解析、长难句拆解会在<b>你交卷之后</b>由我回填，稍等。</div>'; }
    (a.translations||[]).forEach(function(t,i){ html+='<div class="tr"><div class="no">P'+(i+1)+'</div><div class="zh">'+esc(t)+'</div></div>'; });
    body.innerHTML=html;
  }
  function renderQuestions(a){
    var body=document.getElementById('tab-body');
    var ans=state.answers[a.date]||{};
    var show=!!state.reveal[a.date];
    var html='<div class="hint">先点选答案；交给我后我会回填解析。「显示解析」按钮在右上角。</div>';
    (a.questions||[]).forEach(function(q){
      html+='<div class="qbox card"><div class="stem"><span class="qid">'+esc(q.id)+'</span>'+esc(q.label)+' · '+esc(q.stem)+'</div><div class="opts">';
      q.options.forEach(function(o,i){
        var letter=String.fromCharCode(65+i);
        var cls='opt'+(ans[q.id]===letter?' sel':'')+((show&&q.answer===letter)?' key':'');
        html+='<button class="'+cls+'" data-q="'+esc(q.id)+'" data-o="'+letter+'"><b>'+letter+'.</b> '+esc(o)+'</button>';
      });
      html+='</div>';
      if(show){
        html+='<div class="analysis"><b>正确答案：'+esc(q.answer)+'</b><br>'+esc(q.analysis||'');
        if(q.wrong){ html+='<div style="margin-top:6px">'; Object.keys(q.wrong).forEach(function(k){ html+='<div class="w">'+k+' 错：'+esc(q.wrong[k])+'</div>'; }); html+='</div>'; }
        html+='</div>';
      }
      html+='</div>';
    });
    body.innerHTML=html;
    body.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        if(!state.answers[a.date]) state.answers[a.date]={};
        if(state.answers[a.date][b.dataset.q]===b.dataset.o) delete state.answers[a.date][b.dataset.q];
        else state.answers[a.date][b.dataset.q]=b.dataset.o;
        save(); renderMain();
      });
    });
  }
  function renderArticleVocab(a){
    var body=document.getElementById('tab-body');
    var vs=(a.vocab||[]);
    if(!vs.length){ body.innerHTML='<div class="hint">这篇还没有生词记录。</div>'; return; }
    var groups={1:[],2:[],3:[],x:[]};
    vs.forEach(function(v){ var k=(v.level==='L1'?1:v.level==='L2'?2:v.level==='L3'?3:'x'); groups[k].push(v); });
    var html='<div class="hint">生词按你标记时的三档整理，点状态可循环切换「新收→复习中→已掌握」。</div>';
    ['x',1,2,3].forEach(function(k){
      var arr=groups[k]; if(!arr.length) return;
      var title = k==='x' ? '提问延伸' : (k===1?'生词① 认出但不熟':k===2?'生词② 不认识但能猜':'生词③ 完全不明白');
      html+='<div class="card"><div class="sub">'+title+'（'+arr.length+'）</div><table class="wtable"><thead><tr><th>单词</th><th>释义</th><th>搭配</th><th>记忆</th><th>状态</th></tr></thead><tbody>';
      arr.forEach(function(v){
        var key=a.date+'|'+v.word; var st=state.wordStatus[key]||'new';
        html+='<tr><td class="w">'+esc(v.word)+'</td><td>'+esc(v.def)+'</td><td>'+esc(v.coll||'')+'</td><td>'+esc(v.note||'')+'</td>'+
          '<td><span class="st '+(st!=='new'?st:'')+'" data-key="'+esc(key)+'">'+ST_TEXT[st]+'</span></td></tr>';
      });
      html+='</tbody></table></div>';
    });
    body.innerHTML=html;
    body.querySelectorAll('.st').forEach(function(el){
      el.addEventListener('click', function(){
        var k=el.dataset.key; var cur=state.wordStatus[k]||'new';
        var next=ST_ORDER[(ST_ORDER.indexOf(cur)+1)%ST_ORDER.length];
        state.wordStatus[k]=next; save();
        el.className='st'+(next!=='new'?' '+next:''); el.textContent=ST_TEXT[next];
      });
    });
  }
  function renderLongSent(a){
    var body=document.getElementById('tab-body');
    var ls=(a.longSentences||[]);
    if(!ls.length){ body.innerHTML='<div class="hint">这篇还没有长难句记录。</div>'; return; }
    var html='<div class="hint">按「断句 → 主干 → 逐块 → 译文 → 考点」复习；先自己拆再看。</div>';
    ls.forEach(function(s){
      html+='<div class="card"><div><span class="ref">'+esc(s.ref)+'</span></div>'+
        '<div class="en">'+esc(s.text)+'</div>'+
        '<div class="sub">主干</div><div class="vs">'+esc(s.main)+'</div>';
      if(s.chunks&&s.chunks.length){
        html+='<div class="sub">逐块拆解</div><div class="chunk">';
        s.chunks.forEach(function(c){ html+='<div class="a">'+esc(c[0])+'</div><div class="b">'+esc(c[1])+'</div>'; });
        html+='</div>';
      }
      html+='<div class="sub">译文</div><div class="vs">'+esc(s.translation)+'</div>';
      if(s.points&&s.points.length){
        html+='<div class="sub">考点</div><ul class="points">';
        s.points.forEach(function(p){ html+='<li>'+esc(p)+'</li>'; });
        html+='</ul>';
      }
      html+='</div>';
    });
    body.innerHTML=html;
  }
  function renderArticleQA(a){
    var body=document.getElementById('tab-body');
    var qa=(a.qa||[]);
    if(!qa.length){ body.innerHTML='<div class="hint">这篇还没有追问记录。</div>'; return; }
    var html='<div class="hint">这些是你读这篇文章时问过的问题，复习时先看问题、自己答一遍，再看答案。</div><div class="card">';
    qa.forEach(function(x){ html+='<div class="qa-item"><div class="qa-q">Q：'+esc(x.q)+'</div><div class="qa-a">'+esc(x.a)+'</div></div>'; });
    html+='</div>';
    body.innerHTML=html;
  }

  /* ---------- 词汇总览 / 问答总览 ---------- */
  function renderVocabView(){
    curView='vocab'; state.view='vocab'; save(); renderSidebar();
    var vs=allVocab();
    var html='<div class="wrap"><h1>词汇总览</h1><div class="meta">共 '+vs.length+' 条 · 点状态可切换「新收→复习中→已掌握」</div>'+
      '<div class="filters"><select id="f-level"><option value="">全部等级</option><option value="L1">L1 认出但不熟</option><option value="L2">L2 不认识但能猜</option><option value="L3">L3 完全不明白</option><option value="延伸">提问延伸</option></select>'+
      '<select id="f-theme"><option value="">全部题材</option></select>'+
      '<input id="f-search" placeholder="搜索单词 / 释义 / 搭配">'+
      '<span id="f-count" class="meta"></span></div><div class="card"><table class="wtable"><thead><tr><th>单词</th><th>释义</th><th>搭配</th><th>记忆</th><th>等级</th><th>题材</th><th>来源</th><th>状态</th></tr></thead><tbody id="vocab-body"></tbody></table></div></div>';
    mainEl.innerHTML=html;
    var themes=[];
    vs.forEach(function(v){ if(themes.indexOf(v.theme)<0) themes.push(v.theme); });
    var thSel=document.getElementById('f-theme');
    themes.forEach(function(t){ var o=document.createElement('option'); o.value=t; o.textContent=t; thSel.appendChild(o); });
    function draw(){
      var lv=document.getElementById('f-level').value, th=thSel.value, q=document.getElementById('f-search').value.trim().toLowerCase();
      var rows=vs.filter(function(v){
        if(lv && v.level!==lv) return false;
        if(th && v.theme!==th) return false;
        if(q){ var s=(v.word+' '+v.def+' '+v.coll+' '+v.note).toLowerCase(); if(s.indexOf(q)<0) return false; }
        return true;
      });
      document.getElementById('f-count').textContent='当前 '+rows.length+' 条';
      var tb=document.getElementById('vocab-body'); tb.innerHTML='';
      rows.forEach(function(v){
        var key=v.date+'|'+v.word; var st=state.wordStatus[key]||'new';
        var tr=document.createElement('tr');
        tr.innerHTML='<td class="w">'+esc(v.word)+'</td><td>'+esc(v.def)+'</td><td>'+esc(v.coll||'')+'</td><td>'+esc(v.note||'')+
          '</td><td>'+esc(v.level)+'</td><td>'+esc(v.theme)+'</td><td>'+esc(v.date)+'</td>'+
          '<td><span class="st '+(st!=='new'?st:'')+'">'+ST_TEXT[st]+'</span></td>';
        tr.querySelector('.st').addEventListener('click', function(ev){
          var cur=state.wordStatus[key]||'new'; var next=ST_ORDER[(ST_ORDER.indexOf(cur)+1)%ST_ORDER.length];
          state.wordStatus[key]=next; save(); draw();
        });
        tb.appendChild(tr);
      });
    }
    document.getElementById('f-level').addEventListener('change', draw);
    thSel.addEventListener('change', draw);
    document.getElementById('f-search').addEventListener('input', draw);
    draw();
  }
  function renderQAView(){
    curView='qa'; state.view='qa'; save(); renderSidebar();
    var qa=allQA();
    var html='<div class="wrap"><h1>问答记录</h1><div class="meta">共 '+qa.length+' 条 · 从精读中沉淀的问题与答案</div><div class="card">';
    qa.forEach(function(x){
      html+='<div class="qa-item"><div class="qa-q">Q：'+esc(x.q)+'</div><div class="qa-a">'+esc(x.a)+'</div><div class="meta" style="margin-top:4px">'+esc(x.date)+' · '+esc(x.title)+'</div></div>';
    });
    html+='</div></div>';
    mainEl.innerHTML=html;
  }

  /* ---------- 导出 / 复制 ---------- */
  function elapsedText(date){ return fmt(state.times[date]||0); }
  function buildMarkdown(a){
    var L=[]; var ans=state.answers[a.date]||{};
    var ms=state.marks[a.date]||[];
    var qs=ms.filter(function(m){return m.type==='q';});
    var ws=ms.filter(function(m){return m.type==='w';});
    L.push('# 阅读标记 · '+a.date+' · '+a.title);
    L.push('');
    L.push('- 用时：'+elapsedText(a.date));
    L.push('- 答案：'+(a.questions||[]).map(function(q){return q.id+'-'+(ans[q.id]||'?');}).join(' / '));
    L.push('- 标记数：'+ms.length+'（疑问 '+qs.length+'；生词 '+ws.length+'）');
    L.push('');
    L.push('## 一、疑问（'+qs.length+'）');
    if(!qs.length) L.push('（无）');
    qs.forEach(function(m,i){ L.push(''); L.push((i+1)+'. **P'+m.p+'·S'+m.g+'** “'+m.quote+'”'); if(m.note) L.push('   - 我的问题：'+m.note); });
    L.push('');
    L.push('## 二、生词（'+ws.length+'）');
    if(!ws.length) L.push('（无）');
    [1,2,3].forEach(function(k){
      var arr=ws.filter(function(m){return m.level===k;});
      if(!arr.length) return;
      L.push(''); L.push('### '+LEVEL_TEXT[k]+'（'+arr.length+'）');
      arr.forEach(function(m,i){ L.push(''); L.push((i+1)+'. **P'+m.p+'·S'+m.g+'** “'+m.quote+'”'); if(m.note) L.push('   - 备注：'+m.note); });
    });
    L.push('');
    L.push('---');
    L.push('（由精读库导出）');
    return L.join('\n');
  }
  function copyText(text, ok){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(ok); }, function(){ fallbackCopy(text, ok); });
    } else fallbackCopy(text, ok);
  }
  function fallbackCopy(text, ok){
    var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(ok); }catch(e){ toast('复制失败，请用「下载 .md」'); }
    document.body.removeChild(ta);
  }
  function downloadText(text, name){
    var blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
  }
  document.getElementById('btn-export').addEventListener('click', function(){
    var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='精读库备份_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
    toast('备份已下载');
  });
  document.getElementById('btn-import').addEventListener('click', function(){ document.getElementById('file-import').click(); });
  document.getElementById('file-import').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{ var o=JSON.parse(r.result); state=normalize(o); persist(); renderAll(); toast('备份已导入'); }
      catch(err){ toast('文件格式不对'); }
    };
    r.readAsText(f);
  });
  ['btn-v-article','btn-v-vocab','btn-v-qa','btn-v-test'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(){
      var v=id==='btn-v-article'?'article':(id==='btn-v-vocab'?'vocab':(id==='btn-v-qa'?'qa':'test'));
      curView=v; state.view=v; save(); renderAll();
    });
  });


  /* ---------- 阶段测试 ---------- */
  function testById(id){
    var ts = DATA.tests || [];
    for(var i=0;i<ts.length;i++){ if(ts[i].id===id) return ts[i]; }
    return null;
  }
  function testTotal(t){ var n=0; (t.sections||[]).forEach(function(s){ n += (s.items||[]).length; }); return n; }
  function renderTestView(){
    var draft = state.testDraft;
    if(draft && !draft.submitted){
      var t = testById(draft.id);
      if(t){ renderTestRunner(t, draft); return; }
      state.testDraft = null;
    }
    var tests = DATA.tests || [];
    mainEl.innerHTML='';
    var wrap = document.createElement('div'); wrap.className='wrap';
    var h = '<h1>阶段测试</h1><div class="meta">周期性巩固 · 单词三档（必备 / 会认 / 扩展）+ 长难句 · 自动判分 · 成绩存本地</div>';
    if(!tests.length){ h += '<div class="hint">还没有测试数据。</div>'; }
    tests.forEach(function(t){
      var res = state.tests[t.id];
      h += '<div class="card tcard"><div class="tt">'+esc(t.title)+'</div>'+
        '<div class="meta" style="margin:6px 0 10px">'+esc(t.date||'')+' · '+testTotal(t)+' 题 · 建议 '+(t.minutes||40)+' 分钟</div>'+
        '<div class="tdesc">'+esc(t.desc||'')+'</div>'+
        '<div class="tbar">'+
          (res ? '<span class="tres">上次成绩 <b>'+res.score+'/'+res.total+'</b> · '+esc(res.at||'')+'</span>' : '<span class="tres">未做过</span>')+
          (res ? '<button data-result="'+esc(t.id)+'">查看上次结果</button>' : '')+
          '<button class="primary" data-start="'+esc(t.id)+'">'+(res?'重新测试':'开始测试')+'</button>'+
        '</div></div>';
    });
    wrap.innerHTML = h;
    mainEl.appendChild(wrap);

    wrap.querySelectorAll('button[data-result]').forEach(function(b){
      b.addEventListener('click', function(){ var tt = testById(b.dataset.result); if(tt) renderTestResult(tt); });
    });
    wrap.querySelectorAll('button[data-start]').forEach(function(b){
      b.addEventListener('click', function(){
        state.testDraft = {id: b.dataset.start, sel:{}, startedAt: Date.now(), submitted:false};
        save(); renderMain();
      });
    });
  }
  function renderTestRunner(t, draft){
    mainEl.innerHTML='';
    var wrap = document.createElement('div'); wrap.className='wrap';
    var left = (t.minutes||40)*60 - Math.floor((Date.now()-draft.startedAt)/1000);
    if(left<0) left=0;
    var h = '<h1>'+esc(t.title)+'</h1>'+
      '<div class="meta">共 '+testTotal(t)+' 题 · 建议 '+(t.minutes||40)+' 分钟 · 已答 <span id="test-answered">'+Object.keys(draft.sel||{}).length+'</span>/'+testTotal(t)+'</div>'+
      '<div class="toolbar"><span class="timer" id="test-remaining">'+fmt(left)+'</span>'+
      '<button class="primary" id="btn-submit-test">交卷</button>'+
      '<button class="ghost" id="btn-abandon-test">放弃</button></div>';
    (t.sections||[]).forEach(function(sec){
      h += '<div class="tsec"><div class="sub">'+esc(sec.name)+'</div>';
      (sec.items||[]).forEach(function(it, idx){
        var sel = (draft.sel||{})[it.id] || '';
        var opts = (it.options||[]).map(function(o, i){
          var L = 'ABCD'[i];
          return '<button class="opt'+(sel===L?' sel':'')+'" data-q="'+esc(it.id)+'" data-l="'+L+'"><b>'+L+'</b>'+esc(o)+'</button>';
        }).join('');
        h += '<div class="qbox tq" data-qid="'+esc(it.id)+'"><div class="stem"><span class="qid">'+(idx+1)+'</span>'+esc(it.stem).replace(/\n/g,'<br>')+'</div><div class="opts">'+opts+'</div></div>';
      });
      h += '</div>';
    });
    wrap.innerHTML = h;
    mainEl.appendChild(wrap);
    wrap.querySelectorAll('.opt[data-q]').forEach(function(btn){
      btn.addEventListener('click', function(){
        draft.sel[btn.dataset.q] = btn.dataset.l;
        var box = wrap.querySelector('.tq[data-qid="'+btn.dataset.q+'"]');
        if(box){ box.querySelectorAll('.opt').forEach(function(b){ b.classList.toggle('sel', b.dataset.l===btn.dataset.l); }); }
        var anEl = document.getElementById('test-answered');
        if(anEl) anEl.textContent = Object.keys(draft.sel||{}).length;
        save();
      });
    });
    document.getElementById('btn-abandon-test').addEventListener('click', function(){
      if(confirm('放弃本次测试？已选答案不会保存。')){ state.testDraft=null; save(); renderMain(); }
    });
    document.getElementById('btn-submit-test').addEventListener('click', function(){
      var unanswered = testTotal(t) - Object.keys(draft.sel||{}).length;
      if(unanswered>0 && !confirm('还有 '+unanswered+' 题未答，确定交卷？')) return;
      var score=0, total=0;
      (t.sections||[]).forEach(function(sec){ (sec.items||[]).forEach(function(it){
        total++;
        if(draft.sel[it.id]===it.answer) score++;
      });});
      var now = new Date();
      state.tests[t.id] = {score:score, total:total, at: now.toLocaleString('zh-CN',{hour12:false}), sel: draft.sel};
      state.testDraft = null;
      save(); renderTestResult(t);
    });
  }
  function renderTestResult(t){
    var res = state.tests[t.id] || {score:0,total:0,sel:{}};
    mainEl.innerHTML='';
    var wrap = document.createElement('div'); wrap.className='wrap';
    var pct = res.total ? Math.round(res.score*100/res.total) : 0;
    var h = '<h1>'+esc(t.title)+' · 成绩</h1>'+
      '<div class="card tresult"><div class="bigscore">'+res.score+' / '+res.total+'</div><div class="meta">正确率 '+pct+'% · '+esc(res.at||'')+'</div>'+
      '<div class="toolbar" style="margin-top:10px"><button class="primary" id="btn-copy-test">复制成绩与错题</button><button id="btn-again-test">再测一次</button><button id="btn-back-test">返回测试列表</button></div></div>';
    (t.sections||[]).forEach(function(sec){
      h += '<div class="tsec"><div class="sub">'+esc(sec.name)+'</div>';
      (sec.items||[]).forEach(function(it){
        var mine = (res.sel||{})[it.id]||'';
        var ok = mine===it.answer;
        var opts = (it.options||[]).map(function(o,i){
          var L='ABCD'[i];
          var cls = L===it.answer ? ' key' : (L===mine ? ' wrong' : '');
          return '<div class="opt ro'+cls+'"><b>'+L+'</b>'+esc(o)+(L===it.answer?' ✓':'')+(L===mine&&!ok?' ✗ 你的选择':'')+'</div>';
        }).join('');
        h += '<div class="qbox"><div class="stem"><span class="qid'+(ok?' ok':' bad')+'">'+(ok?'✓':'✗')+'</span>'+esc(it.stem).replace(/\n/g,'<br>')+'</div><div class="opts">'+opts+'</div><div class="analysis">'+esc(it.explain||'').replace(/\n/g,'<br>')+'</div></div>';
      });
      h += '</div>';
    });
    wrap.innerHTML=h;
    mainEl.appendChild(wrap);
    
    document.getElementById('btn-copy-test').addEventListener('click', function(){
      var lines = ['阶段测试：' + t.title, '成绩：' + res.score + '/' + res.total + '（正确率 ' + pct + '%）', '', '分板块：'];
      (t.sections||[]).forEach(function(sec){
        var got=0, tot=0;
        (sec.items||[]).forEach(function(it){ tot++; if((res.sel||{})[it.id]===it.answer) got++; });
        lines.push('· ' + sec.name + '：' + got + '/' + tot);
      });
      lines.push('', '错题：');
      (t.sections||[]).forEach(function(sec){
        (sec.items||[]).forEach(function(it){
          var mine = (res.sel||{})[it.id] || '（未答）';
          if(mine !== it.answer){
            lines.push('[' + sec.key + '] ' + it.id + ' | 我：' + mine + ' 正确：' + it.answer + ' | ' + it.stem.replace(/\n/g, ' '));
          }
        });
      });
      copyText(lines.join('\n'), '已复制成绩与错题 ✓ 回聊天窗口粘贴');
    });
document.getElementById('btn-back-test').addEventListener('click', function(){ renderTestView(); });
    document.getElementById('btn-again-test').addEventListener('click', function(){
      state.testDraft = {id:t.id, sel:{}, startedAt: Date.now(), submitted:false}; save(); renderMain();
    });
  }

  /* ---------- 计时 ---------- */
  function startTimer(){
    if(timerHandle) clearInterval(timerHandle);
    timerHandle=setInterval(function(){
      if(curView==='test' && state.testDraft && !state.testDraft.submitted){
        var tEl=document.getElementById('test-remaining');
        if(tEl){ var tt=testById(state.testDraft.id); var lim=(tt&&tt.minutes?tt.minutes:40)*60; var lf=lim-Math.floor((Date.now()-state.testDraft.startedAt)/1000); tEl.textContent=fmt(lf>0?lf:0); }
        return;
      }
      if(curView!=='article' || !curDate) return;
      if(!timerOn) return;
      if(document.visibilityState!=='visible') return;
      state.times[curDate]=(state.times[curDate]||0)+1;
      var el=document.getElementById('timer');
      if(el) el.textContent=elapsedText(curDate);
      if(state.times[curDate]%10===0) save();
    },1000);
  }

  /* ---------- 启动 ---------- */
  function init(){
    var ok=load();
    var vis = visibleArts();
    curDate = (state.last && vis.filter(function(a){return a.date===state.last;}).length)
      ? state.last : (vis.length ? vis[vis.length-1].date : null);
    curView = state.view || 'article';
    curTab = state.tab || 'reading';
    renderAll();
    persist();
    var linkReview = document.getElementById('link-review');
    if(linkReview && location.protocol === 'file:') linkReview.href = '记忆训练.html';
    var builtEl = document.getElementById('built');
    if(builtEl && DATA.builtAt) builtEl.textContent = '数据更新 ' + DATA.builtAt;
    startTimer();
    var p=progress(byDate(curDate)||{questions:[],date:''});
    if(p.total>0) state.reveal[curDate]=state.reveal[curDate]||false;
  }
  init();
})();
</script>
