<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>记忆训练 · 考研英语</title>
<style>
:root{--ink:#1f2328;--paper:#fbfaf7;--line:#e7e3da;--accent:#8a6a00;--muted:#6b7280;
  --good:#2f7a43;--bad:#a33;--mid:#b07a00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink)}
.app{max-width:820px;margin:0 auto;padding:18px 16px 80px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:20px;margin:0}
.sub{font-size:12.5px;color:var(--muted)}
nav{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
nav button{font:inherit;font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#39404a}
nav button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.stat-line{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.stat-line b{color:var(--ink);font-size:15px}
.word-card{text-align:center;padding:44px 18px 30px;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;background:#f1ede3;color:#7a5c00}
.badge.A{background:#e8f1ff;color:#2255a0}
.badge.B{background:#f3f0e8;color:#6b5d2f}
.badge.C{background:#f3e8ff;color:#6b21a8}
.word{font-family:Georgia,"Times New Roman",serif;font-size:52px;font-weight:600;letter-spacing:.01em;word-break:break-word;line-height:1.15}
.hint{font-size:12.5px;color:#9aa0a8}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.ratings button{font:inherit;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:#fbfaf7;cursor:pointer;font-size:13.5px;line-height:1.35}
.ratings button:hover{background:#f5f1e6}
.ratings button small{display:block;font-size:11px;color:#9aa0a8}
.r1{border-color:#e0b4b0}.r2{border-color:#e6d3a8}.r3{border-color:#b9d3bd}.r4{border-color:#b6cfe8}
.reveal{background:#f8f6f0;border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;margin-top:16px;font-size:14.5px;line-height:1.85;display:none}
.reveal.show{display:block}
.reveal .meta{font-size:12px;color:var(--muted);margin-top:6px}
.next-row{display:flex;gap:10px;align-items:center;margin-top:14px}
button.primary{font:inherit;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;font-size:14px}
button.ghost{font:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13.5px}
.progress{height:6px;background:#eee9dd;border-radius:99px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0%}
.empty{text-align:center;color:var(--muted);padding:50px 10px;line-height:2}
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wrow{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid #f0ede5;border-radius:10px;background:#fff;flex-wrap:wrap}
.wrow .w{font-family:Georgia,serif;font-weight:600;font-size:15.5px;min-width:120px}
.wrow .d{flex:1;font-size:13px;color:#39404a;line-height:1.6;min-width:180px}
.wrow .st{font-size:11px;color:var(--muted);white-space:nowrap}
.wrow .del{font-size:11.5px;color:#a33;cursor:pointer;border:none;background:none;text-decoration:underline;padding:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filters input,.filters select{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.addform{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:8px;margin-top:12px}
.addform input{font:inherit;font-size:13.5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px;align-items:end;height:150px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bar i{display:block;width:100%;background:#e3d3a8;border-radius:6px 6px 0 0;min-height:2px}
.bar span{font-size:10.5px;color:var(--muted)}
.bar b{font-size:11px;color:#7a5c00}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kv div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv b{display:block;font-size:22px;margin-bottom:2px}
.kv span{font-size:12px;color:var(--muted)}
.about{font-size:13.5px;line-height:1.9}
.about h3{font-size:14.5px;margin:18px 0 6px}
.about code{background:#f3f0e8;padding:1px 5px;border-radius:4px;font-size:12.5px}
.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:620px){
  .word{font-size:40px}
  .ratings{grid-template-columns:repeat(2,1fr)}
  .addform{grid-template-columns:1fr}
  .app{padding:14px 12px 70px}
}
</style>
</head>
<body>
<div class="app">

  <main id="main"></main>
</div>

        '<span class="d">'+esc(w.def||'（无释义）')+'<br><span class="hint">'+esc(w.coll||'')+'</span></span>'+
        '<span class="st">'+st+(w.tier==='A'?' · A类':'')+(w.custom?' · 手动':'')+'</span>'+
        (w.custom ? '<button class="del" data-del="'+esc(w.id)+'">删除</button>' : '')+
        (c ? '<button class="del" data-reset="'+esc(w.id)+'">重置进度</button>' : '')+
      '</div>';
    });
    html += '</div></div>';
    main.innerHTML = html;
    var fq = document.getElementById('f-q'), fs = document.getElementById('f-st');
    fs.value = listFilter.state;
    fq.addEventListener('input', function(){ listFilter.q = fq.value; var pos = fq.selectionStart; renderWords(); var el=document.getElementById('f-q'); el.focus(); el.setSelectionRange(pos,pos); });
    fs.addEventListener('change', function(){ listFilter.state = fs.value; renderWords(); });
    document.getElementById('btn-add').addEventListener('click', function(){
      var word = document.getElementById('add-word').value.trim();
      if(!word) return toast('单词不能为空');
      var id = 'c:' + word.toLowerCase();
      if(wordMap()[id]) return toast('这个单词已经存在');
      store.custom.push({id:id, word:word, def:document.getElementById('add-def').value.trim()||'（待补）', coll:document.getElementById('add-coll').value.trim(), level:'custom', tier:'C', date:new Date().toISOString().slice(0,10), custom:true});
      save(); toast('已添加：'+word); listFilter.q=''; listFilter.state='custom'; renderWords();
    });
    main.querySelectorAll('button[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.del;
        if(!confirm('删除这个手动添加的单词？')) return;
        store.custom = store.custom.filter(function(w){ return w.id !== id; });
        delete store.cards[id]; save(); renderWords();
      });
    });
    main.querySelectorAll('button[data-reset]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!confirm('重置这个词的记忆进度？')) return;
        delete store.cards[b.dataset.reset]; save(); renderWords();
      });
    });
  }

  /* ---------- 统计 ---------- */
  function renderStats(){
    var now = Date.now();
    var cards = store.cards;
    var ids = Object.keys(cards);
    var due = ids.filter(function(id){ return cards[id].due <= now; }).length;
    var learning = ids.filter(function(id){ return cards[id].state==='learning'; }).length;
    var review = ids.filter(function(id){ return cards[id].state==='review'; }).length;
    var mature = ids.filter(function(id){ return cards[id].state==='mature'; }).length;
    var totalReviews = ids.reduce(function(n,id){ return n + (cards[id].reps||0); }, 0);
    var totalLapses = ids.reduce(function(n,id){ return n + (cards[id].lapses||0); }, 0);
    var retr = totalReviews ? Math.round(100*(1-totalLapses/totalReviews)) : 0;
    // streak
    var days = {};
    (store.sessions||[]).forEach(function(s){ days[s.at] = true; });
    var streak = 0, d = new Date();
    for(;;){
      var key = d.toISOString().slice(0,10);
      if(days[key]){ streak++; d.setDate(d.getDate()-1); } else break;
    }
    // forecast
    var forecast = [], maxF = 1;
    for(var i=0;i<7;i++){
      var start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate()+i);
      var end = start.getTime()+DAY;
      var n = ids.filter(function(id){ var due=cards[id].due; return due>=start.getTime() && due<end; }).length;
      if(i===0) n += due; // 今日已到期
      forecast.push({label: i===0?'今天':(i===1?'明天':(i+'天')), n:n});
      if(n>maxF) maxF=n;
    }
    var recentHtml = ((store.sessions||[]).slice(-7).reverse().map(function(x){
      return '<div class="stat-line" style="margin:6px 0 0"><span>'+esc(x.at)+'</span><span>'+x.n+' 张</span><span>忘记 '+x.again+'</span></div>';
    }).join('') || '<div class="hint">还没有训练记录</div>');
    var html = '<div class="kv">'+
      '<div><b>'+allWords().length+'</b><span>词库总数</span></div>'+
      '<div><b>'+due+'</b><span>今日待复习</span></div>'+
      '<div><b>'+newWords().length+'</b><span>未学新词</span></div>'+
      '<div><b>'+learning+'</b><span>学习中</span></div>'+
      '<div><b>'+review+'</b><span>复习中</span></div>'+
      '<div><b>'+mature+'</b><span>已稳固（≥21天）</span></div>'+
      '<div><b>'+retr+'%</b><span>累计记忆率（1-遗忘率）</span></div>'+
      '<div><b>'+streak+'</b><span>连续训练天数</span></div></div>'+
      '<div class="card"><div style="font-weight:700">未来 7 天到期预测</div><div class="bars">'+forecast.map(function(f){
        return '<div class="bar"><b>'+f.n+'</b><i style="height:'+Math.round(f.n/maxF*100)+'%"></i><span>'+f.label+'</span></div>';
      }).join('')+'</div><div class="hint" style="margin-top:8px">今日数字含已到期+新词额度；复习间隔按 90% 目标保持率反推。</div></div>'+
      '<div class="card"><div style="font-weight:700">最近训练</div>'+recentHtml+'</div>'+
      '<div class="card"><div style="font-weight:700">设置</div>'+
        '<div class="stat-line" style="margin-top:10px;align-items:center"><span>每天新词：<input id="set-new" type="number" min="0" max="999" value="'+store.settings.newPerDay+'" style="width:70px;font:inherit;font-size:13px;padding:5px 8px;border:1px solid #e7e3da;border-radius:7px"></span>'+
        '<button class="ghost" id="btn-save-set">保存</button>'+
        '<span style="margin-left:4px">快捷：'+
          [20,30,50,999].map(function(v){ return '<button class="ghost" data-pre="'+v+'" style="padding:4px 10px;font-size:12px;margin-left:4px">'+(v===999?'全部':'+'+v)+'</button>'; }).join('')+
        '</span></div>'+
        '<div class="hint" style="margin-top:6px">未学新词还有 '+newWords().length+' 个；按当前额度约需 '+Math.ceil(newWords().length/Math.max(1,store.settings.newPerDay))+' 天清完。改额度后：若今天还没开始训练，立即生效。</div>'+
        '<div class="backup"><button class="ghost" id="btn-export">导出备份</button><button class="ghost" id="btn-import">导入备份</button><button class="ghost" id="btn-wipe" style="color:#a33;border-color:#e0b4b0">清空全部数据</button><input type="file" id="file-import" accept="application/json,.json" hidden></div>'+
        '<div class="hint" style="margin-top:8px">备份包含：记忆进度 + 手动添加的词 + 设置。换设备/清缓存前记得导出。</div></div>';
    document.getElementById('main').innerHTML = '<div class="card" style="padding-bottom:6px"><div style="font-size:15px;font-weight:700;margin-bottom:8px">学习状态</div><div style="font-size:12.5px;color:#6b7280">词库更新：'+esc(DATA.builtAt||'')+' · 数据只存在你的浏览器本地</div></div>'+html;
    function setQuota(v){
      store.settings.newPerDay = v >= 999 ? 999 : Math.max(0, Math.min(200, v));
      save(); renderStats();
      toast(v>=999 ? '已设为：每天清空全部未学新词' : '已保存：每天 '+store.settings.newPerDay+' 个新词');
    }
    document.getElementById('btn-save-set').addEventListener('click', function(){
      var v = parseInt(document.getElementById('set-new').value,10);
      setQuota(isNaN(v) ? 25 : v);
    });
    document.querySelectorAll('button[data-pre]').forEach(function(b){
      b.addEventListener('click', function(){ setQuota(parseInt(b.dataset.pre,10)); });
    });
    document.getElementById('btn-wipe').addEventListener('click', function(){
      if(!confirm('清空全部记忆进度（不可恢复，建议先导出备份）？')) return;
      if(!confirm('再确认一次：清空后从第 1 天重新开始？')) return;
      store = normalize({settings: store.settings});
      save(); localStorage.removeItem(LSKEY); save();
      toast('已清空，重新开始');
      renderStats();
    });
    document.getElementById('btn-export').addEventListener('click', function(){
      var blob = new Blob([JSON.stringify(store,null,1)],{type:'application/json;charset=utf-8'});
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = '记忆训练备份_'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
    });
    document.getElementById('btn-import').addEventListener('click', function(){ document.getElementById('file-import').click(); });
    document.getElementById('file-import').addEventListener('change', function(e){
      var f = e.target.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        try{ store = normalize(JSON.parse(r.result)); save(); toast('备份已导入'); renderStats(); }
        catch(err){ toast('文件格式不对'); }
      };
      r.readAsText(f);
    });
  }

  /* ---------- 关于 ---------- */
  function renderAbout(){
    document.getElementById('main').innerHTML = '<div class="card about">'+
      '<h3>为什么是「自评」而不是选择题</h3>'+
      '<p>选择题会给你「提示」——看到四个选项时才想起意思，这叫再认（recognition）；而真实阅读需要的是提取（recall）。所以这里只给单词，让你自己判断能不能说出意思、能不能造句，再由你给 4 档评分。这是主动检索（retrieval practice），研究表明比重复阅读更有利于长期记忆（Karpicke &amp; Blunt, <i>Science</i>, 2011）。</p>'+
      '<h3>调度算法（FSRS 思想简化版）</h3>'+
      '<p>参考 FSRS（Free Spaced Repetition Scheduler，Anki 1.0 时代 SM-2 的现代替代）：每张卡有<b>稳定度 S</b>（记忆能撑多少天）和<b>难度 D</b>。间隔按目标保持率反推：<code>R(t,S)=exp(ln0.9·t/S)</code>，即复习间隔≈S 天时，预测保持率 90%。</p>'+
      '<ul>'+
        '<li><b>忘记</b>：S 缩到 25%（首次则 10 分钟后再来），D 上升</li>'+
        '<li><b>模糊</b>：S 增 15%，D 略升</li>'+
        '<li><b>认识</b>：S 增 75%，D 下降</li>'+
        '<li><b>很熟</b>：S 增 140%，D 明显下降</li>'+
      '</ul>'+
      '<p>首次评分后的初始稳定度：忘记 10 分钟 / 模糊 1.2 天 / 认识 2.5 天 / 很熟 6 天。90% 是记忆效果与复习负担的平衡点（FSRS 与 Anki 文档默认值）。</p>'+
      '<p><b>课内重考（learning steps）</b>：每次训练只做一轮，但同一张卡可能在本次内多次出现——评「忘记」会隔 2 张卡再考，「模糊」隔 4 张卡再考，最多 3 次；评「认识/很熟」本次过关。出现次数由你的答题表现动态决定，这是 Anki 类软件的标准做法，用短间隔重复巩固刚学的词。</p>'+
      '<p><b>每天只训练一次</b>：完成当日训练后，当天不能再开新的一轮；忘记的词会在下一次训练优先出现。</p>'+
      '<h3>其它设计</h3>'+
      '<p><b>首日</b>：2026-11-22 作为第 1 天；开始日期前打开只显示准备页，不会消耗训练日。</p>'+
      '<ul>'+
        '<li><b>新词额度</b>：每天默认 30 个，A 类核心词优先；统计页可调 20/30/50/全部（全部=当天清空未学词）。</li>'+
        '<li><b>难词</b>：反复「忘记」的词 lapses 会增加，间隔增长变慢——系统会自然给你更多次接触。</li>'+
        '<li><b>词库来源</b>：只来自每日精读产生的生词（单词本.md 自动同步）+ 你手动添加的词。</li>'+
        '<li><b>隐私</b>：全部数据存在浏览器 localStorage，不上传服务器；换设备用导出/导入备份。</li>'+
      '</ul>'+
      '<h3>参考</h3>'+
      '<ul style="font-size:13px">'+
        '<li>FSRS 算法：open-spaced-repetition/awesome-fsrs wiki（The Algorithm）</li>'+
        '<li>FSRS vs SM-2：目标保持率 90% 的默认设置</li>'+
        '<li>Karpicke, J. D., &amp; Blunt, J. R. (2011). Retrieval practice produces more learning than elaborative studying. <i>Science</i>, 331(6018), 772–775.</li>'+
        '<li>Anki 四档评分（Again / Hard / Good / Easy）与 FSRS 调度实践</li>'+
      '</ul></div>';
  }

  /* ---------- 视图切换 ---------- */
  var curView = 'train';
  function go(view){
    curView = view;
    ['train','words','stats','about'].forEach(function(v){
      var b = document.getElementById('nav-'+v);
      if(b) b.classList.toggle('active', v===view);
    });
    if(view==='train') renderTrain();
    else if(view==='words') renderWords();
    else if(view==='stats') renderStats();
    else renderAbout();
  }
  document.querySelectorAll('nav button').forEach(function(b){
    b.addEventListener('click', function(){ go(b.dataset.view); });
  });

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function(e){
    if(curView !== 'train') return;
    var tag = (e.target.tagName||'').toLowerCase();
    if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if(e.key >= '1' && e.key <= '4'){ if(document._rateFn) document._rateFn(parseInt(e.key,10)); }
    else if(e.key === ' '){ e.preventDefault(); if(document._nextFn) document._nextFn(); }
  });

  /* ---------- 启动 ---------- */
  go('train');
})();
</script>
</body>
</html>
